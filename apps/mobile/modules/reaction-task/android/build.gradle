apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.otgdreaction'
version = '1.0.0'

android {
  namespace 'expo.modules.otgdreaction'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
  }
  testOptions { unitTests.returnDefaultValues = true }
  sourceSets { test.resources.srcDirs += ['../fixtures'] }
}
dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
  // Expo adds modules-core to testImplementation, but its internal React
  // implementation dependency is not exposed on our test compile classpath.
  // The app's React Gradle plugin resolves this to package.json's pinned version.
  testImplementation 'com.facebook.react:react-android'
}
