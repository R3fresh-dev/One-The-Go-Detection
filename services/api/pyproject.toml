[project]
name = "otgd-api"
version = "1.0.0"
description = "Versioned measurement-only application service"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi>=0.120,<1", "uvicorn>=0.35,<1", "sqlalchemy>=2.0.44,<2.1",
 "psycopg[binary]>=3.2,<4", "boto3>=1.40,<2", "PyJWT[crypto]>=2.10,<3",
 "rfc8785>=0.1.4,<1", "jsonschema>=4.26,<5", "referencing>=0.37,<1",
 "pydantic-settings>=2.10,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1"
]
[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "PyYAML>=6,<7",
    "openapi-spec-validator>=0.8,<1",
    "ruff>=0.13,<1",
]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["otgd"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires actual PostgreSQL", "localstack: requires actual LocalStack S3 and SQS"]
