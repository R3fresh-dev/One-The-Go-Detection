name: Inspect serverless AWS failure
on:
  push:
    branches: [work-aws-serverless-inspection]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: R3fresh-dev/One-The-Go-Detection
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 34cf9b728c14455e14268c398e372ba905be5cfd
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.0'
          python-version: '3.12'
      - run: uv sync --project services/api --locked
      - name: Verify current and historical reviewed source admission before AWS authentication
        run: |
          gh run download 38275856416 --name exact-revision-merge-evidence --dir .local/inspect-gates/current
          gh run download 38222770720 --name exact-revision-merge-evidence --dir .local/inspect-gates/historical
          gh api repos/R3fresh-dev/One-The-Go-Detection/git/ref/heads/main --jq .object.sha > .local/inspect-gates/current-main.txt
          uv run --project services/api python - <<'PY'
          from pathlib import Path
          from deploy import platform
          revision = '34cf9b728c14455e14268c398e372ba905be5cfd'
          assert Path('.local/inspect-gates/current-main.txt').read_text().strip() == revision
          platform.require_clean_source(revision)
          platform.verify_gate_file(Path('.local/inspect-gates/current/gates.json'), revision)
          platform.verify_gate_file(Path('.local/inspect-gates/historical/gates.json'),
              '264cd2e92a4a5a9d4f76a09d79722b3083099040')
          PY
      - name: Download and bind the original failed main recovery manifest without printing it
        run: |
          gh run view 38272959415 --json headSha,headBranch,event,workflowName > .local/inspect-gates/recovery-run.json
          uv run --project services/api python - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path('.local/inspect-gates/recovery-run.json').read_text())
          assert run['headSha'] == '264cd2e92a4a5a9d4f76a09d79722b3083099040'
          assert run['headBranch'] == 'main' and run['event'] == 'workflow_dispatch'
          assert run['workflowName'] == 'Deploy serverless development to AWS'
          PY
          gh run download 38272959415 --name serverless-deployment-264cd2e92a4a5a9d4f76a09d79722b3083099040-38272959415 --dir .local/inspect-recovery
          uv run --project services/api python - <<'PY'
          from pathlib import Path
          from deploy.serverless_recovery import _read_source_manifest
          paths = list(Path('.local/inspect-recovery').rglob('initial-recovery.json'))
          assert len(paths) == 1
          manifest = _read_source_manifest(paths[0],
              '23f3ae3773ae25ba4f9f8f7c60e5590049832de9654d8d95f6fb853bf457751e')
          assert manifest['release_id'] == '264cd2e92a4a5a9d4f76a09d79722b3083099040'
          PY
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-2
          allowed-account-ids: '738470137867'
          unset-current-credentials: true
          force-skip-oidc: true
          output-credentials: false
      - name: Verify detached recovery readiness through reviewed AWS reads only
        run: |
          uv run --project services/api python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          from botocore.exceptions import ClientError
          from deploy.platform import CloudSession
          from deploy.provenance import Gate
          from deploy.serverless_recovery import _read_source_manifest, _verify_source_manifest
          revision = '34cf9b728c14455e14268c398e372ba905be5cfd'
          digest = '23f3ae3773ae25ba4f9f8f7c60e5590049832de9654d8d95f6fb853bf457751e'
          try:
              current_main = subprocess.check_output(['gh', 'api',
                  'repos/R3fresh-dev/One-The-Go-Detection/git/ref/heads/main', '--jq', '.object.sha'],
                  text=True).strip()
              if current_main != revision:
                  raise Gate('Reviewed main revision changed before read-only recovery verification')
              paths = list(Path('.local/inspect-recovery').rglob('initial-recovery.json'))
              if len(paths) != 1:
                  raise Gate('Expected the single bound original recovery manifest')
              source = _read_source_manifest(paths[0], digest)
              config = json.loads(Path('infra/config/serverless.example.json').read_text())
              if (config['environment'] != 'serverless-development' or config['account'] != '738470137867'
                      or config['region'] != 'us-east-2' or config['monthlyBudgetUsd'] != 50):
                  raise Gate('Read-only recovery target differs from reviewed serverless configuration')
              config['releaseId'] = revision
              plan = _verify_source_manifest(CloudSession('us-east-2', None), config, source)
              canonical = hashlib.sha256(json.dumps(plan['import_template'], sort_keys=True,
                  separators=(',', ':')).encode()).hexdigest()
              result = {'status': 'read-only-recovery-ready', 'release_id': revision,
                  'account': plan['account'], 'region': plan['region'],
                  'original_stack_id': plan['original_stack_id'],
                  'original_release_id': plan['original_release_id'],
                  'source_manifest_sha256': digest, 'canonical_import_template_sha256': canonical,
                  'retained_resource_count': len(plan['retained_physical_ids']),
                  'logical_ids': sorted(plan['retained_physical_ids']),
                  'deleted_stack_history_event_count': plan['initial_state']['stack_event_count'],
                  'mutations_executed': False}
          except ClientError as error:
              result = {'status': 'blocked', 'failure_type': 'ClientError',
                  'operation': str(error.operation_name)[:100],
                  'error_code': str(error.response.get('Error', {}).get('Code', ''))[:100],
                  'message': str(error.response.get('Error', {}).get('Message', ''))[:1000],
                  'mutations_executed': False}
          except Gate as error:
              result = {'status': 'blocked', 'failure_type': 'Gate', 'message': str(error)[:1000],
                  'mutations_executed': False}
          print(json.dumps(result, indent=2))
          if result['status'] != 'read-only-recovery-ready':
              raise SystemExit(1)
          PY
