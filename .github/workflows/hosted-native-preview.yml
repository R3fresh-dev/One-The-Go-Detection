name: Prepare hosted native guest previews

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-native-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  APP_ENV: local
  EXPO_PUBLIC_HOSTED_PREVIEW: 'true'
  EXPO_NO_DOTENV: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_URL: https://unavailable.invalid
  EXPO_PUBLIC_OAUTH_ISSUER: https://unavailable.invalid
  EXPO_PUBLIC_OAUTH_CLIENT_ID: otgd-hosted-fictional

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate preview tooling without service calls
        run: python3 -m unittest infra.test.test_hosted_preview -v
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck && npm run test:coverage
        working-directory: apps/mobile
      - run: node modules/scripts/verify-native-assets.mjs
        working-directory: apps/mobile
      - run: node node_modules/expo/bin/cli prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Require reviewed Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          otgd_android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          otgd_sdkmanager="$otgd_android_sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$otgd_sdkmanager"
          "$otgd_sdkmanager" --sdk_root="$otgd_android_sdk" 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$otgd_android_sdk/platforms/android-36/android.jar"
          test -x "$otgd_android_sdk/build-tools/36.0.0/aapt2"
      - name: Compile Kotlin fixtures and bundled development-signed guest APK
        run: ./gradlew --no-daemon --max-workers=2 --init-script ../modules/scripts/local-preview.init.gradle -PreactNativeDevServerPort=8082 -PreactNativeArchitectures=arm64-v8a,x86_64 :otgd-reaction-task:testDebugUnitTest :otgd-eye-capture:testDebugUnitTest :app:assembleRelease
        working-directory: apps/mobile/android
      - run: python3 scripts/ci_gate.py verify-junit apps/mobile/modules/reaction-task/android/build/test-results/testDebugUnitTest/*.xml
      - run: python3 scripts/ci_gate.py verify-junit apps/mobile/modules/eye-capture/android/build/test-results/testDebugUnitTest/*.xml
      - run: python3 modules/scripts/verify_android_preview.py
        working-directory: apps/mobile
      - name: Bind inspected APK to exact committed preview sources
        run: python3 apps/mobile/modules/scripts/hosted_preview.py prepare --platform android --artifact apps/mobile/native-build/otgd-local-preview.apk --manifest apps/mobile/native-build/android-hosted-preview.json
      - run: python3 apps/mobile/modules/scripts/hosted_preview.py review --artifact apps/mobile/native-build/otgd-local-preview.apk --manifest apps/mobile/native-build/android-hosted-preview.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-hosted-guest-${{ github.sha }}
          path: |
            apps/mobile/native-build/otgd-local-preview.apk
            apps/mobile/native-build/android-hosted-preview.json
          retention-days: 7
          if-no-files-found: error
      - name: Record hosted-preview boundary
        run: echo 'Bundled, local, development-signed guest APK prepared. No Appetize upload, hosted launch, physical device qualification or store distribution occurred.' >> "$GITHUB_STEP_SUMMARY"

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: xcodebuild -version
      - name: Validate preview tooling without service calls
        run: python3 -m unittest infra.test.test_hosted_preview infra.test.test_swift_xctest_report -v
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck && npm run test:coverage
        working-directory: apps/mobile
      - run: node modules/scripts/verify-native-assets.mjs
        working-directory: apps/mobile
      - name: Execute Swift fixtures and require every native lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          rm -f reports/ios-hosted-native.xml reports/ios-hosted-native.log
          swift test --package-path apps/mobile/modules/reaction-task --scratch-path "$RUNNER_TEMP/otgd-hosted-reaction-swift" --parallel --num-workers 1 --verbose --disable-swift-testing --xunit-output "$PWD/reports/ios-hosted-native.xml" 2>&1 | tee reports/ios-hosted-native.log
          python3 scripts/verify-swift-xctest.py reports/ios-hosted-native.xml reports/ios-hosted-native.log
          python3 scripts/ci_gate.py verify-junit reports/ios-hosted-native.xml
          rm -f reports/ios-hosted-optical.xml reports/ios-hosted-optical.log
          swift test --package-path apps/mobile/modules/eye-capture --scratch-path "$RUNNER_TEMP/otgd-hosted-optical-swift" --parallel --num-workers 1 --verbose --disable-swift-testing --xunit-output "$PWD/reports/ios-hosted-optical.xml" 2>&1 | tee reports/ios-hosted-optical.log
          python3 scripts/verify-swift-xctest.py reports/ios-hosted-optical.xml reports/ios-hosted-optical.log
          python3 scripts/ci_gate.py verify-junit reports/ios-hosted-optical.xml
      - name: Generate canonical iOS project and install pods
        run: |
          node node_modules/expo/bin/cli prebuild --platform ios --no-install
          pod install --project-directory=ios
        working-directory: apps/mobile
      - name: Compile bundled unsigned ARM64 simulator guest app
        run: python3 modules/scripts/build_ios.py
        working-directory: apps/mobile
      - name: Inspect actual simulator binary and bind exact committed preview sources
        run: python3 apps/mobile/modules/scripts/hosted_preview.py prepare --platform ios --artifact apps/mobile/native-build/otgd-ios-simulator.app.zip --manifest apps/mobile/native-build/ios-hosted-preview.json
      - run: python3 apps/mobile/modules/scripts/hosted_preview.py review --artifact apps/mobile/native-build/otgd-ios-simulator.app.zip --manifest apps/mobile/native-build/ios-hosted-preview.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-hosted-guest-${{ github.sha }}
          path: |
            apps/mobile/native-build/otgd-ios-simulator.app.zip
            apps/mobile/native-build/ios-hosted-preview.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-hosted-native-reports-${{ github.sha }}
          path: |
            reports/ios-hosted-native.xml
            reports/ios-hosted-native.log
            reports/ios-hosted-optical.xml
            reports/ios-hosted-optical.log
          retention-days: 7
          if-no-files-found: error
      - name: Record hosted-preview boundary
        run: echo 'Bundled unsigned ARM64 iOS Simulator guest app prepared. No Appetize upload, hosted launch, iPhone/TestFlight signing, physical timing or sensing qualification occurred.' >> "$GITHUB_STEP_SUMMARY"
