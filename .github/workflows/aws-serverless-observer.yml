          def bucket_inventory(bucket):
              owner = ['--bucket', bucket, '--expected-bucket-owner', ACCOUNT]
              location = aws('s3api', 'get-bucket-location', owner, 'LocationConstraint')
              if location != REGION:
                  return {'location': location, 'presence': 'absent' if isinstance(location, dict) and location.get('presence') == 'absent' else 'unverified',
                          'observation_error_code': 'OhioBucketLocationNotProven'}
              value = {'bucket': bucket, 'location': location,
                  'tags': aws('s3api', 'get-bucket-tagging', owner, 'TagSet'),
                  'versioning': aws('s3api', 'get-bucket-versioning', owner),
                  'object_lock': aws('s3api', 'get-object-lock-configuration', owner, 'ObjectLockConfiguration'),
                  'encryption': aws('s3api', 'get-bucket-encryption', owner, 'ServerSideEncryptionConfiguration'),
                  'public_access_block': aws('s3api', 'get-public-access-block', owner, 'PublicAccessBlockConfiguration')}
              versions, markers, key_marker, version_marker, complete = [], [], None, None, False
              for _ in range(4):
                  result = aws('s3api', 'list-object-versions', [*owner, '--max-keys', '1000',
                      *(['--key-marker', key_marker] if key_marker else []), *(['--version-id-marker', version_marker] if version_marker else [])],
                      '{Versions:Versions[].{Key:Key,VersionId:VersionId,Size:Size,StorageClass:StorageClass,IsLatest:IsLatest},DeleteMarkers:DeleteMarkers[].{Key:Key,VersionId:VersionId},IsTruncated:IsTruncated,NextKeyMarker:NextKeyMarker,NextVersionIdMarker:NextVersionIdMarker}')
                  if not isinstance(result, dict) or 'IsTruncated' not in result:
                      value['version_scan_error'] = result
                      break
                  versions.extend(result.get('Versions') or [])
                  markers.extend(result.get('DeleteMarkers') or [])
                  if result['IsTruncated'] is False:
                      complete = True
                      break
                  key_marker, version_marker = result.get('NextKeyMarker'), result.get('NextVersionIdMarker')
                  if not isinstance(key_marker, str) or not isinstance(version_marker, str):
                      value['version_scan_error'] = {'observation_error_code': 'InvalidPaginationToken'}
                      break
              by_key = {}
              by_storage_class = {}
              for version in versions:
                  digest = hashlib.sha256(version['Key'].encode()).hexdigest()
                  by_key[digest] = by_key.get(digest, 0) + 1
                  storage = version.get('StorageClass') or 'UNVERIFIED'
                  item = by_storage_class.setdefault(storage, {'version_count': 0, 'version_bytes': 0})
                  item['version_count'] += 1
                  item['version_bytes'] += version.get('Size', 0)
              value.update({'version_scan_complete': complete, 'version_count': len(versions), 'delete_marker_count': len(markers),
                  'version_bytes': sum(v.get('Size', 0) for v in versions), 'latest_version_count': sum(v.get('IsLatest') is True for v in versions),
                  'key_sha256_version_counts': by_key, 'storage_class_summary': by_storage_class, 'object_keys_and_version_ids_exported': False})
              protections = []
              for version in versions[:40]:
                  options = [*owner, '--key', version['Key'], '--version-id', version['VersionId']]
                  metadata = aws('s3api', 'head-object', options,
                      '{ContentLength:ContentLength,ServerSideEncryption:ServerSideEncryption,SSEKMSKeyId:SSEKMSKeyId,ObjectLockMode:ObjectLockMode,ObjectLockRetainUntilDate:ObjectLockRetainUntilDate,ObjectLockLegalHoldStatus:ObjectLockLegalHoldStatus}')
                  proof = {'key_sha256': hashlib.sha256(version['Key'].encode()).hexdigest(),
                      'opaque_version_sha256': hashlib.sha256((version['Key'] + '\0' + version['VersionId']).encode()).hexdigest(), 'metadata': metadata}
                  if isinstance(value.get('object_lock'), dict) and value['object_lock'].get('ObjectLockEnabled') == 'Enabled':
                      proof['retention'] = aws('s3api', 'get-object-retention', options, 'Retention')
                      proof['legal_hold'] = aws('s3api', 'get-object-legal-hold', options, 'LegalHold')
                  protections.append(proof)
              value['version_protection_metadata'] = protections
              lock = value.get('object_lock')
              lock_known = isinstance(lock, dict) and (lock.get('ObjectLockEnabled') == 'Enabled'
                  or lock.get('observation_error_code') == 'ObjectLockConfigurationNotFoundError')
              value['object_lock_configuration_known'] = lock_known
              value['protection_scan_complete'] = lock_known and complete and len(versions) <= 40 and all(
