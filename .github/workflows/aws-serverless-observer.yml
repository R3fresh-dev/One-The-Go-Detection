name: Read-only East 1 and West 2 preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work-aws-regional-preflight' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: R3fresh-dev/One-The-Go-Detection
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      AWS_MAX_ATTEMPTS: '3'
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6bca4fc7a77d268f35ea6a5b0f577f37389158cc
          persist-credentials: false

      - name: Admit clean current main and exact successful all-14 job evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          revision = '6bca4fc7a77d268f35ea6a5b0f577f37389158cc'
          repository = 'R3fresh-dev/One-The-Go-Detection'
          run_id = 38316406153
          workflow_path = '.github/workflows/merge-gate.yml'
          required_jobs = {'unit-coverage', 'components', 'atdd', 'preview / ios',
              'platform / postgres-integration', 'native / android', 'native / protected-reader',
              'native / ios', 'platform / localstack-integration', 'native / shared-and-firmware',
              'platform / contracts-and-synthesis', 'platform / fargate-container-runtime', 'preview / android', 'merge-gate'}
          required_labels = {'unit-coverage', 'atdd', 'components', 'performance', 'live-dependencies',
              'docker-health', 'localstack-api', 'specifications', 'native-android', 'native-ios',
              'firmware', 'hosted-android', 'hosted-ios'}

          def command(args, timeout=30):
              result = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
              if result.returncode or len(result.stdout.encode()) > 2097152:
                  raise SystemExit('Read-only snapshot admission blocked: command unavailable (' + ' '.join(args[:2]) + ')')
              return result.stdout

          def api(path):
              return json.loads(command(['gh', 'api', ('repos/' + repository + '/' + path).rstrip('/')]))

          if (os.environ['GH_REPO'] != repository or os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch'
                  or os.environ['GITHUB_REF'] != 'refs/heads/work-aws-regional-preflight'
                  or command(['git', 'rev-parse', 'HEAD']).strip() != revision
                  or command(['git', 'status', '--porcelain']).strip()):
              raise SystemExit('Read-only snapshot admission blocked: source or trigger differs')
          if (api('')['default_branch'] != 'main'
                  or api('git/ref/heads/main')['object']['sha'] != revision):
              raise SystemExit('Read-only snapshot admission blocked: current main differs')
          run = api('actions/runs/' + str(run_id))
          if (run.get('head_sha') != revision or run.get('status') != 'completed'
                  or run.get('conclusion') != 'success' or run.get('path') != workflow_path
                  or run.get('head_branch') != 'main' or run.get('event') not in {'push', 'workflow_dispatch'}
                  or run.get('repository', {}).get('full_name') != repository
                  or run.get('head_repository', {}).get('full_name') != repository):
              raise SystemExit('Read-only snapshot admission blocked: gate run differs')
          workflow = api('actions/workflows/' + str(run['workflow_id']))
          if workflow.get('path') != workflow_path or workflow.get('state') != 'active':
              raise SystemExit('Read-only snapshot admission blocked: gate workflow differs')
          latest = api('actions/workflows/merge-gate.yml/runs?head_sha=' + revision + '&per_page=100')
          trusted = [r for r in latest['workflow_runs'] if r.get('head_sha') == revision
              and r.get('path') == workflow_path and r.get('head_branch') == 'main'
              and r.get('event') in {'push', 'workflow_dispatch'}]
          if not trusted or max(r['id'] for r in trusted) != run_id:
              raise SystemExit('Read-only snapshot admission blocked: latest gate differs')
          inventory = api(f"actions/runs/{run_id}/attempts/{run['run_attempt']}/jobs?per_page=100")
          jobs = inventory['jobs']
          if (inventory['total_count'] != 14 or len(jobs) != 14
                  or {job['name'] for job in jobs} != required_jobs
                  or len({job['id'] for job in jobs}) != 14
                  or any(job.get('status') != 'completed' or job.get('conclusion') != 'success'
                      or job.get('head_sha') != revision or job.get('run_id') != run_id
                      or job.get('run_attempt') != run['run_attempt'] for job in jobs)):
              raise SystemExit('Read-only snapshot admission blocked: all-14 jobs differ')
          with tempfile.TemporaryDirectory(prefix='observer-gates-') as destination:
              command(['gh', 'run', 'download', str(run_id), '--repo', repository,
                  '--name', 'exact-revision-merge-evidence', '--dir', destination], timeout=60)
              path = Path(destination) / 'gates.json'
              if not path.is_file() or path.stat().st_size > 262144:
                  raise SystemExit('Read-only snapshot admission blocked: aggregate evidence unavailable')
              evidence = json.loads(path.read_text())
              labels = evidence.get('passed')
              if (evidence.get('revision') != revision
                      or evidence.get('run_url') != f'https://github.com/{repository}/actions/runs/{run_id}'
                      or not isinstance(labels, list) or len(labels) != 13 or set(labels) != required_labels):
                  raise SystemExit('Read-only snapshot admission blocked: aggregate evidence differs')
          current = api('actions/runs/' + str(run_id))
          if any(current.get(k) != run.get(k) for k in ('id', 'head_sha', 'run_attempt', 'status', 'conclusion', 'workflow_id')):
              raise SystemExit('Read-only snapshot admission blocked: gate changed')
          if (api('git/ref/heads/main')['object']['sha'] != revision
                  or command(['git', 'status', '--porcelain']).strip()):
              raise SystemExit('Read-only snapshot admission blocked: source changed')
          print(json.dumps({'admitted_revision': revision, 'gate_run': run_id, 'successful_jobs': 14}))
          PYCODE

      - name: Configure existing repository AWS secrets after source admission
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          allowed-account-ids: '738470137867'
          unset-current-credentials: true
          force-skip-oidc: true
          output-credentials: false
          retry-max-attempts: 3
          action-timeout-s: 90

      - name: Read selected regional capacity and named resource metadata only
        id: regional
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time

          ACCOUNT = '738470137867'
          REGIONS = ('us-east-1', 'us-west-2')
          STACKS = ('otgd-serverless-development', 'otgd-serverless-development-registry', 'otgd-qa-platform')
          ALLOWED = {('sts', 'get-caller-identity'), ('ec2', 'describe-availability-zones'),
                     ('rds', 'describe-db-engine-versions'), ('rds', 'describe-orderable-db-instance-options'),
                     ('rds', 'describe-db-clusters'), ('rds', 'describe-db-instances'),
                     ('cloudformation', 'describe-stacks'), ('pricing', 'get-products')}
          STARTED = time.monotonic()
          DESTINATION = Path(os.environ['RUNNER_TEMP']) / 'regional-preflight'
          DESTINATION.mkdir(mode=0o700, exist_ok=False)
          snapshot = {'schema_version': '1.0.0', 'operation': 'read-only-regional-preflight',
                      'snapshot_utc': datetime.now(timezone.utc).isoformat(), 'account': ACCOUNT,
                      'source_revision': '6bca4fc7a77d268f35ea6a5b0f577f37389158cc', 'gate_run_id': 38316406153,
                      'observer_run_id': os.environ['GITHUB_RUN_ID'], 'observer_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'targets': {}, 'pricing': [], 'aws_mutations': []}


          def persist():
              raw = (json.dumps(snapshot, indent=2, sort_keys=True) + '\n').encode()
              path = DESTINATION / 'regional-preflight.json'
              path.write_bytes(raw)
              path.chmod(0o600)


          def aws(service, operation, region, options=(), query=None):
              if (service, operation) not in ALLOWED or region not in REGIONS:
                  raise SystemExit('Regional observation operation or region is outside its read-only allowlist')
              if time.monotonic() - STARTED > 480:
                  return {'observation_error_code': 'ObservationDeadlineExceeded'}
              args = ['aws', service, operation, '--region', region, '--output', 'json', '--no-paginate',
                      '--cli-connect-timeout', '10', '--cli-read-timeout', '20', *options]
              if query:
                  args += ['--query', query]
              try:
                  result = subprocess.run(args, capture_output=True, text=True, timeout=40)
              except subprocess.TimeoutExpired:
                  return {'observation_error_code': 'BoundedTimeout'}
              if result.returncode:
                  match = re.search(r'An error occurred \(([A-Za-z0-9_.-]+)\)', result.stderr)
                  code = match.group(1) if match else 'CommandUnavailable'
                  absent = (code in {'DBClusterNotFoundFault', 'DBInstanceNotFound'}
                            or (service == 'cloudformation' and code == 'ValidationError'
                                and re.search(r'Stack with id [^\n]+ does not exist', result.stderr)))
                  return {'observation_error_code': code, 'presence': 'absent' if absent else 'unverified'}
              if len(result.stdout.encode()) > 2_097_152:
                  return {'observation_error_code': 'ResponseBoundExceeded'}
              try:
                  return json.loads(result.stdout)
              except ValueError:
                  return {'observation_error_code': 'MalformedJson'}


          def rds_pages(operation, region, options, query, collection, max_pages=5):
              rows, marker = [], None
              for _ in range(max_pages):
                  result = aws('rds', operation, region,
                               [*options, '--max-records', '100', *(['--marker', marker] if marker else [])], query)
                  if not isinstance(result, dict) or not isinstance(result.get(collection), list):
                      return result
                  rows += result[collection]
                  marker = result.get('Marker')
                  if not marker:
                      return {'rows': rows, 'complete': True}
                  if not isinstance(marker, str) or len(marker) > 4096:
                      return {'observation_error_code': 'PaginationMarkerInvalid'}
              return {'observation_error_code': 'PaginationBoundExceeded', 'observed_row_count': len(rows), 'complete': False}


          for region in REGIONS:
              identity = aws('sts', 'get-caller-identity', region, query='Account')
              if identity != ACCOUNT:
                  raise SystemExit('Regional observation blocked: actual account differs')
              target = {'account': identity, 'region': region, 'stacks': {}}
              snapshot['targets'][region] = target
              zones = aws('ec2', 'describe-availability-zones', region,
                          ['--all-availability-zones', '--filters', 'Name=zone-type,Values=availability-zone'],
                          'AvailabilityZones[].{ZoneName:ZoneName,ZoneId:ZoneId,State:State,ZoneType:ZoneType,OptInStatus:OptInStatus,RegionName:RegionName}')
              target['availability_zones'] = zones
              target['eligible_standard_vpc_origin_zones'] = sorted(
                  [row for row in zones if isinstance(row, dict) and row.get('State') == 'available'
                   and row.get('ZoneType') == 'availability-zone' and row.get('RegionName') == region
                   and not (region == 'us-east-1' and row.get('ZoneId') == 'use1-az3')],
                  key=lambda row: (row.get('ZoneId', ''), row.get('ZoneName', ''))) if isinstance(zones, list) else []
              engines = rds_pages('describe-db-engine-versions', region, ['--engine', 'aurora-postgresql'],
                  '{Versions:DBEngineVersions[].{Engine:Engine,EngineVersion:EngineVersion,Status:Status,DBParameterGroupFamily:DBParameterGroupFamily,SupportedEngineModes:SupportedEngineModes,ServerlessV2FeaturesSupport:ServerlessV2FeaturesSupport},Marker:Marker}', 'Versions')
              if isinstance(engines, dict) and engines.get('complete'):
                  engine_rows = [row for row in engines['rows'] if row.get('Status') == 'available'
                                 and re.fullmatch(r'16\.\d+', row.get('EngineVersion', ''))]
                  target['available_aurora_postgresql_16'] = engine_rows
                  zero = [row for row in engine_rows if isinstance(row.get('ServerlessV2FeaturesSupport'), dict) and row['ServerlessV2FeaturesSupport'].get('MinCapacity') == 0]
                  target['zero_min_capacity_versions'] = sorted(row['EngineVersion'] for row in zero)
                  if zero:
                      selected = max(zero, key=lambda row: int(row['EngineVersion'].split('.')[1]))['EngineVersion']
                      target['selected_latest_zero_min_capacity_engine'] = selected
                      orderable = rds_pages('describe-orderable-db-instance-options', region,
                          ['--engine', 'aurora-postgresql', '--engine-version', selected, '--db-instance-class', 'db.serverless'],
                          '{Options:OrderableDBInstanceOptions[].{Engine:Engine,EngineVersion:EngineVersion,DBInstanceClass:DBInstanceClass,AvailabilityZones:AvailabilityZones,SupportedNetworkTypes:SupportedNetworkTypes,Vpc:Vpc},Marker:Marker}', 'Options')
                      target['selected_serverless_orderable'] = orderable
                      target['selected_serverless_dual_network_available'] = (
                          isinstance(orderable, dict) and orderable.get('complete') is True
                          and any('DUAL' in row.get('SupportedNetworkTypes', []) for row in orderable['rows']))
              else:
                  target['available_aurora_postgresql_16'] = engines
              for name in (*STACKS, *(('otgd-fargate-development-us-west-2-recovery',) if region == 'us-west-2' else ())):
                  target['stacks'][name] = aws('cloudformation', 'describe-stacks', region, ['--stack-name', name],
                      'Stacks[].{StackName:StackName,StackId:StackId,StackStatus:StackStatus,EnableTerminationProtection:EnableTerminationProtection}')
              target['named_database_cluster'] = aws('rds', 'describe-db-clusters', region,
                  ['--db-cluster-identifier', 'otgd-serverless-development'],
                  'DBClusters[].{DBClusterIdentifier:DBClusterIdentifier,DBClusterArn:DBClusterArn,DbClusterResourceId:DbClusterResourceId,Status:Status,Engine:Engine,EngineVersion:EngineVersion,StorageEncrypted:StorageEncrypted,DeletionProtection:DeletionProtection}')
              target['named_database_writer'] = aws('rds', 'describe-db-instances', region,
                  ['--db-instance-identifier', 'otgd-serverless-development-writer'],
                  'DBInstances[].{DBInstanceIdentifier:DBInstanceIdentifier,DBInstanceArn:DBInstanceArn,DbiResourceId:DbiResourceId,DBInstanceStatus:DBInstanceStatus,AvailabilityZone:AvailabilityZone,Engine:Engine,EngineVersion:EngineVersion,PubliclyAccessible:PubliclyAccessible,StorageEncrypted:StorageEncrypted}')
              persist()
              print(json.dumps({'regional_target': target}, sort_keys=True), flush=True)

          price_requests = [
              ('AmazonECS', 'us-east-1', 'USE1-Fargate-vCPU-Hours:perCPU', {}),
              ('AmazonECS', 'us-east-1', 'USE1-Fargate-GB-Hours', {}),
              ('AmazonRDS', 'us-east-1', 'USE1-Aurora:ServerlessV2Usage', {'databaseEngine': 'Aurora PostgreSQL'}),
              ('AmazonRDS', 'us-east-1', 'USE1-Aurora:StorageUsage', {'databaseEngine': 'Aurora PostgreSQL'}),
              ('AmazonRDS', 'us-east-1', 'USE1-Aurora:BackupUsage', {'databaseEngine': 'Aurora PostgreSQL'}),
              ('AmazonRDS', 'us-west-2', 'USW2-Aurora:BackupUsage', {'databaseEngine': 'Aurora PostgreSQL'}),
              ('AmazonS3', 'us-west-2', 'USW2-TimedStorage-ByteHrs', {}),
          ]
          for service, region, usage, extras in price_requests:
              filters = [{'Type': 'TERM_MATCH', 'Field': field, 'Value': value}
                         for field, value in {'regionCode': region, 'usagetype': usage, **extras}.items()]
              observed = {'service': service, 'target_region': region, 'filters': filters, 'products': [], 'complete': False}
              token = None
              for _ in range(2):
                  response = aws('pricing', 'get-products', 'us-east-1',
                      ['--service-code', service, '--filters', json.dumps(filters), '--max-results', '100',
                       *(['--next-token', token] if token else [])])
                  if not isinstance(response, dict) or not isinstance(response.get('PriceList'), list):
                      observed['observation'] = response
                      break
                  for raw in response['PriceList']:
                      product = json.loads(raw)
                      dimensions = [dimension for term in product.get('terms', {}).get('OnDemand', {}).values()
                                    for dimension in term.get('priceDimensions', {}).values()]
                      attributes = product.get('product', {}).get('attributes', {})
                      observed['products'].append({'sku': product.get('product', {}).get('sku'),
                          'publicationDate': product.get('publicationDate'), 'productFamily': product.get('product', {}).get('productFamily'),
                          'attributes': {key: attributes.get(key) for key in ('regionCode', 'location', 'usagetype', 'databaseEngine', 'operation')},
                          'priceDimensions': [{key: dimension.get(key) for key in
                              ('rateCode', 'unit', 'beginRange', 'endRange', 'pricePerUnit')} for dimension in dimensions]})
                  token = response.get('NextToken')
                  if not token:
                      observed['complete'] = True
                      break
              if token and not observed['complete']:
                  observed['observation_error_code'] = 'PaginationBoundExceeded'
              snapshot['pricing'].append(observed)
              persist()
              print(json.dumps({'selected_official_price_query': observed}, sort_keys=True), flush=True)
          snapshot['completed_utc'] = datetime.now(timezone.utc).isoformat()
          persist()
          print(json.dumps({'snapshot_path': 'regional-preflight.json', 'snapshot_sha256': hashlib.sha256(
              (DESTINATION / 'regional-preflight.json').read_bytes()).hexdigest(), 'aws_mutations': []}), flush=True)
          PYCODE

      - name: Preserve bounded credential-free regional preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: readonly-regional-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/regional-preflight/
          if-no-files-found: warn
          retention-days: 7
