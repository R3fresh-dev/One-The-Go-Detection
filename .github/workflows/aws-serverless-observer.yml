          record('old_global_budget_tags', aws('budgets', 'list-tags-for-resource', ['--resource-arn', 'arn:aws:budgets::' + ACCOUNT + ':budget/' + budget], 'ResourceTags'))
          snapshot['aws_call_count'] = CALLS
          snapshot['completed_utc'] = datetime.now(timezone.utc).isoformat()
          persist()
          print(json.dumps({'artifact': 'ohio-inventory.json', 'artifact_sha256': hashlib.sha256((DESTINATION / 'ohio-inventory.json').read_bytes()).hexdigest(),
              'aws_call_count': CALLS, 'aws_mutations': []}, sort_keys=True), flush=True)
          PYCODE

      - name: Preserve bounded credential-free Ohio inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: readonly-ohio-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ohio-inventory/
          if-no-files-found: warn
          retention-days: 7
