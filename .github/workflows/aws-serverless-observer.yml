name: Stop exact owned Ohio Aurora only

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work-aws-ohio-stop' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: R3fresh-dev/One-The-Go-Detection
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      AWS_MAX_ATTEMPTS: '1'
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6bca4fc7a77d268f35ea6a5b0f577f37389158cc
          persist-credentials: false

      - name: Admit immutable historical qualified source for exact Ohio database stop only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib
          import io
          import json
          import os
          import subprocess
          import zipfile

          revision = '6bca4fc7a77d268f35ea6a5b0f577f37389158cc'
          source_tree = '2d7b50c07ab35b3db6fb3d3069928cc595cbb1cd'
          observed_main = 'f06f9b036dcb1d82df26cc71a1cfb2fbdf315697'
          artifact_id = 11777961370
          artifact_digest = 'sha256:eb7da6b70d0678a393321576e44fd7912f01a470b1708576578461ca1276eed8'
          repository = 'R3fresh-dev/One-The-Go-Detection'
          run_id = 38316406153
          workflow_path = '.github/workflows/merge-gate.yml'
          required_jobs = {'unit-coverage', 'components', 'atdd', 'preview / ios',
              'platform / postgres-integration', 'native / android', 'native / protected-reader',
              'native / ios', 'platform / localstack-integration', 'native / shared-and-firmware',
              'platform / contracts-and-synthesis', 'platform / fargate-container-runtime', 'preview / android', 'merge-gate'}
          required_labels = {'unit-coverage', 'atdd', 'components', 'performance', 'live-dependencies',
              'docker-health', 'localstack-api', 'specifications', 'native-android', 'native-ios',
              'firmware', 'hosted-android', 'hosted-ios'}

          def command(args, timeout=30):
              result = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
              if result.returncode or len(result.stdout.encode()) > 2097152:
                  raise SystemExit('Read-only snapshot admission blocked: command unavailable (' + ' '.join(args[:2]) + ')')
              return result.stdout

          def api(path):
              return json.loads(command(['gh', 'api', ('repos/' + repository + '/' + path).rstrip('/')]))

          if (os.environ['GH_REPO'] != repository or os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch'
                  or os.environ['GITHUB_REF'] != 'refs/heads/work-aws-ohio-stop'
                  or command(['git', 'rev-parse', 'HEAD']).strip() != revision
                  or command(['git', 'rev-parse', 'HEAD^{tree}']).strip() != source_tree
                  or command(['git', 'status', '--porcelain']).strip()):
              raise SystemExit('Read-only snapshot admission blocked: source or trigger differs')
          if (api('')['default_branch'] != 'main'
                  or api('git/ref/heads/main')['object']['sha'] != observed_main):
              raise SystemExit('Read-only snapshot admission blocked: current main differs')
          run = api('actions/runs/' + str(run_id))
          if (run.get('head_sha') != revision or run.get('status') != 'completed'
                  or run.get('conclusion') != 'success' or run.get('path') != workflow_path
                  or run.get('head_branch') != 'main' or run.get('event') != 'push' or run.get('run_attempt') != 1
                  or run.get('repository', {}).get('full_name') != repository
                  or run.get('head_repository', {}).get('full_name') != repository):
              raise SystemExit('Read-only snapshot admission blocked: gate run differs')
          workflow = api('actions/workflows/' + str(run['workflow_id']))
          if workflow.get('path') != workflow_path or workflow.get('state') != 'active':
              raise SystemExit('Read-only snapshot admission blocked: gate workflow differs')
          latest = api('actions/workflows/merge-gate.yml/runs?head_sha=' + revision + '&per_page=100')
          trusted = [r for r in latest['workflow_runs'] if r.get('head_sha') == revision
              and r.get('path') == workflow_path and r.get('head_branch') == 'main'
              and r.get('event') == 'push']
          if not trusted or max(r['id'] for r in trusted) != run_id:
              raise SystemExit('Read-only snapshot admission blocked: latest gate differs')
          inventory = api(f"actions/runs/{run_id}/attempts/{run['run_attempt']}/jobs?per_page=100")
          jobs = inventory['jobs']
          if (inventory['total_count'] != 14 or len(jobs) != 14
                  or {job['name'] for job in jobs} != required_jobs
                  or len({job['id'] for job in jobs}) != 14
                  or any(job.get('status') != 'completed' or job.get('conclusion') != 'success'
                      or job.get('head_sha') != revision or job.get('run_id') != run_id
                      or job.get('run_attempt') != run['run_attempt'] for job in jobs)):
              raise SystemExit('Read-only snapshot admission blocked: all-14 jobs differ')
          artifact_rows = api(f'actions/runs/{run_id}/artifacts?per_page=100')
          matching = [item for item in artifact_rows.get('artifacts', []) if item.get('name') == 'exact-revision-merge-evidence']
          if artifact_rows.get('total_count', 101) > 100 or len(matching) != 1:
              raise SystemExit('Read-only snapshot admission blocked: aggregate artifact ambiguous')
          artifact = matching[0]
          aggregate_job = next(job for job in jobs if job['name'] == 'merge-gate')
          if (artifact.get('id') != artifact_id or artifact.get('expired') is not False
                  or artifact.get('digest') != artifact_digest or artifact.get('size_in_bytes') != 394
                  or artifact.get('workflow_run', {}).get('id') != run_id
                  or artifact.get('workflow_run', {}).get('head_sha') != revision
                  or not aggregate_job['started_at'] <= artifact.get('created_at', '') <= aggregate_job['completed_at']):
              raise SystemExit('Read-only snapshot admission blocked: historical raw aggregate binding differs')
          download = subprocess.run(['gh', 'api', f'repos/{repository}/actions/artifacts/{artifact_id}/zip'],
                                    capture_output=True, timeout=60)
          if (download.returncode or len(download.stdout) != 394
                  or 'sha256:' + hashlib.sha256(download.stdout).hexdigest() != artifact_digest):
              raise SystemExit('Read-only snapshot admission blocked: historical raw aggregate digest differs')
          with zipfile.ZipFile(io.BytesIO(download.stdout)) as archive:
              members = [item for item in archive.infolist() if not item.is_dir()]
              if (len(members) != 1 or members[0].filename != 'gates.json'
                      or members[0].file_size > 262144 or (members[0].external_attr >> 16) & 0o170000 == 0o120000):
                  raise SystemExit('Read-only snapshot admission blocked: aggregate archive member differs')
              evidence = json.loads(archive.read(members[0]))
          labels = evidence.get('passed')
          if (evidence.get('revision') != revision
                  or evidence.get('run_url') != f'https://github.com/{repository}/actions/runs/{run_id}'
                  or not isinstance(labels, list) or len(labels) != 13 or set(labels) != required_labels):
              raise SystemExit('Read-only snapshot admission blocked: aggregate evidence differs')
          after_artifact = api('actions/artifacts/' + str(artifact_id))
          if any(after_artifact.get(key) != artifact.get(key) for key in
                 ('id', 'name', 'expired', 'digest', 'size_in_bytes', 'created_at', 'workflow_run')):
              raise SystemExit('Read-only snapshot admission blocked: historical artifact changed')
          current = api('actions/runs/' + str(run_id))
          if any(current.get(k) != run.get(k) for k in ('id', 'head_sha', 'run_attempt', 'status', 'conclusion', 'workflow_id')):
              raise SystemExit('Read-only snapshot admission blocked: gate changed')
          if (api('git/ref/heads/main')['object']['sha'] != observed_main
                  or command(['git', 'status', '--porcelain']).strip()):
              raise SystemExit('Read-only snapshot admission blocked: source changed')
          print(json.dumps({'admitted_revision': revision, 'admitted_tree': source_tree, 'gate_run': run_id,
              'successful_jobs': 14, 'raw_aggregate_digest': artifact_digest, 'observed_current_main': observed_main,
              'current_main_qualification': 'UNQUALIFIED_NOT_EXECUTED', 'admission_scope': 'EXACT_OWNED_OHIO_DATABASE_STOP_ONLY'}))
          PYCODE

      - name: Configure existing repository AWS secrets after source admission
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-2
          allowed-account-ids: '738470137867'
          unset-current-credentials: true
          force-skip-oidc: true
          output-credentials: false
          retry-max-attempts: 3
          action-timeout-s: 90

      - name: Stop only admitted original Ohio Aurora and verify both stopped
        id: stop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time

          ACCOUNT = '738470137867'
          REGION = 'us-east-2'
          PREFIX = 'otgd-serverless-development'
          STACK = 'arn:aws:cloudformation:us-east-2:738470137867:stack/otgd-serverless-development/865843c0-c654-11f1-96fa-06a08a49cfef'
          CLUSTER_UID = 'cluster-TWBMR2BY5PK4PVSPRZ6S2O2U6E'
          WRITER_UID = 'db-JEOVXOBFSUIYXQ2F6GA6J7WZVY'
          KEY = 'arn:aws:kms:us-east-2:738470137867:key/ff17e353-38bf-43df-a08c-85bd60b77aff'
          VPC = 'vpc-03d6cfa8bde278d3f'
          INVENTORY_SHA = 'bd2498b62ec53afbb62b2b2c586bb4ae2c11c0a6a8d5aa7f2e93ae499b0d6ae2'
          TEMPLATE_SHA = '6081b2fb2aed05c2891715d45f114661637960bba3caee780f937cebdc4b4099'
          ALLOWED = {('sts', 'get-caller-identity'), ('cloudformation', 'describe-stacks'),
                     ('cloudformation', 'list-stack-resources'), ('cloudformation', 'get-template'),
                     ('rds', 'describe-db-clusters'), ('rds', 'describe-db-instances'), ('rds', 'stop-db-cluster')}
          STARTED = time.monotonic()
          DESTINATION = Path(os.environ['RUNNER_TEMP']) / 'ohio-stop'
          DESTINATION.mkdir(mode=0o700, exist_ok=False)
          proof = {'schema_version': '1.0.0', 'operation': 'stop-exact-owned-ohio-aurora-only',
              'account': ACCOUNT, 'region': REGION, 'started_utc': datetime.now(timezone.utc).isoformat(),
              'source_revision': '6bca4fc7a77d268f35ea6a5b0f577f37389158cc', 'gate_run_id': 38316406153,
              'observed_current_main': 'f06f9b036dcb1d82df26cc71a1cfb2fbdf315697',
              'current_main_qualification': 'UNQUALIFIED_NOT_EXECUTED', 'admission_scope': 'EXACT_OWNED_OHIO_DATABASE_STOP_ONLY',
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'actions': [], 'status': 'admission_pending', 'database_observations': [],
              'limitations': ['Retained storage, backups, keys and secrets remain billable.',
                             'Aurora stopped clusters automatically restart after at most seven days.']}
          MUTATION_ATTEMPTED = False


          def persist():
              raw = (json.dumps(proof, indent=2, sort_keys=True) + '\n').encode()
              if len(raw) > 262144:
                  raise SystemExit('Ohio stop proof size bound exceeded')
              path = DESTINATION / 'ohio-stop.json'
              path.write_bytes(raw)
              path.chmod(0o600)


          def aws(service, operation, options=(), query=None):
              global MUTATION_ATTEMPTED
              if ((service, operation) not in ALLOWED or os.environ.get('AWS_REGION') != REGION
                      or os.environ.get('AWS_DEFAULT_REGION') != REGION or os.environ.get('AWS_MAX_ATTEMPTS') != '1'):
                  raise SystemExit('Ohio stop blocked: operation, region or mutation retry policy differs')
              if operation == 'stop-db-cluster':
                  if MUTATION_ATTEMPTED or options != ['--db-cluster-identifier', PREFIX] or proof['status'] != 'stop_intent_saved':
                      raise SystemExit('Ohio stop blocked: stop request outside saved exact intent')
                  MUTATION_ATTEMPTED = True
              args = ['aws', service, operation, '--region', REGION, '--output', 'json', '--no-paginate',
                      '--cli-connect-timeout', '5', '--cli-read-timeout', '15', *options]
              if query:
                  args += ['--query', query]
              try:
                  result = subprocess.run(args, capture_output=True, text=True, timeout=25)
              except subprocess.TimeoutExpired:
                  return {'operation_error_code': 'BoundedTimeout', 'request_result': 'unconfirmed'}
              if result.returncode:
                  match = re.search(r'An error occurred \(([A-Za-z0-9_.-]+)\)', result.stderr)
                  return {'operation_error_code': match.group(1) if match else 'CommandUnavailable', 'request_result': 'unconfirmed'}
              if len(result.stdout.encode()) > 1048576:
                  return {'operation_error_code': 'ResponseBoundExceeded', 'request_result': 'unconfirmed'}
              try:
                  return json.loads(result.stdout)
              except ValueError:
                  return {'operation_error_code': 'MalformedJson', 'request_result': 'unconfirmed'}


          def blocked(reason):
              proof['status'] = 'blocked'
              proof['blocked_reason'] = reason
              persist()
              raise SystemExit('Ohio stop blocked: ' + reason)


          def owned(tags):
              if not isinstance(tags, list) or any(not isinstance(tag, dict) for tag in tags):
                  return False
              keys = [tag.get('Key') for tag in tags]
              if len(set(keys)) != len(keys):
                  return False
              actual = {tag.get('Key'): tag.get('Value') for tag in tags}
              return all(actual.get(key) == value for key, value in {
                  'project': 'one-the-go-detection', 'deployment': PREFIX, 'environment': 'serverless-development',
                  'owner_role': 'platform-operator', 'aws:cloudformation:stack-id': STACK}.items())


          def database():
              cluster = aws('rds', 'describe-db-clusters', ['--db-cluster-identifier', PREFIX],
                  'DBClusters[].{DBClusterIdentifier:DBClusterIdentifier,DBClusterArn:DBClusterArn,DbClusterResourceId:DbClusterResourceId,Status:Status,Engine:Engine,EngineVersion:EngineVersion,StorageEncrypted:StorageEncrypted,KmsKeyId:KmsKeyId,DeletionProtection:DeletionProtection,DBSubnetGroup:DBSubnetGroup,VpcSecurityGroups:VpcSecurityGroups,DBClusterMembers:DBClusterMembers,TagList:TagList}')
              writer = aws('rds', 'describe-db-instances', ['--db-instance-identifier', PREFIX + '-writer'],
                  'DBInstances[].{DBInstanceIdentifier:DBInstanceIdentifier,DBInstanceArn:DBInstanceArn,DbiResourceId:DbiResourceId,DBClusterIdentifier:DBClusterIdentifier,DBInstanceStatus:DBInstanceStatus,Engine:Engine,EngineVersion:EngineVersion,StorageEncrypted:StorageEncrypted,KmsKeyId:KmsKeyId,PubliclyAccessible:PubliclyAccessible,AvailabilityZone:AvailabilityZone,DeletionProtection:DeletionProtection,DBSubnetGroup:{DBSubnetGroupName:DBSubnetGroup.DBSubnetGroupName,VpcId:DBSubnetGroup.VpcId},TagList:TagList}')
              if not isinstance(cluster, list) or len(cluster) != 1 or not isinstance(writer, list) or len(writer) != 1:
                  blocked('Exact cluster and writer metadata unavailable')
              cluster, writer = cluster[0], writer[0]
              members = cluster.get('DBClusterMembers')
              security_groups = cluster.get('VpcSecurityGroups')
              subnet_group = writer.get('DBSubnetGroup')
              if (cluster.get('DBClusterIdentifier') != PREFIX or cluster.get('DBClusterArn') != f'arn:aws:rds:{REGION}:{ACCOUNT}:cluster:{PREFIX}'
                      or cluster.get('DbClusterResourceId') != CLUSTER_UID or writer.get('DbiResourceId') != WRITER_UID
                      or writer.get('DBInstanceIdentifier') != PREFIX + '-writer'
                      or writer.get('DBInstanceArn') != f'arn:aws:rds:{REGION}:{ACCOUNT}:db:{PREFIX}-writer'
                      or writer.get('DBClusterIdentifier') != PREFIX or writer.get('PubliclyAccessible') is not False
                      or writer.get('AvailabilityZone') != 'us-east-2a'
                      or any(row.get('Engine') != 'aurora-postgresql' or row.get('EngineVersion') != '16.15'
                             or row.get('StorageEncrypted') is not True or row.get('KmsKeyId') != KEY
                             or not isinstance(row.get('DeletionProtection'), bool) or not owned(row.get('TagList')) for row in (cluster, writer))
                      or not isinstance(members, list) or len(members) != 1
                      or members[0].get('DBInstanceIdentifier') != PREFIX + '-writer' or members[0].get('IsClusterWriter') is not True
                      or not isinstance(security_groups, list) or len(security_groups) != 1
                      or security_groups[0].get('VpcSecurityGroupId') != 'sg-0b005b69464a8c622'
                      or cluster.get('DBSubnetGroup') != PREFIX + '-databasesubnets-6j1kyh1yaoxh'
                      or not isinstance(subnet_group, dict) or subnet_group.get('VpcId') != VPC
                      or subnet_group.get('DBSubnetGroupName') != cluster.get('DBSubnetGroup')):
                  blocked('Database identity, ownership, encryption or private network differs')
              return cluster, writer


          persist()
          if aws('sts', 'get-caller-identity', query='Account') != ACCOUNT:
              blocked('Actual account differs')
          stack = aws('cloudformation', 'describe-stacks', ['--stack-name', STACK],
              'Stacks[].{StackId:StackId,StackStatus:StackStatus,EnableTerminationProtection:EnableTerminationProtection}')
          inventory = aws('cloudformation', 'list-stack-resources', ['--stack-name', STACK],
              '{Rows:StackResourceSummaries[].{LogicalResourceId:LogicalResourceId,PhysicalResourceId:PhysicalResourceId,ResourceType:ResourceType,ResourceStatus:ResourceStatus},NextToken:NextToken}')
          template = aws('cloudformation', 'get-template', ['--stack-name', STACK, '--template-stage', 'Original'], 'TemplateBody')
          if isinstance(template, str):
              try:
                  template = json.loads(template)
              except ValueError:
                  blocked('Protected stack template JSON unavailable')
          if (not isinstance(stack, list) or len(stack) != 1 or stack[0].get('StackId') != STACK
                  or stack[0].get('StackStatus') != 'IMPORT_ROLLBACK_COMPLETE' or stack[0].get('EnableTerminationProtection') is not True
                  or not isinstance(inventory, dict) or inventory.get('NextToken') or not isinstance(inventory.get('Rows'), list)
                  or len(inventory['Rows']) != 15 or not isinstance(template, dict) or not isinstance(template.get('Resources'), dict)):
              blocked('Protected original stack boundary differs')
          inventory_hash = hashlib.sha256(json.dumps(sorted(inventory['Rows'], key=lambda row: row['LogicalResourceId']),
              sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          template_hash = hashlib.sha256(json.dumps(template, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          if (inventory_hash != INVENTORY_SHA or template_hash != TEMPLATE_SHA
                  or any(row.get('DeletionPolicy') != 'Retain' or row.get('UpdateReplacePolicy') != 'Retain' for row in template['Resources'].values())):
              blocked('Original stack identities or template retention differ')
          proof.update(original_stack=stack[0], original_inventory_sha256=inventory_hash, original_template_sha256=template_hash)
          cluster, writer = database()
          proof.update(cluster_before=cluster, writer_before=writer, status='database_admitted')
          persist()
          # Repeat identity reads immediately before writing intent and issuing the sole mutation.
          cluster, writer = database()
          if (cluster['DeletionProtection'] != proof['cluster_before']['DeletionProtection']
                  or writer['DeletionProtection'] != proof['writer_before']['DeletionProtection']):
              blocked('Deletion protection changed during stop admission')
          if cluster.get('Status') not in {'available', 'stopping', 'stopped'} or writer.get('DBInstanceStatus') not in {'available', 'stopping', 'stopped'}:
              blocked('Database is not in a known available or stop phase')
          if cluster['Status'] == 'available':
              if writer['DBInstanceStatus'] != 'available':
                  blocked('Available cluster writer state differs')
              proof['actions'].append({'operation': 'StopDBCluster', 'cluster_arn': cluster['DBClusterArn'],
                  'cluster_uid': CLUSTER_UID, 'writer_uid': WRITER_UID, 'intent_utc': datetime.now(timezone.utc).isoformat(),
                  'transport_attempts_permitted': 1, 'status': 'intent_saved'})
              proof['status'] = 'stop_intent_saved'
              persist()
              print(json.dumps({'stop_intent_saved': True, 'cluster_uid': CLUSTER_UID, 'writer_uid': WRITER_UID}), flush=True)
              result = aws('rds', 'stop-db-cluster', ['--db-cluster-identifier', PREFIX],
                  'DBCluster.{DBClusterIdentifier:DBClusterIdentifier,DBClusterArn:DBClusterArn,DbClusterResourceId:DbClusterResourceId,Status:Status}')
              proof['actions'][0]['response'] = result
              proof['actions'][0]['status'] = 'request_sent_once_response_recorded'
              proof['status'] = 'stop_requested_waiting_for_both_stopped'
              persist()
              print(json.dumps({'stop_request_sent_once': True, 'selected_response': result}), flush=True)
          else:
              proof['status'] = 'existing_stop_phase_waiting_for_both_stopped'
              persist()
          deadline = STARTED + 900
          previous = None
          while time.monotonic() < deadline:
              cluster, writer = database()
              if (cluster['DeletionProtection'] != proof['cluster_before']['DeletionProtection']
                      or writer['DeletionProtection'] != proof['writer_before']['DeletionProtection']):
                  blocked('Deletion protection changed while waiting for stop')
              pair = (cluster.get('Status'), writer.get('DBInstanceStatus'))
              if pair != previous:
                  event = {'observed_utc': datetime.now(timezone.utc).isoformat(), 'cluster_status': pair[0], 'writer_status': pair[1]}
                  proof['database_observations'].append(event)
                  persist()
                  print(json.dumps({'database_pause_status': event}), flush=True)
                  previous = pair
              if pair == ('stopped', 'stopped'):
                  proof.update(status='compute_paused_data_retained', cluster_after=cluster, writer_after=writer,
                      completed_utc=datetime.now(timezone.utc).isoformat())
                  persist()
                  print(json.dumps({'status': proof['status'], 'cluster_uid': CLUSTER_UID, 'writer_uid': WRITER_UID,
                      'cluster_status': 'stopped', 'writer_status': 'stopped', 'sole_possible_mutation': 'StopDBCluster',
                      'artifact_sha256': hashlib.sha256((DESTINATION / 'ohio-stop.json').read_bytes()).hexdigest()}), flush=True)
                  break
              if pair[0] not in {'available', 'stopping', 'stopped'} or pair[1] not in {'available', 'stopping', 'stopped'}:
                  blocked('Unexpected database state while waiting; no stop retry')
              time.sleep(min(30, max(0, deadline - time.monotonic())))
          else:
              proof.update(status='stop_result_unconfirmed_waiter_deadline', completed_utc=datetime.now(timezone.utc).isoformat())
              persist()
              raise SystemExit('Ohio stop waiter reached its bounded deadline; no mutation retry')
          PYCODE

      - name: Preserve bounded shutdown intent and actual-state proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guarded-ohio-stop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ohio-stop/
          if-no-files-found: warn
          retention-days: 7
