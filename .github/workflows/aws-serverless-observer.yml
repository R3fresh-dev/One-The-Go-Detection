name: Read-only Ohio decommission inventory

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work-aws-ohio-inventory' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: R3fresh-dev/One-The-Go-Detection
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      AWS_MAX_ATTEMPTS: '3'
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6bca4fc7a77d268f35ea6a5b0f577f37389158cc
          persist-credentials: false

      - name: Admit immutable historical qualified source for read-only inventory only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib
          import io
          import json
          import os
          import subprocess
          import zipfile

          revision = '6bca4fc7a77d268f35ea6a5b0f577f37389158cc'
          source_tree = '2d7b50c07ab35b3db6fb3d3069928cc595cbb1cd'
          observed_main = 'f06f9b036dcb1d82df26cc71a1cfb2fbdf315697'
          artifact_id = 11777961370
          artifact_digest = 'sha256:eb7da6b70d0678a393321576e44fd7912f01a470b1708576578461ca1276eed8'
          repository = 'R3fresh-dev/One-The-Go-Detection'
          run_id = 38316406153
          workflow_path = '.github/workflows/merge-gate.yml'
          required_jobs = {'unit-coverage', 'components', 'atdd', 'preview / ios',
              'platform / postgres-integration', 'native / android', 'native / protected-reader',
              'native / ios', 'platform / localstack-integration', 'native / shared-and-firmware',
              'platform / contracts-and-synthesis', 'platform / fargate-container-runtime', 'preview / android', 'merge-gate'}
          required_labels = {'unit-coverage', 'atdd', 'components', 'performance', 'live-dependencies',
              'docker-health', 'localstack-api', 'specifications', 'native-android', 'native-ios',
              'firmware', 'hosted-android', 'hosted-ios'}

          def command(args, timeout=30):
              result = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
              if result.returncode or len(result.stdout.encode()) > 2097152:
                  raise SystemExit('Read-only snapshot admission blocked: command unavailable (' + ' '.join(args[:2]) + ')')
              return result.stdout

          def api(path):
              return json.loads(command(['gh', 'api', ('repos/' + repository + '/' + path).rstrip('/')]))

          if (os.environ['GH_REPO'] != repository or os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch'
                  or os.environ['GITHUB_REF'] != 'refs/heads/work-aws-ohio-inventory'
                  or command(['git', 'rev-parse', 'HEAD']).strip() != revision
                  or command(['git', 'rev-parse', 'HEAD^{tree}']).strip() != source_tree
                  or command(['git', 'status', '--porcelain']).strip()):
              raise SystemExit('Read-only snapshot admission blocked: source or trigger differs')
          if (api('')['default_branch'] != 'main'
                  or api('git/ref/heads/main')['object']['sha'] != observed_main):
              raise SystemExit('Read-only snapshot admission blocked: current main differs')
          run = api('actions/runs/' + str(run_id))
          if (run.get('head_sha') != revision or run.get('status') != 'completed'
                  or run.get('conclusion') != 'success' or run.get('path') != workflow_path
                  or run.get('head_branch') != 'main' or run.get('event') != 'push' or run.get('run_attempt') != 1
                  or run.get('repository', {}).get('full_name') != repository
                  or run.get('head_repository', {}).get('full_name') != repository):
              raise SystemExit('Read-only snapshot admission blocked: gate run differs')
          workflow = api('actions/workflows/' + str(run['workflow_id']))
          if workflow.get('path') != workflow_path or workflow.get('state') != 'active':
              raise SystemExit('Read-only snapshot admission blocked: gate workflow differs')
          latest = api('actions/workflows/merge-gate.yml/runs?head_sha=' + revision + '&per_page=100')
          trusted = [r for r in latest['workflow_runs'] if r.get('head_sha') == revision
              and r.get('path') == workflow_path and r.get('head_branch') == 'main'
              and r.get('event') == 'push']
          if not trusted or max(r['id'] for r in trusted) != run_id:
              raise SystemExit('Read-only snapshot admission blocked: latest gate differs')
          inventory = api(f"actions/runs/{run_id}/attempts/{run['run_attempt']}/jobs?per_page=100")
          jobs = inventory['jobs']
          if (inventory['total_count'] != 14 or len(jobs) != 14
                  or {job['name'] for job in jobs} != required_jobs
                  or len({job['id'] for job in jobs}) != 14
                  or any(job.get('status') != 'completed' or job.get('conclusion') != 'success'
                      or job.get('head_sha') != revision or job.get('run_id') != run_id
                      or job.get('run_attempt') != run['run_attempt'] for job in jobs)):
              raise SystemExit('Read-only snapshot admission blocked: all-14 jobs differ')
          artifact_rows = api(f'actions/runs/{run_id}/artifacts?per_page=100')
          matching = [item for item in artifact_rows.get('artifacts', []) if item.get('name') == 'exact-revision-merge-evidence']
          if artifact_rows.get('total_count', 101) > 100 or len(matching) != 1:
              raise SystemExit('Read-only snapshot admission blocked: aggregate artifact ambiguous')
          artifact = matching[0]
          aggregate_job = next(job for job in jobs if job['name'] == 'merge-gate')
          if (artifact.get('id') != artifact_id or artifact.get('expired') is not False
                  or artifact.get('digest') != artifact_digest or artifact.get('size_in_bytes') != 394
                  or artifact.get('workflow_run', {}).get('id') != run_id
                  or artifact.get('workflow_run', {}).get('head_sha') != revision
                  or not aggregate_job['started_at'] <= artifact.get('created_at', '') <= aggregate_job['completed_at']):
              raise SystemExit('Read-only snapshot admission blocked: historical raw aggregate binding differs')
          download = subprocess.run(['gh', 'api', f'repos/{repository}/actions/artifacts/{artifact_id}/zip'],
                                    capture_output=True, timeout=60)
          if (download.returncode or len(download.stdout) != 394
                  or 'sha256:' + hashlib.sha256(download.stdout).hexdigest() != artifact_digest):
              raise SystemExit('Read-only snapshot admission blocked: historical raw aggregate digest differs')
          with zipfile.ZipFile(io.BytesIO(download.stdout)) as archive:
              members = [item for item in archive.infolist() if not item.is_dir()]
              if (len(members) != 1 or members[0].filename != 'gates.json'
                      or members[0].file_size > 262144 or (members[0].external_attr >> 16) & 0o170000 == 0o120000):
                  raise SystemExit('Read-only snapshot admission blocked: aggregate archive member differs')
              evidence = json.loads(archive.read(members[0]))
          labels = evidence.get('passed')
          if (evidence.get('revision') != revision
                  or evidence.get('run_url') != f'https://github.com/{repository}/actions/runs/{run_id}'
                  or not isinstance(labels, list) or len(labels) != 13 or set(labels) != required_labels):
              raise SystemExit('Read-only snapshot admission blocked: aggregate evidence differs')
          after_artifact = api('actions/artifacts/' + str(artifact_id))
          if any(after_artifact.get(key) != artifact.get(key) for key in
                 ('id', 'name', 'expired', 'digest', 'size_in_bytes', 'created_at', 'workflow_run')):
              raise SystemExit('Read-only snapshot admission blocked: historical artifact changed')
          current = api('actions/runs/' + str(run_id))
          if any(current.get(k) != run.get(k) for k in ('id', 'head_sha', 'run_attempt', 'status', 'conclusion', 'workflow_id')):
              raise SystemExit('Read-only snapshot admission blocked: gate changed')
          if (api('git/ref/heads/main')['object']['sha'] != observed_main
                  or command(['git', 'status', '--porcelain']).strip()):
              raise SystemExit('Read-only snapshot admission blocked: source changed')
          print(json.dumps({'admitted_revision': revision, 'admitted_tree': source_tree, 'gate_run': run_id,
              'successful_jobs': 14, 'raw_aggregate_digest': artifact_digest, 'observed_current_main': observed_main,
              'current_main_qualification': 'UNQUALIFIED_NOT_EXECUTED', 'admission_scope': 'READ_ONLY_OHIO_INVENTORY_ONLY'}))
          PYCODE

      - name: Configure existing repository AWS secrets after source admission
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-2
          allowed-account-ids: '738470137867'
          unset-current-credentials: true
          force-skip-oidc: true
          output-credentials: false
          retry-max-attempts: 3
          action-timeout-s: 90

      - name: Read bounded Ohio identities, protections and retained storage metadata only
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time

          ACCOUNT = '738470137867'
          REGION = 'us-east-2'
          PREFIX = 'otgd-serverless-development'
          VPC = 'vpc-03d6cfa8bde278d3f'
          CLUSTER_UID = 'cluster-TWBMR2BY5PK4PVSPRZ6S2O2U6E'
          WRITER_UID = 'db-JEOVXOBFSUIYXQ2F6GA6J7WZVY'
          STACK_ID = 'arn:aws:cloudformation:us-east-2:738470137867:stack/otgd-serverless-development/865843c0-c654-11f1-96fa-06a08a49cfef'
          REGISTRY_ID = 'arn:aws:cloudformation:us-east-2:738470137867:stack/otgd-serverless-development-registry/d529b1b0-c60d-11f1-a5c0-06c6c7e66e0f'
          ALLOWED = {
              ('sts', 'get-caller-identity'),
              ('cloudformation', 'describe-stacks'), ('cloudformation', 'list-stack-resources'), ('cloudformation', 'get-template'),
              ('resourcegroupstaggingapi', 'get-resources'),
              ('rds', 'describe-db-clusters'), ('rds', 'describe-db-instances'), ('rds', 'describe-db-subnet-groups'),
              ('rds', 'describe-db-cluster-parameter-groups'), ('rds', 'describe-db-cluster-snapshots'),
              ('rds', 'describe-db-cluster-automated-backups'), ('rds', 'list-tags-for-resource'),
              ('backup', 'list-recovery-points-by-resource'), ('backup', 'describe-backup-vault'), ('backup', 'describe-recovery-point'),
              ('ec2', 'describe-vpcs'), ('ec2', 'describe-subnets'), ('ec2', 'describe-security-groups'),
              ('ec2', 'describe-network-interfaces'), ('ec2', 'describe-route-tables'), ('ec2', 'describe-internet-gateways'),
              ('ec2', 'describe-egress-only-internet-gateways'), ('ec2', 'describe-nat-gateways'),
              ('ec2', 'describe-vpc-endpoints'), ('ec2', 'describe-instances'), ('ec2', 'describe-addresses'),
              ('s3api', 'get-bucket-location'), ('s3api', 'get-bucket-tagging'), ('s3api', 'get-bucket-versioning'),
              ('s3api', 'get-object-lock-configuration'), ('s3api', 'get-bucket-encryption'),
              ('s3api', 'get-public-access-block'), ('s3api', 'list-object-versions'), ('s3api', 'list-multipart-uploads'),
              ('s3api', 'head-object'), ('s3api', 'get-object-retention'), ('s3api', 'get-object-legal-hold'),
              ('kms', 'describe-key'), ('kms', 'list-resource-tags'), ('kms', 'list-aliases'),
              ('secretsmanager', 'describe-secret'), ('ecr', 'describe-repositories'), ('ecr', 'describe-images'),
              ('ecr', 'list-tags-for-resource'), ('logs', 'describe-log-groups'), ('logs', 'list-tags-log-group'),
              ('dynamodb', 'describe-table'), ('dynamodb', 'describe-continuous-backups'), ('dynamodb', 'list-backups'),
              ('dynamodb', 'list-tags-of-resource'), ('cognito-idp', 'describe-user-pool'),
              ('cognito-idp', 'list-tags-for-resource'), ('cognito-idp', 'list-user-pool-clients'), ('lambda', 'get-function-configuration'),
              ('sqs', 'list-queues'), ('sqs', 'get-queue-attributes'), ('sqs', 'list-queue-tags'),
              ('cloudwatch', 'describe-alarms'), ('cloudwatch', 'list-dashboards'), ('cloudwatch', 'list-tags-for-resource'),
              ('codebuild', 'batch-get-projects'), ('codebuild', 'list-builds-for-project'), ('codebuild', 'batch-get-builds'),
              ('codebuild', 'batch-get-fleets'),
              ('iam', 'get-role'), ('ecs', 'describe-clusters'), ('elasticloadbalancing', 'describe-load-balancers'),
              ('budgets', 'describe-budget'), ('budgets', 'describe-budget-actions-for-budget'), ('budgets', 'list-tags-for-resource'),
          }
          STARTED = time.monotonic()
          DESTINATION = Path(os.environ['RUNNER_TEMP']) / 'ohio-inventory'
          DESTINATION.mkdir(mode=0o700, exist_ok=False)
          snapshot = {
              'schema_version': '1.0.0', 'operation': 'read-only-ohio-decommission-inventory',
              'account': ACCOUNT, 'region': REGION, 'snapshot_utc': datetime.now(timezone.utc).isoformat(),
              'source_revision': '6bca4fc7a77d268f35ea6a5b0f577f37389158cc', 'gate_run_id': 38316406153,
              'observed_current_main': 'f06f9b036dcb1d82df26cc71a1cfb2fbdf315697',
              'current_main_qualification': 'UNQUALIFIED_NOT_EXECUTED', 'admission_scope': 'READ_ONLY_OHIO_INVENTORY_ONLY',
              'observer_run_id': os.environ['GITHUB_RUN_ID'], 'observer_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'aws_mutations': [], 'observations': {},
              'limits': {'deadline_seconds': 720, 'aws_calls': 360, 'response_bytes': 2097152,
                         'artifact_bytes': 2097152, 'max_pages_per_scan': 4, 's3_versions_per_page': 1000,
                         's3_protection_versions_per_bucket': 40},
              'scope': 'Exact original Ohio identities, Ohio registry CloudFormation graph, and matching project/deployment/environment tags only. No account-wide absence claim.',
          }
          CALLS = 0


          def persist():
              raw = (json.dumps(snapshot, indent=2, sort_keys=True) + '\n').encode()
              if len(raw) > snapshot['limits']['artifact_bytes']:
                  raise SystemExit('Bounded inventory artifact exceeded size limit')
              path = DESTINATION / 'ohio-inventory.json'
              path.write_bytes(raw)
              path.chmod(0o600)


          def aws(service, operation, options=(), query=None):
              global CALLS
              if (service, operation) not in ALLOWED or os.environ['AWS_REGION'] != REGION:
                  raise SystemExit('Ohio inventory blocked: operation or region outside read-only allowlist')
              if time.monotonic() - STARTED > 720 or CALLS >= 360:
                  return {'observation_error_code': 'ObservationBoundExceeded', 'presence': 'unverified'}
              CALLS += 1
              args = ['aws', service, operation, '--region', REGION, '--output', 'json', '--no-paginate',
                      '--cli-connect-timeout', '5', '--cli-read-timeout', '15', *options]
              if query:
                  args += ['--query', query]
              try:
                  result = subprocess.run(args, capture_output=True, text=True, timeout=25)
              except subprocess.TimeoutExpired:
                  return {'observation_error_code': 'BoundedTimeout', 'presence': 'unverified'}
              if result.returncode:
                  match = re.search(r'An error occurred \(([A-Za-z0-9_.-]+)\)', result.stderr)
                  code = match.group(1) if match else 'CommandUnavailable'
                  absent_codes = {'DBClusterNotFoundFault', 'DBInstanceNotFound', 'NoSuchBucket', 'NoSuchEntity',
                                  'ResourceNotFoundException', 'RepositoryNotFoundException', 'UserPoolNotFoundException',
                                  'DBSubnetGroupNotFoundFault', 'DBParameterGroupNotFound', 'NotFoundException',
                                  'InvalidVpcID.NotFound', 'InvalidSubnetID.NotFound', 'InvalidGroup.NotFound'}
                  absent = code in absent_codes or (service == 'cloudformation' and code == 'ValidationError'
                             and re.search(r'Stack with id [^\n]+ does not exist', result.stderr))
                  return {'observation_error_code': code, 'presence': 'absent' if absent else 'unverified'}
              if len(result.stdout.encode()) > 2097152:
                  return {'observation_error_code': 'ResponseBoundExceeded', 'presence': 'unverified'}
              try:
                  return json.loads(result.stdout)
              except ValueError:
                  return {'observation_error_code': 'MalformedJson', 'presence': 'unverified'}


          def record(label, value):
              snapshot['observations'][label] = value
              persist()
              summary = {'observation': label, 'aws_calls': CALLS}
              if isinstance(value, dict):
                  summary.update({key: value[key] for key in ('observation_error_code', 'presence', 'complete',
                      'row_count', 'version_count', 'delete_marker_count', 'protection_scan_complete') if key in value})
              elif isinstance(value, list):
                  summary['row_count'] = len(value)
              print(json.dumps(summary, sort_keys=True), flush=True)
              return value


          def pages(service, operation, options, query, collection, token='NextToken', argument='--next-token', max_pages=4):
              rows, marker = [], None
              for _ in range(max_pages):
                  paging = ([argument, json.dumps({token: marker}) if argument == '--cli-input-json' else marker] if marker else [])
                  result = aws(service, operation, [*options, *paging], query)
                  if not isinstance(result, dict) or not isinstance(result.get(collection), list):
                      return {'rows': rows, 'row_count': len(rows), 'complete': False, 'observation': result}
                  rows.extend(result[collection])
                  marker = result.get(token)
                  if not marker:
                      return {'rows': rows, 'row_count': len(rows), 'complete': True}
                  if not isinstance(marker, str) or len(marker) > 4096:
                      return {'rows': rows, 'row_count': len(rows), 'complete': False, 'observation_error_code': 'InvalidPaginationToken'}
              return {'rows': rows, 'row_count': len(rows), 'complete': False, 'observation_error_code': 'PaginationBoundExceeded'}


          if aws('sts', 'get-caller-identity', query='Account') != ACCOUNT:
              raise SystemExit('Ohio inventory blocked: actual account differs')

          stack_rows = record('application_stack', aws('cloudformation', 'describe-stacks', ['--stack-name', STACK_ID],
              'Stacks[].{StackName:StackName,StackId:StackId,StackStatus:StackStatus,CreationTime:CreationTime,LastUpdatedTime:LastUpdatedTime,EnableTerminationProtection:EnableTerminationProtection,Tags:Tags}'))
          inventory = record('application_inventory', pages('cloudformation', 'list-stack-resources', ['--stack-name', STACK_ID],
              '{Rows:StackResourceSummaries[].{LogicalResourceId:LogicalResourceId,PhysicalResourceId:PhysicalResourceId,ResourceType:ResourceType,ResourceStatus:ResourceStatus},NextToken:NextToken}', 'Rows'))
          record('application_inventory_canonical_sha256', hashlib.sha256(json.dumps(sorted(inventory.get('rows', []),
              key=lambda row: row['LogicalResourceId']), sort_keys=True, separators=(',', ':')).encode()).hexdigest())
          template_response = aws('cloudformation', 'get-template', ['--stack-name', STACK_ID, '--template-stage', 'Original'], 'TemplateBody')
          if isinstance(template_response, str):
              try:
                  template_response = json.loads(template_response)
              except ValueError:
                  template_response = {'observation_error_code': 'NonJsonTemplate', 'presence': 'unverified'}
          if isinstance(template_response, dict) and isinstance(template_response.get('Resources'), dict):
              record('application_template', {'canonical_sha256': hashlib.sha256(json.dumps(template_response,
                  sort_keys=True, separators=(',', ':')).encode()).hexdigest(), 'resources': [
                  {'logical_id': name, 'type': resource.get('Type'), 'deletion_policy': resource.get('DeletionPolicy'),
                   'update_replace_policy': resource.get('UpdateReplacePolicy')} for name, resource in sorted(template_response['Resources'].items())]})
          else:
              record('application_template', template_response)
          registry_stack = record('registry_stack', aws('cloudformation', 'describe-stacks', ['--stack-name', REGISTRY_ID],
              'Stacks[].{StackName:StackName,StackId:StackId,StackStatus:StackStatus,EnableTerminationProtection:EnableTerminationProtection,Tags:Tags}'))
          registry = record('registry_inventory', pages('cloudformation', 'list-stack-resources', ['--stack-name', REGISTRY_ID],
              '{Rows:StackResourceSummaries[].{LogicalResourceId:LogicalResourceId,PhysicalResourceId:PhysicalResourceId,ResourceType:ResourceType,ResourceStatus:ResourceStatus},NextToken:NextToken}', 'Rows'))
          registry_identity_matches = isinstance(registry_stack, list) and len(registry_stack) == 1 and registry_stack[0].get('StackId') == REGISTRY_ID
          record('registry_identity_binding', {'exact_historical_registry_stack_id_matches': registry_identity_matches})
          if not registry_identity_matches:
              registry = {'rows': [], 'complete': False, 'observation_error_code': 'RegistryIdentityNotProven'}
          registry_template = aws('cloudformation', 'get-template', ['--stack-name', REGISTRY_ID, '--template-stage', 'Original'], 'TemplateBody')
          if isinstance(registry_template, str):
              try:
                  registry_template = json.loads(registry_template)
              except ValueError:
                  registry_template = {'observation_error_code': 'NonJsonTemplate', 'presence': 'unverified'}
          if isinstance(registry_template, dict) and isinstance(registry_template.get('Resources'), dict):
              record('registry_template', {'canonical_sha256': hashlib.sha256(json.dumps(registry_template, sort_keys=True, separators=(',', ':')).encode()).hexdigest(),
                  'resources': [{'logical_id': name, 'type': resource.get('Type'), 'deletion_policy': resource.get('DeletionPolicy'),
                                 'update_replace_policy': resource.get('UpdateReplacePolicy')} for name, resource in sorted(registry_template['Resources'].items())]})
          else:
              record('registry_template', registry_template)
          tagged = record('owned_tagged_inventory', pages('resourcegroupstaggingapi', 'get-resources',
              ['--resources-per-page', '100', '--tag-filters', 'Key=project,Values=one-the-go-detection',
               'Key=deployment,Values=' + PREFIX, 'Key=environment,Values=serverless-development'],
              '{Rows:ResourceTagMappingList[].{ARN:ResourceARN,Tags:Tags},NextToken:PaginationToken}', 'Rows',
              token='NextToken', argument='--pagination-token'))

          cluster_arn = 'arn:aws:rds:' + REGION + ':' + ACCOUNT + ':cluster:' + PREFIX
          cluster = record('database_cluster', aws('rds', 'describe-db-clusters', ['--db-cluster-identifier', PREFIX],
              'DBClusters[].{DBClusterIdentifier:DBClusterIdentifier,DBClusterArn:DBClusterArn,DbClusterResourceId:DbClusterResourceId,Status:Status,Engine:Engine,EngineVersion:EngineVersion,ClusterCreateTime:ClusterCreateTime,StorageEncrypted:StorageEncrypted,KmsKeyId:KmsKeyId,DeletionProtection:DeletionProtection,DBSubnetGroup:DBSubnetGroup,DBClusterParameterGroup:DBClusterParameterGroup,VpcSecurityGroups:VpcSecurityGroups,DBClusterMembers:DBClusterMembers,BackupRetentionPeriod:BackupRetentionPeriod,LatestRestorableTime:LatestRestorableTime,EarliestRestorableTime:EarliestRestorableTime,MasterUserSecret:MasterUserSecret,TagList:TagList}'))
          writer = record('database_writer', aws('rds', 'describe-db-instances', ['--db-instance-identifier', PREFIX + '-writer'],
              'DBInstances[].{DBInstanceIdentifier:DBInstanceIdentifier,DBInstanceArn:DBInstanceArn,DbiResourceId:DbiResourceId,DBClusterIdentifier:DBClusterIdentifier,DBInstanceStatus:DBInstanceStatus,AvailabilityZone:AvailabilityZone,Engine:Engine,EngineVersion:EngineVersion,InstanceCreateTime:InstanceCreateTime,StorageEncrypted:StorageEncrypted,KmsKeyId:KmsKeyId,DeletionProtection:DeletionProtection,PubliclyAccessible:PubliclyAccessible,DBSubnetGroup:DBSubnetGroup,DBParameterGroups:DBParameterGroups,TagList:TagList}'))
          record('database_identity_binding', {'cluster_uid_matches': isinstance(cluster, list) and len(cluster) == 1 and cluster[0].get('DbClusterResourceId') == CLUSTER_UID,
              'writer_uid_matches': isinstance(writer, list) and len(writer) == 1 and writer[0].get('DbiResourceId') == WRITER_UID})
          record('database_subnet_group', aws('rds', 'describe-db-subnet-groups', ['--db-subnet-group-name', PREFIX + '-databasesubnets-6j1kyh1yaoxh'],
              'DBSubnetGroups[].{DBSubnetGroupName:DBSubnetGroupName,DBSubnetGroupArn:DBSubnetGroupArn,VpcId:VpcId,SubnetGroupStatus:SubnetGroupStatus,Subnets:Subnets,SupportedNetworkTypes:SupportedNetworkTypes}'))
          record('database_parameter_group', aws('rds', 'describe-db-cluster-parameter-groups', ['--db-cluster-parameter-group-name', PREFIX + '-databaseparameters-uipyb9afu23l'],
              'DBClusterParameterGroups[].{DBClusterParameterGroupName:DBClusterParameterGroupName,DBClusterParameterGroupArn:DBClusterParameterGroupArn,DBParameterGroupFamily:DBParameterGroupFamily}'))
          record('database_snapshots', pages('rds', 'describe-db-cluster-snapshots', ['--db-cluster-identifier', PREFIX, '--include-shared', '--no-include-public', '--max-records', '100'],
