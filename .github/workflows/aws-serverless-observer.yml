name: Restore original Ohio HTTP state and stop exact database only
'on':
  workflow_dispatch:
    inputs:
      reviewed_operation_commit:
        description: Exact root-reviewed stabilizing operation commit
        required: true
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: otgd-ohio-retirement-738470137867-us-east-2
  cancel-in-progress: false
jobs:
  stabilize:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work-aws-regional-diagnostic' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: R3fresh-dev/One-The-Go-Detection
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      AWS_MAX_ATTEMPTS: '1'
      AWS_PAGER: ''
      OHIO_STABILIZE_ADMISSION_SHA256: 4fd6338af3972342e682ce9fb77439b33f7c6087b857d04aecd6f48efe75074c
      OHIO_STABILIZE_SCRIPT_SHA256: 1d412754de972d964968bab03391ab6486fd000030633df0965b48162841111e
    steps:
    - name: Bind private stabilization paths and exact manual commit
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PATHPY'\nimport json, os, re\nfrom pathlib import Path\nassert os.environ['GITHUB_REPOSITORY'] == 'R3fresh-dev/One-The-Go-Detection'\nassert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and os.environ['GITHUB_RUN_ATTEMPT'] == '1'\nassert re.fullmatch(r'[0-9a-f]{40}', os.environ['GITHUB_SHA'])\nevent=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())\nassert event.get('inputs',{}).get('reviewed_operation_commit') == os.environ['GITHUB_SHA']\nroot=Path(os.environ['RUNNER_TEMP']).resolve()\ndirectory=root/'ohio-stabilization'\nassert not directory.is_symlink()\ndirectory.mkdir(mode=0o700,exist_ok=False)\nwith open(os.environ['GITHUB_ENV'],'a') as stream:\n stream.write('OHIO_STABILIZE_DIR='+str(directory)+'\\n')\nPATHPY\n"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 0844868aa543af4ab75ac5065ad48cf807b86bb3
        persist-credentials: false
    - name: Stage exact reviewed stabilize_ohio.py
      shell: bash
      run: "set -euo pipefail\numask 077\ncat > \"$OHIO_STABILIZE_DIR/stabilize_ohio.py\" <<'ASSETFILE'\n\"\"\"Exact old Ohio HTTP restoration and stop only; no start/query/archive/delete.\"\"\"\nfrom datetime import datetime, timezone\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport time\n\nACCOUNT = '738470137867'\nREGION = 'us-east-2'\nPREFIX = 'otgd-serverless-development'\nSTACK = 'arn:aws:cloudformation:us-east-2:738470137867:stack/otgd-serverless-development/865843c0-c654-11f1-96fa-06a08a49cfef'\nCLUSTER_ARN = 'arn:aws:rds:us-east-2:738470137867:cluster:otgd-serverless-development'\nCLUSTER_UID = 'cluster-TWBMR2BY5PK4PVSPRZ6S2O2U6E'\nWRITER_UID = 'db-JEOVXOBFSUIYXQ2F6GA6J7WZVY'\nKEY = 'arn:aws:kms:us-east-2:738470137867:key/ff17e353-38bf-43df-a08c-85bd60b77aff'\nTEMPLATE_SHA = '6081b2fb2aed05c2891715d45f114661637960bba3caee780f937cebdc4b4099'\nINVENTORY_SHA = 'bd2498b62ec53afbb62b2b2c586bb4ae2c11c0a6a8d5aa7f2e93ae499b0d6ae2'\n\n\ndef need(condition, reason):\n    if not condition:\n        raise RuntimeError(reason)\n\n\ndef digest(value):\n    return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':'), default=str).encode()).hexdigest()\n\n\ndef owned(tags):\n    need(isinstance(tags, list) and all(isinstance(t, dict) for t in tags), 'Ownership metadata unavailable')\n    keys = [t.get('Key') for t in tags]\n    need(len(keys) == len(set(keys)), 'Duplicate ownership tags')\n    actual = {t.get('Key'): t.get('Value') for t in tags}\n    need(all(actual.get(k) == v for k, v in {'project': 'one-the-go-detection', 'deployment': PREFIX,\n        'environment': 'serverless-development', 'owner_role': 'platform-operator',\n        'aws:cloudformation:stack-id': STACK}.items()), 'Original ownership differs')\n\n\nclass Stabilization:\n    def __init__(self):\n        need(len(sys.argv) == 1 and os.environ.get('AWS_REGION') == REGION\n             and os.environ.get('AWS_DEFAULT_REGION') == REGION and os.environ.get('AWS_MAX_ATTEMPTS') == '1'\n             and os.environ.get('AWS_IGNORE_CONFIGURED_ENDPOINT_URLS') == 'true', 'Execution policy differs')\n        root = Path(os.environ['RUNNER_TEMP']).resolve()\n        self.directory = root / 'ohio-stabilization'\n        need(self.directory.is_dir() and not self.directory.is_symlink(), 'Private staging directory unavailable')\n        self.admission = self.directory / 'stabilization_admission.py'\n        need(hashlib.sha256(self.admission.read_bytes()).hexdigest() == os.environ['OHIO_STABILIZE_ADMISSION_SHA256'],\n             'Admission bytes differ')\n        need(hashlib.sha256(Path(__file__).read_bytes()).hexdigest() == os.environ['OHIO_STABILIZE_SCRIPT_SHA256'],\n             'Stabilizer bytes differ')\n        sys.path.insert(0, str(root / 'regional-diagnostic-sdk'))\n        import boto3\n        from botocore.config import Config\n        config = Config(retries={'total_max_attempts': 1, 'mode': 'standard'}, connect_timeout=5,\n            read_timeout=15, ignore_configured_endpoint_urls=True)\n        self.clients = {service: boto3.client(service, region_name=REGION, use_ssl=True, verify=True, config=config)\n                        for service in ['sts', 'cloudformation', 'kms', 'rds']}\n        self.deadline = time.monotonic() + 1500\n        self.attempted = set()\n        self.previous = '0' * 64\n        self.sequence = 0\n        self.stream = os.fdopen(os.open(self.directory / 'journal.jsonl', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600), 'wb')\n        self.proof = {'schema': 'otgd-ohio-http-restore-and-stop/v1', 'account': ACCOUNT, 'region': REGION,\n            'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],\n            'source_revision': '0844868aa543af4ab75ac5065ad48cf807b86bb3',\n            'failure_run': 38364177750, 'failure_raw_sha256': 'a792046cf0faa339d9fa40719d9cd74a716af2df46f275e100681baafd0d00ce',\n            'original_http_endpoint_enabled': False, 'status': 'pending', 'observations': [], 'receipts': []}\n\n    def event(self, event, **fields):\n        record = {'sequence': self.sequence, 'previous_sha256': self.previous, 'event': event,\n                  'utc': datetime.now(timezone.utc).isoformat(), **fields}\n        raw = (json.dumps(record, sort_keys=True, separators=(',', ':'), default=str) + '\\n').encode()\n        self.stream.write(raw); self.stream.flush(); os.fsync(self.stream.fileno())\n        self.previous = hashlib.sha256(raw).hexdigest(); self.sequence += 1\n\n    def persist(self):\n        raw = (json.dumps(self.proof, indent=2, sort_keys=True, default=str) + '\\n').encode()\n        need(len(raw) <= 262144, 'Metadata evidence bound exceeded')\n        temporary = self.directory / '.stabilization.json.tmp'\n        fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\n        with os.fdopen(fd, 'wb') as stream:\n            stream.write(raw); stream.flush(); os.fsync(stream.fileno())\n        os.replace(temporary, self.directory / 'stabilization.json')\n        fd = os.open(self.directory, os.O_RDONLY | os.O_DIRECTORY)\n        try: os.fsync(fd)\n        finally: os.close(fd)\n\n    def provenance(self):\n        need(hashlib.sha256(self.admission.read_bytes()).hexdigest() == os.environ['OHIO_STABILIZE_ADMISSION_SHA256'], 'Admission changed')\n        result = subprocess.run([sys.executable, str(self.admission)], capture_output=True, timeout=120)\n        need(result.returncode == 0, 'Fresh qualified source admission denied')\n\n    def identity(self):\n        need(self.clients['sts'].get_caller_identity()['Account'] == ACCOUNT, 'Actual account differs')\n        cf = self.clients['cloudformation']\n        rows = cf.describe_stacks(StackName=STACK)['Stacks']\n        need(len(rows) == 1 and rows[0]['StackId'] == STACK and rows[0]['StackStatus'] == 'IMPORT_ROLLBACK_COMPLETE', 'Original CF differs')\n        body = cf.get_template(StackName=STACK, TemplateStage='Original')['TemplateBody']\n        body = json.loads(body) if isinstance(body, str) else body\n        need(digest(body) == TEMPLATE_SHA and len(body['Resources']) == 15\n             and all(r.get('DeletionPolicy') == 'Retain' and r.get('UpdateReplacePolicy') == 'Retain' for r in body['Resources'].values()), 'Retain template differs')\n        inventory = []; token = None\n        for _ in range(8):\n            response = cf.list_stack_resources(StackName=STACK, **({'NextToken': token} if token else {}))\n            inventory.extend(response['StackResourceSummaries']); token = response.get('NextToken')\n            if not token: break\n        need(not token, 'CF inventory incomplete')\n        projection = [{k: r[k] for k in ['LogicalResourceId', 'PhysicalResourceId', 'ResourceType', 'ResourceStatus']} for r in inventory]\n        need(digest(sorted(projection, key=lambda r: r['LogicalResourceId'])) == INVENTORY_SHA, 'Original CF inventory differs')\n        key = self.clients['kms'].describe_key(KeyId=KEY)['KeyMetadata']\n        need(key.get('Arn') == KEY and key.get('AWSAccountId') == ACCOUNT and key.get('KeyState') == 'Enabled'\n             and key.get('Enabled') is True and key.get('KeyManager') == 'CUSTOMER', 'Original key differs')\n        return self.database()\n\n    def database(self):\n        rds = self.clients['rds']\n        clusters = rds.describe_db_clusters(DBClusterIdentifier=PREFIX)['DBClusters']\n        writers = rds.describe_db_instances(DBInstanceIdentifier=PREFIX + '-writer')['DBInstances']\n        need(len(clusters) == 1 and len(writers) == 1, 'Original DB identities ambiguous')\n        c, w = clusters[0], writers[0]\n        need(c.get('DBClusterArn') == CLUSTER_ARN and c.get('DbClusterResourceId') == CLUSTER_UID\n             and c.get('DBClusterIdentifier') == PREFIX and c.get('ClusterCreateTime').isoformat() == '2026-10-12T19:01:06.941000+00:00'\n             and w.get('DbiResourceId') == WRITER_UID and w.get('DBInstanceIdentifier') == PREFIX + '-writer'\n             and w.get('DBInstanceArn') == 'arn:aws:rds:us-east-2:738470137867:db:' + PREFIX + '-writer'\n             and w.get('DBClusterIdentifier') == PREFIX and w.get('PubliclyAccessible') is False\n             and w.get('AvailabilityZone') == 'us-east-2a', 'Immutable original DB/private identity differs')\n        for row in [c, w]:\n            need(row.get('StorageEncrypted') is True and row.get('KmsKeyId') == KEY\n                 and row.get('Engine') == 'aurora-postgresql' and row.get('EngineVersion') == '16.15'\n                 and row.get('DeletionProtection') is False, 'Original encryption/engine/protection differs')\n            owned(row.get('TagList'))\n        members = c.get('DBClusterMembers'); groups = c.get('VpcSecurityGroups'); subnet = w.get('DBSubnetGroup', {})\n        need(isinstance(members, list) and len(members) == 1 and members[0].get('DBInstanceIdentifier') == PREFIX + '-writer'\n             and members[0].get('IsClusterWriter') is True and isinstance(groups, list) and len(groups) == 1\n             and groups[0].get('VpcSecurityGroupId') == 'sg-0b005b69464a8c622'\n             and c.get('DBSubnetGroup') == PREFIX + '-databasesubnets-6j1kyh1yaoxh'\n             and subnet.get('VpcId') == 'vpc-03d6cfa8bde278d3f' and subnet.get('DBSubnetGroupName') == c['DBSubnetGroup']\n             and type(c.get('HttpEndpointEnabled')) is bool, 'Original private network/HTTP metadata differs')\n        selected = {'cluster_uid': CLUSTER_UID, 'writer_uid': WRITER_UID, 'cluster_status': c.get('Status'),\n            'writer_status': w.get('DBInstanceStatus'), 'http_endpoint_enabled': c['HttpEndpointEnabled'],\n            'cluster_create_time': c['ClusterCreateTime'].isoformat(), 'private': True, 'key_arn': KEY}\n        return selected\n\n    def wait(self, predicate, label, timeout):\n        deadline = min(self.deadline, time.monotonic() + timeout)\n        while time.monotonic() < deadline:\n            state = self.database()\n            if predicate(state):\n                self.proof['observations'].append({'label': label, 'utc': datetime.now(timezone.utc).isoformat(), **state})\n                self.event('verified-postcondition', label=label, **state); self.persist(); return state\n            need(state['cluster_status'] in {'available', 'modifying', 'starting', 'stopping', 'stopped', 'backing-up', 'resetting-master-credentials'}\n                 and state['writer_status'] in {'available', 'modifying', 'starting', 'stopping', 'stopped', 'backing-up', 'resetting-master-credentials'}, 'Unexpected DB state')\n            time.sleep(5)\n        raise RuntimeError('Bounded readiness deadline: ' + label)\n\n    def mutate(self, operation):\n        need(operation in {'disable_http_endpoint', 'stop_db_cluster'} and operation not in self.attempted, 'Mutation outside single-transport allowlist')\n        self.provenance(); state = self.identity()\n        need(state['cluster_status'] == state['writer_status'] == 'available', 'Fresh target is not available')\n        need(state['http_endpoint_enabled'] is (operation == 'disable_http_endpoint'), 'Fresh HTTP state differs')\n        kwargs = {'ResourceArn': CLUSTER_ARN} if operation == 'disable_http_endpoint' else {'DBClusterIdentifier': PREFIX}\n        self.event('intent', operation=operation, arguments=kwargs, precondition=state, transport_attempts=1)\n        self.attempted.add(operation)\n        response = getattr(self.clients['rds'], operation)(**kwargs)\n        request = response.get('ResponseMetadata', {}).get('RequestId')\n        need(isinstance(request, str) and request, 'Native request receipt unavailable')\n        receipt = {'operation': operation, 'request_id': request, 'utc': datetime.now(timezone.utc).isoformat()}\n        self.proof['receipts'].append(receipt); self.event('mutation-receipt', **receipt); self.persist()\n        if operation == 'disable_http_endpoint':\n            need(response.get('ResourceArn') == CLUSTER_ARN and response.get('HttpEndpointEnabled') is False, 'Disable response unconfirmed')\n\n    def run(self):\n        try:\n            self.provenance(); initial = self.identity()\n            self.proof['observations'].append({'label': 'initial-fresh-metadata', **initial}); self.persist()\n            stable = self.wait(lambda s: s['cluster_status'] == s['writer_status'] and s['cluster_status'] in {'available', 'stopped'}, 'ready-for-restoration', 600)\n            if stable['http_endpoint_enabled']:\n                need(stable['cluster_status'] == 'available', 'Stopped DB HTTP restoration needs separate review; no start permitted')\n                self.mutate('disable_http_endpoint')\n            ready = self.wait(lambda s: s['http_endpoint_enabled'] is False and s['cluster_status'] == s['writer_status']\n                              and s['cluster_status'] in {'available', 'stopped'}, 'original-http-false-verified', 600)\n            if ready['cluster_status'] == 'available': self.mutate('stop_db_cluster')\n            final = self.wait(lambda s: s['http_endpoint_enabled'] is False and s['cluster_status'] == s['writer_status'] == 'stopped', 'both-stopped-http-false', 900)\n            self.proof.update(status='original_http_false_and_both_stopped_verified', final=final)\n            return 0\n        except Exception as error:\n            self.proof.update(status='blocked_preserve_no_retry', error_type=type(error).__name__, sanitized_reason=str(error) if isinstance(error, RuntimeError) else 'SDK request unavailable or unconfirmed')\n            self.event('operation-blocked', error_type=type(error).__name__)\n            return 1\n        finally:\n            self.proof['finished_utc'] = datetime.now(timezone.utc).isoformat(); self.persist()\n\n\nif __name__ == '__main__':\n    raise SystemExit(Stabilization().run())\nASSETFILE\npython3 - <<'HASHPY'\nimport hashlib, os\nfrom pathlib import Path\np=Path(os.environ['OHIO_STABILIZE_DIR']) / 'stabilize_ohio.py'\nassert not p.is_symlink() and hashlib.sha256(p.read_bytes()).hexdigest()=='1d412754de972d964968bab03391ab6486fd000030633df0965b48162841111e'\np.chmod(0o600)\nHASHPY\n"
    - name: Stage exact reviewed sdk-install.py
      shell: bash
      run: "set -euo pipefail\numask 077\ncat > \"$OHIO_STABILIZE_DIR/sdk-install.py\" <<'ASSETFILE'\nimport os, subprocess, tomllib\nfrom pathlib import Path\npackages = {'boto3', 'botocore', 's3transfer', 'jmespath', 'python-dateutil', 'six', 'urllib3'}\nlock = tomllib.loads(Path('services/api/uv.lock').read_text())\nrows = [p for p in lock['package'] if p['name'] in packages]\nif len(rows) != len(packages) or {p['name'] for p in rows} != packages:\n    raise SystemExit('SDK lock inventory differs')\nif any(p['version'] != '1.43.111' for p in rows if p['name'] in ('boto3', 'botocore')):\n    raise SystemExit('Native diagnostic SDK model differs from qualified source')\nroot = Path(os.environ['RUNNER_TEMP'])\nrequirements = root / 'regional-diagnostic-sdk-requirements.txt'\nrequirements.write_text('\\n'.join(p['name'] + '==' + p['version'] + ' ' + ' '.join(\n    '--hash=' + w['hash'] for w in p.get('wheels', [])) for p in rows) + '\\n')\nif any(not p.get('wheels') for p in rows):\n    raise SystemExit('SDK wheel hash is unavailable')\nsubprocess.run(['python3', '-m', 'pip', 'install', '--disable-pip-version-check', '--no-input',\n    '--require-hashes', '--no-deps', '--only-binary=:all:', '--target', str(root / 'regional-diagnostic-sdk'),\n    '-r', str(requirements)], check=True, timeout=90)\nASSETFILE\npython3 - <<'HASHPY'\nimport hashlib, os\nfrom pathlib import Path\np=Path(os.environ['OHIO_STABILIZE_DIR']) / 'sdk-install.py'\nassert not p.is_symlink() and hashlib.sha256(p.read_bytes()).hexdigest()=='d4801e296b0b6d083018369538e7b99159c9b3e9552471a24268d128170afb3a'\np.chmod(0o600)\nHASHPY\n"
    - name: Stage exact reviewed stabilization_admission.py
      shell: bash
      run: "set -euo pipefail\numask 077\ncat > \"$OHIO_STABILIZE_DIR/stabilization_admission.py\" <<'ASSETFILE'\nimport hashlib, io, json, os, re, subprocess, zipfile\nSOURCE = '0844868aa543af4ab75ac5065ad48cf807b86bb3'\nTREE = '1afe65b4d2a6ba3a4c541c9ecf7bc61f287ee908'\nRUN = 38350430258\nARTIFACT = 11790454913\nRAW_SHA256 = '9338903893d1bb1d82097cca4ea7a59cd81579d1f85cb853310c981592a2d165'\nREPOSITORY = 'R3fresh-dev/One-The-Go-Detection'\nWORKFLOW = '.github/workflows/merge-gate.yml'\nJOBS = {'unit-coverage', 'components', 'atdd', 'preview / ios', 'platform / postgres-integration',\n    'native / android', 'native / protected-reader', 'native / ios', 'platform / localstack-integration',\n    'native / shared-and-firmware', 'platform / contracts-and-synthesis', 'platform / fargate-container-runtime',\n    'preview / android', 'merge-gate'}\nLABELS = {'unit-coverage', 'atdd', 'components', 'performance', 'live-dependencies', 'docker-health',\n    'localstack-api', 'specifications', 'native-android', 'native-ios', 'firmware', 'hosted-android', 'hosted-ios'}\n\ndef require(condition, reason):\n    if not condition:\n        raise SystemExit('Regional read-only admission blocked: ' + reason)\n\ndef command(args, binary=False):\n    result = subprocess.run(args, capture_output=True, text=not binary, timeout=30)\n    require(result.returncode == 0 and len(result.stdout if binary else result.stdout.encode()) <= 1048576,\n        'bounded authenticated command unavailable')\n    return result.stdout\n\ndef api(path):\n    return json.loads(command(['gh', 'api', (f'repos/{REPOSITORY}/' + path).rstrip('/')]))\n\ndef latest():\n    response = api('actions/workflows/merge-gate.yml/runs?head_sha=' + SOURCE + '&per_page=100')\n    require(response.get('total_count', 101) <= 100, 'gate inventory exceeds bound')\n    candidates = [r for r in response['workflow_runs'] if r.get('head_sha') == SOURCE\n        and r.get('path') == WORKFLOW and r.get('head_branch') == 'main' and r.get('event') == 'push']\n    require(candidates and max(r['id'] for r in candidates) == RUN, 'latest trusted main gate differs')\n\nrequire(ARTIFACT > 0 and re.fullmatch(r'[0-9a-f]{64}', RAW_SHA256), 'root gate/artifact bindings pending')\nrequire(os.environ['GH_REPO'] == REPOSITORY and os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'\n    and os.environ['GITHUB_REF'] == 'refs/heads/work-aws-regional-diagnostic', 'repository/trigger differs')\nrequire(command(['git', 'rev-parse', 'HEAD']).strip() == SOURCE\n    and command(['git', 'rev-parse', 'HEAD^{tree}']).strip() == TREE\n    and not command(['git', 'status', '--porcelain']).strip(), 'immutable source/tree differs')\nrequire(api('')['default_branch'] == 'main' and api('git/ref/heads/main')['object']['sha'] == SOURCE,\n    'current default main differs')\nrun = api(f'actions/runs/{RUN}')\nrequire(run.get('id') == RUN and run.get('head_sha') == SOURCE and run.get('path') == WORKFLOW\n    and run.get('head_branch') == 'main' and run.get('event') == 'push'\n    and run.get('status') == 'completed' and run.get('conclusion') == 'success'\n    and run.get('run_attempt') == 1\n    and run.get('repository', {}).get('full_name') == REPOSITORY\n    and run.get('head_repository', {}).get('full_name') == REPOSITORY, 'trusted main gate differs')\nworkflow = api(f\"actions/workflows/{run['workflow_id']}\")\nrequire(workflow.get('path') == WORKFLOW and workflow.get('state') == 'active', 'gate workflow differs')\nlatest()\nresponse = api(f\"actions/runs/{RUN}/attempts/{run['run_attempt']}/jobs?per_page=100\")\njobs = response.get('jobs', [])\nrequire(response.get('total_count') == 14 and len(jobs) == 14 and {j['name'] for j in jobs} == JOBS\n    and len({j['id'] for j in jobs}) == 14\n    and all(j.get('head_sha') == SOURCE and j.get('run_id') == RUN and j.get('run_attempt') == run['run_attempt']\n        and j.get('status') == 'completed' and j.get('conclusion') == 'success' for j in jobs), 'all14 jobs differ')\nresponse = api(f'actions/runs/{RUN}/artifacts?per_page=100')\nrows = [a for a in response.get('artifacts', []) if a.get('name') == 'exact-revision-merge-evidence']\nrequire(response.get('total_count', 101) <= 100 and len(rows) == 1, 'aggregate artifact is ambiguous')\nartifact = rows[0]\njob = next(j for j in jobs if j['name'] == 'merge-gate')\nrequire(artifact.get('id') == ARTIFACT and artifact.get('expired') is False\n    and artifact.get('digest') == 'sha256:' + RAW_SHA256 and artifact.get('size_in_bytes') == 393\n    and artifact.get('workflow_run', {}).get('id') == RUN and artifact.get('workflow_run', {}).get('head_sha') == SOURCE\n    and job['started_at'] <= artifact.get('created_at', '') <= job['completed_at'], 'raw artifact binding differs')\nraw = command(['gh', 'api', f'repos/{REPOSITORY}/actions/artifacts/{ARTIFACT}/zip'], binary=True)\nrequire(len(raw) == artifact['size_in_bytes'] and hashlib.sha256(raw).hexdigest() == RAW_SHA256,\n    'raw aggregate ZIP digest differs')\nwith zipfile.ZipFile(io.BytesIO(raw)) as archive:\n    members = [m for m in archive.infolist() if not m.is_dir()]\n    require(len(members) == 1 and members[0].filename == 'gates.json' and members[0].file_size <= 262144\n        and (members[0].external_attr >> 16) & 0o170000 != 0o120000, 'aggregate member differs')\n    evidence = json.loads(archive.read(members[0]))\nrequire(evidence.get('revision') == SOURCE and evidence.get('run_url') == f'https://github.com/{REPOSITORY}/actions/runs/{RUN}'\n    and isinstance(evidence.get('passed'), list) and len(evidence['passed']) == 13 and set(evidence['passed']) == LABELS,\n    'aggregate exact revision/jobs differ')\nafter = api(f'actions/artifacts/{ARTIFACT}')\nrequire(all(after.get(k) == artifact.get(k) for k in ['id','name','expired','digest','size_in_bytes','created_at','workflow_run']),\n    'aggregate changed after download')\ncurrent = api(f'actions/runs/{RUN}')\nrequire(all(current.get(k) == run.get(k) for k in ['id','head_sha','run_attempt','status','conclusion','workflow_id']),\n    'gate changed after download')\nlatest()\nrequire(api('git/ref/heads/main')['object']['sha'] == SOURCE and not command(['git','status','--porcelain']).strip(),\n    'current main/source changed')\nprint(json.dumps({'admitted_revision': SOURCE, 'admitted_tree': TREE, 'gate_run_id': RUN,\n    'gate_attempt': run['run_attempt'], 'successful_jobs': 14, 'raw_aggregate_sha256': RAW_SHA256,\n    'admission_scope': 'READ_ONLY_EAST1_WEST2_PREFLIGHT_AND_OHIO_ACCOUNT_PLAN_ONLY'}))\nASSETFILE\npython3 - <<'HASHPY'\nimport hashlib, os\nfrom pathlib import Path\np=Path(os.environ['OHIO_STABILIZE_DIR']) / 'stabilization_admission.py'\nassert not p.is_symlink() and hashlib.sha256(p.read_bytes()).hexdigest()=='4fd6338af3972342e682ce9fb77439b33f7c6087b857d04aecd6f48efe75074c'\np.chmod(0o600)\nHASHPY\n"
    - name: Admit exact current qualified main before credentials
      shell: bash
      run: 'set -euo pipefail

        python3 "$OHIO_STABILIZE_DIR/stabilization_admission.py" > "$OHIO_STABILIZE_DIR/admission-before-credentials.json"

        '
    - name: Install only existing seven hash-locked SDK wheels
      shell: bash
      run: 'set -euo pipefail

        python3 "$OHIO_STABILIZE_DIR/sdk-install.py"

        '
    - name: Configure exact account after source admission
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
      with:
        aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-2
        allowed-account-ids: '738470137867'
        unset-current-credentials: true
        force-skip-oidc: true
        output-credentials: false
        retry-max-attempts: 1
        action-timeout-s: 90
    - name: Restore original HTTP false and stop only exact Ohio database
      shell: bash
      run: 'set -euo pipefail

        python3 "$OHIO_STABILIZE_DIR/stabilize_ohio.py"

        '
    - name: Preserve only selected stabilization metadata
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: ohio-stabilization-metadata-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/ohio-stabilization/stabilization.json

          ${{ runner.temp }}/ohio-stabilization/journal.jsonl

          ${{ runner.temp }}/ohio-stabilization/admission-before-credentials.json'
        retention-days: 90
        if-no-files-found: error
