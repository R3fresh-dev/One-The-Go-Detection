name: Pause owned development compute and retain data
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: otgd-fargate-development-738470137867-us-east-2
  cancel-in-progress: false
jobs:
  pause:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work-aws-pause-development'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 6bca4fc7a77d268f35ea6a5b0f577f37389158cc
        persist-credentials: false
    - name: Admit clean current main and exact successful all-14 job evidence
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import json
        import os
        from pathlib import Path
        import subprocess
        import tempfile

        revision = '6bca4fc7a77d268f35ea6a5b0f577f37389158cc'
        repository = 'R3fresh-dev/One-The-Go-Detection'
        run_id = 38316406153
        workflow_path = '.github/workflows/merge-gate.yml'
        required_jobs = {'unit-coverage', 'components', 'atdd', 'preview / ios',
            'platform / postgres-integration', 'native / android', 'native / protected-reader',
            'native / ios', 'platform / localstack-integration', 'native / shared-and-firmware',
            'platform / contracts-and-synthesis', 'platform / fargate-container-runtime', 'preview / android', 'merge-gate'}
        required_labels = {'unit-coverage', 'atdd', 'components', 'performance', 'live-dependencies',
            'docker-health', 'localstack-api', 'specifications', 'native-android', 'native-ios',
            'firmware', 'hosted-android', 'hosted-ios'}

        def command(args, timeout=30):
            result = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
            if result.returncode or len(result.stdout.encode()) > 2097152:
                raise SystemExit('Read-only snapshot admission blocked: command unavailable (' + ' '.join(args[:2]) + ')')
            return result.stdout

        def api(path):
            return json.loads(command(['gh', 'api', ('repos/' + repository + '/' + path).rstrip('/')]))

        if (os.environ['GH_REPO'] != repository or os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch'
                or os.environ['GITHUB_REF'] != 'refs/heads/work-aws-pause-development'
                or command(['git', 'rev-parse', 'HEAD']).strip() != revision
                or command(['git', 'status', '--porcelain']).strip()):
            raise SystemExit('Read-only snapshot admission blocked: source or trigger differs')
        if (api('')['default_branch'] != 'main'
                or api('git/ref/heads/main')['object']['sha'] != revision):
            raise SystemExit('Read-only snapshot admission blocked: current main differs')
        run = api('actions/runs/' + str(run_id))
        if (run.get('head_sha') != revision or run.get('status') != 'completed'
                or run.get('conclusion') != 'success' or run.get('path') != workflow_path
                or run.get('head_branch') != 'main' or run.get('event') not in {'push', 'workflow_dispatch'}
                or run.get('repository', {}).get('full_name') != repository
                or run.get('head_repository', {}).get('full_name') != repository):
            raise SystemExit('Read-only snapshot admission blocked: gate run differs')
        workflow = api('actions/workflows/' + str(run['workflow_id']))
        if workflow.get('path') != workflow_path or workflow.get('state') != 'active':
            raise SystemExit('Read-only snapshot admission blocked: gate workflow differs')
        latest = api('actions/workflows/merge-gate.yml/runs?head_sha=' + revision + '&per_page=100')
        trusted = [r for r in latest['workflow_runs'] if r.get('head_sha') == revision
            and r.get('path') == workflow_path and r.get('head_branch') == 'main'
            and r.get('event') in {'push', 'workflow_dispatch'}]
        if not trusted or max(r['id'] for r in trusted) != run_id:
            raise SystemExit('Read-only snapshot admission blocked: latest gate differs')
        inventory = api(f"actions/runs/{run_id}/attempts/{run['run_attempt']}/jobs?per_page=100")
        jobs = inventory['jobs']
        if (inventory['total_count'] != 14 or len(jobs) != 14
                or {job['name'] for job in jobs} != required_jobs
                or len({job['id'] for job in jobs}) != 14
                or any(job.get('status') != 'completed' or job.get('conclusion') != 'success'
                    or job.get('head_sha') != revision or job.get('run_id') != run_id
                    or job.get('run_attempt') != run['run_attempt'] for job in jobs)):
            raise SystemExit('Read-only snapshot admission blocked: all-14 jobs differ')
        with tempfile.TemporaryDirectory(prefix='observer-gates-') as destination:
            command(['gh', 'run', 'download', str(run_id), '--repo', repository,
                '--name', 'exact-revision-merge-evidence', '--dir', destination], timeout=60)
            path = Path(destination) / 'gates.json'
            if not path.is_file() or path.stat().st_size > 262144:
                raise SystemExit('Read-only snapshot admission blocked: aggregate evidence unavailable')
            evidence = json.loads(path.read_text())
            labels = evidence.get('passed')
            if (evidence.get('revision') != revision
                    or evidence.get('run_url') != f'https://github.com/{repository}/actions/runs/{run_id}'
                    or not isinstance(labels, list) or len(labels) != 13 or set(labels) != required_labels):
                raise SystemExit('Read-only snapshot admission blocked: aggregate evidence differs')
        current = api('actions/runs/' + str(run_id))
        if any(current.get(k) != run.get(k) for k in ('id', 'head_sha', 'run_attempt', 'status', 'conclusion', 'workflow_id')):
            raise SystemExit('Read-only snapshot admission blocked: gate changed')
        if (api('git/ref/heads/main')['object']['sha'] != revision
                or command(['git', 'status', '--porcelain']).strip()):
            raise SystemExit('Read-only snapshot admission blocked: source changed')
        print(json.dumps({'admitted_revision': revision, 'gate_run': run_id, 'successful_jobs': 14}))
        PYCODE
      id: admission
    - name: Configure existing repository AWS secrets after source admission
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
      with:
        aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-2
        allowed-account-ids: '738470137867'
        unset-current-credentials: true
        force-skip-oidc: true
        output-credentials: false
        retry-max-attempts: 3
        action-timeout-s: 90
      id: credentials
    - name: Stop exact owned compute and verify retained data protections
      id: pause
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        from collections import Counter
        from datetime import datetime, timezone
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import subprocess
        import time

        ACCOUNT = '738470137867'
        REGION = 'us-east-2'
        STACK = 'otgd-serverless-development'
        STACK_ID = 'arn:aws:cloudformation:us-east-2:738470137867:stack/otgd-serverless-development/865843c0-c654-11f1-96fa-06a08a49cfef'
        CLUSTER_UID = 'cluster-TWBMR2BY5PK4PVSPRZ6S2O2U6E'
        WRITER_UID = 'db-JEOVXOBFSUIYXQ2F6GA6J7WZVY'
        TEMPLATE_SHA = '6081b2fb2aed05c2891715d45f114661637960bba3caee780f937cebdc4b4099'
        KEY_ARN = 'arn:aws:kms:us-east-2:738470137867:key/ff17e353-38bf-43df-a08c-85bd60b77aff'
        EXPECTED = {'Accounts': ['AWS::Cognito::UserPool', 'us-east-2_d5tqQ5fVy'], 'ApiLogs': ['AWS::Logs::LogGroup', '/otgd-serverless-development/api'], 'ApplicationSecret': ['AWS::SecretsManager::Secret', 'arn:aws:secretsmanager:us-east-2:738470137867:secret:otgd-serverless-development-database-app-2AaejZ'], 'CaptureSigningKey': ['AWS::KMS::Key', 'f58b580f-dad8-4b42-b4e4-b8bbffa5260b'], 'ControlLogs': ['AWS::Logs::LogGroup', '/otgd-serverless-development/control'], 'DataKey': ['AWS::KMS::Key', 'ff17e353-38bf-43df-a08c-85bd60b77aff'], 'DeletionJournal': ['AWS::S3::Bucket', 'otgd-serverless-development-738470137867-us-east-2-journal'], 'DispatcherLogs': ['AWS::Logs::LogGroup', '/otgd-serverless-development/dispatcher'], 'Exports': ['AWS::S3::Bucket', 'otgd-serverless-development-738470137867-us-east-2-exports'], 'JournalKey': ['AWS::KMS::Key', 'a3bac0e3-0a4e-49bc-9122-6822efaedb3e'], 'MaintenanceLogs': ['AWS::Logs::LogGroup', '/otgd-serverless-development/maintenance'], 'RuntimeControl': ['AWS::DynamoDB::Table', 'otgd-serverless-development-control'], 'TombstoneSecret': ['AWS::SecretsManager::Secret', 'arn:aws:secretsmanager:us-east-2:738470137867:secret:otgd-serverless-development-tombstone-gkIe6Q'], 'WebAssets': ['AWS::S3::Bucket', 'otgd-serverless-development-738470137867-us-east-2-web'], 'WorkerLogs': ['AWS::Logs::LogGroup', '/otgd-serverless-development/worker']}
        READS = {('sts','get-caller-identity'), ('cloudformation','describe-stacks'),
            ('cloudformation','list-stack-resources'), ('cloudformation','get-template'),
            ('rds','describe-db-clusters'), ('rds','describe-db-instances'),
            ('resourcegroupstaggingapi','get-resources'), ('ecs','describe-clusters'),
            ('ecs','list-services'), ('ecs','describe-services'), ('ecs','list-tasks'), ('ecs','describe-tasks'),
            ('codebuild','batch-get-projects'), ('codebuild','list-builds-for-project'), ('codebuild','batch-get-builds')}
        WRITES = {('rds','stop-db-cluster'), ('ecs','update-service'), ('ecs','stop-task'), ('codebuild','stop-build')}
        proof = {'started_at': datetime.now(timezone.utc).isoformat(), 'account': ACCOUNT, 'region': REGION,
            'actions': [], 'owned_tagged_inventory': [], 'limitations': ['Aurora automatically restarts after seven days.',
            'Retained storage, backups, images, KMS keys, secrets and logs can remain billable.',
            'Tag inventory covers resources tagged to this owned development deployment.']}
        destination = Path(os.environ['RUNNER_TEMP']) / 'pause-proof'
        destination.mkdir()

        def save():
            (destination / 'pause.json').write_text(json.dumps(proof, indent=2, sort_keys=True)+'\n')

        def aws(service, operation, options=(), query=None):
            if (service,operation) not in READS | WRITES:
                raise RuntimeError('Operation outside pause allowlist')
            command = ['aws',service,operation,'--region',REGION,'--output','json','--no-cli-pager',
                '--cli-connect-timeout','10','--cli-read-timeout','25',*options]
            if query: command += ['--query',query]
            result = subprocess.run(command,capture_output=True,text=True,timeout=45)
            if result.returncode or len(result.stdout.encode()) > 1048576:
                match = re.search(r'An error occurred \(([A-Za-z0-9_.-]+)\)',result.stderr)
                raise RuntimeError('Pause AWS call failed: '+service+'/'+operation+'/'+(match[1] if match else 'Unavailable'))
            return json.loads(result.stdout)

        def owned(tags):
            values = {t.get('Key',t.get('key')):t.get('Value',t.get('value')) for t in tags or []}
            return (values.get('project')=='one-the-go-detection' and values.get('deployment')==STACK
                and values.get('environment') in {'serverless-development','fargate-development'}
                and values.get('owner_role')=='platform-operator')

        def db_metadata():
            cluster = aws('rds','describe-db-clusters',['--db-cluster-identifier',STACK],
                'DBClusters[0].{DBClusterIdentifier:DBClusterIdentifier,DBClusterArn:DBClusterArn,DbClusterResourceId:DbClusterResourceId,Status:Status,Engine:Engine,EngineVersion:EngineVersion,DeletionProtection:DeletionProtection,StorageEncrypted:StorageEncrypted,KmsKeyId:KmsKeyId,DBSubnetGroup:DBSubnetGroup,VpcSecurityGroups:VpcSecurityGroups,DBClusterMembers:DBClusterMembers,TagList:TagList}')
            writer = aws('rds','describe-db-instances',['--db-instance-identifier',STACK+'-writer'],
                'DBInstances[0].{DBInstanceIdentifier:DBInstanceIdentifier,DBInstanceArn:DBInstanceArn,DbiResourceId:DbiResourceId,DBClusterIdentifier:DBClusterIdentifier,DBInstanceStatus:DBInstanceStatus,AvailabilityZone:AvailabilityZone,Engine:Engine,EngineVersion:EngineVersion,PubliclyAccessible:PubliclyAccessible,StorageEncrypted:StorageEncrypted,KmsKeyId:KmsKeyId,TagList:TagList}')
            if (not isinstance(cluster,dict) or not isinstance(writer,dict)
                or cluster.get('DBClusterArn') != f'arn:aws:rds:{REGION}:{ACCOUNT}:cluster:{STACK}'
                or writer.get('DBInstanceArn') != f'arn:aws:rds:{REGION}:{ACCOUNT}:db:{STACK}-writer'
                or cluster.get('DbClusterResourceId')!=CLUSTER_UID or writer.get('DbiResourceId')!=WRITER_UID
                or cluster.get('DBClusterIdentifier')!=STACK or writer.get('DBClusterIdentifier')!=STACK
                or cluster.get('Engine')!='aurora-postgresql' or writer.get('Engine')!='aurora-postgresql'
                or cluster.get('EngineVersion')!='16.15' or writer.get('EngineVersion')!='16.15'
                or cluster.get('DeletionProtection') is not True or cluster.get('StorageEncrypted') is not True
                or writer.get('StorageEncrypted') is not True or writer.get('PubliclyAccessible') is not False
                or cluster.get('KmsKeyId')!=KEY_ARN or writer.get('KmsKeyId')!=KEY_ARN
                or writer.get('AvailabilityZone')!='us-east-2a' or not owned(cluster.get('TagList')) or not owned(writer.get('TagList'))
                or cluster.get('DBClusterMembers')!=[{'DBInstanceIdentifier':STACK+'-writer','IsClusterWriter':True,'DBClusterParameterGroupStatus':'in-sync','PromotionTier':1}]):
                raise RuntimeError('Pause blocked: retained RDS authority/configuration changed')
            return cluster, writer

        try:
            if aws('sts','get-caller-identity',query='Account')!=ACCOUNT:
                raise RuntimeError('Pause blocked: AWS account differs')
            stack = aws('cloudformation','describe-stacks',['--stack-name',STACK],
                'Stacks[0].{StackId:StackId,StackStatus:StackStatus,EnableTerminationProtection:EnableTerminationProtection}')
            if (stack.get('StackId')!=STACK_ID or stack.get('StackStatus')!='IMPORT_ROLLBACK_COMPLETE'
                or stack.get('EnableTerminationProtection') is not True):
                raise RuntimeError('Pause blocked: current protected stack differs')
            inventory = aws('cloudformation','list-stack-resources',['--stack-name',STACK,'--max-items','100'])
            rows = inventory.get('StackResourceSummaries',[])
            actual = {r['LogicalResourceId']:[r['ResourceType'],r['PhysicalResourceId']] for r in rows}
            if len(rows)!=15 or inventory.get('NextToken') or actual!=EXPECTED or any(r['ResourceStatus']!='UPDATE_COMPLETE' for r in rows):
                raise RuntimeError('Pause blocked: original retained resource inventory differs')
            body = aws('cloudformation','get-template',['--stack-name',STACK,'--template-stage','Original'])['TemplateBody']
            if isinstance(body,str): body=json.loads(body)
            template_hash = hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':')).encode()).hexdigest()
            if template_hash!=TEMPLATE_SHA:
                raise RuntimeError('Pause blocked: original protected template differs')
            cluster,writer=db_metadata()
            if cluster['Status'] not in {'available','stopping','stopped'} or writer['DBInstanceStatus'] not in {'available','stopping','stopped'}:
                raise RuntimeError('Pause blocked: database is in an unexpected active transition')
            proof.update({'stack':stack,'original_resource_count':15,'template_canonical_sha256':template_hash,
                'cluster_before':cluster,'writer_before':writer})
            save()
            # The only database mutation: omit snapshot, key, protection and configuration options.
            if cluster['Status']=='available':
                response=aws('rds','stop-db-cluster',['--db-cluster-identifier',STACK],
                    'DBCluster.{DBClusterIdentifier:DBClusterIdentifier,DbClusterResourceId:DbClusterResourceId,Status:Status}')
                proof['actions'].append({'operation':'rds.stop_db_cluster','target':STACK,'result':response})
                print(json.dumps({'stop_requested':response},sort_keys=True),flush=True)
                save()
            deadline=time.monotonic()+1200
            previous=None
            heartbeat=0
            while time.monotonic()<deadline:
                cluster,writer=db_metadata()
                state=(cluster['Status'],writer['DBInstanceStatus'])
                if state!=previous or time.monotonic()-heartbeat>=60:
                    print(json.dumps({'database_pause_status':{'cluster':state[0],'writer':state[1]},'observed_at':datetime.now(timezone.utc).isoformat()},sort_keys=True),flush=True)
                    previous=state; heartbeat=time.monotonic()
                proof['cluster_after']=cluster; proof['writer_after']=writer; save()
                if state==('stopped','stopped'):
                    proof['status']='database_stopped_data_retained'
                    proof['finished_at']=datetime.now(timezone.utc).isoformat(); save()
                    print(json.dumps({'status':proof['status'],'automatic_restart_after_days':7,'retained_charges':True}),flush=True)
                    break
                if state[0] not in {'available','stopping','stopped'}:
                    raise RuntimeError('Unexpected database pause transition')
                time.sleep(15)
            else:
                raise RuntimeError('Stop requested; bounded stopped-state verification timed out')
            tagged=aws('resourcegroupstaggingapi','get-resources',
                ['--tag-filters','Key=project,Values=one-the-go-detection','--resources-per-page','100','--max-items','200'])
            if tagged.get('PaginationToken') or tagged.get('NextToken'):
                raise RuntimeError('Owned billable resource inventory exceeds its bounded page limit')
            resources=[r for r in tagged.get('ResourceTagMappingList',[]) if owned(r.get('Tags'))]
            proof['owned_tagged_inventory']=[{'arn':r['ResourceARN'],'service':r['ResourceARN'].split(':')[2]} for r in resources]
            proof['owned_resource_counts']=dict(Counter(r['service'] for r in proof['owned_tagged_inventory']))
            # Stop only positively owned service/task/build resources discovered in the tagged inventory.
            auxiliary=[]
            for resource in resources:
                arn=resource['ResourceARN']
                if arn.startswith(f'arn:aws:ecs:{REGION}:{ACCOUNT}:cluster/'):
                    cluster_rows=aws('ecs','describe-clusters',['--clusters',arn,'--include','TAGS'],
                        'clusters[].{clusterArn:clusterArn,status:status,tags:tags}')
                    if len(cluster_rows)!=1 or not owned(cluster_rows[0].get('tags')):
                        raise RuntimeError('Owned ECS cluster metadata changed')
                    services=aws('ecs','list-services',['--cluster',arn,'--max-items','100'])
                    if services.get('NextToken') or services.get('nextToken'):
                        raise RuntimeError('Owned ECS service inventory exceeds bound')
                    for service_arn in services.get('serviceArns',[]):
                        service_rows=aws('ecs','describe-services',['--cluster',arn,'--services',service_arn,'--include','TAGS'],
                            'services[].{serviceArn:serviceArn,clusterArn:clusterArn,desiredCount:desiredCount,tags:tags}')
                        if len(service_rows)!=1 or service_rows[0].get('clusterArn')!=arn or not owned(service_rows[0].get('tags')):
                            raise RuntimeError('ECS service is not positively owned by this deployment')
                        if service_rows[0].get('desiredCount',0)>0:
                            aws('ecs','update-service',['--cluster',arn,'--service',service_arn,'--desired-count','0'],
                                'service.{serviceArn:serviceArn,desiredCount:desiredCount}')
                            proof['actions'].append({'operation':'ecs.update_service(desiredCount=0)','target':service_arn})
                            auxiliary.append(('service',arn,service_arn))
                    tasks=aws('ecs','list-tasks',['--cluster',arn,'--desired-status','RUNNING','--max-items','100'])
                    if tasks.get('NextToken') or tasks.get('nextToken'):
                        raise RuntimeError('Owned ECS task inventory exceeds bound')
                    for task_arn in tasks.get('taskArns',[]):
                        task_rows=aws('ecs','describe-tasks',['--cluster',arn,'--tasks',task_arn,'--include','TAGS'],
                            'tasks[].{taskArn:taskArn,clusterArn:clusterArn,lastStatus:lastStatus,tags:tags}')
                        if len(task_rows)!=1 or task_rows[0].get('clusterArn')!=arn or not owned(task_rows[0].get('tags')):
                            raise RuntimeError('ECS task is not positively owned by this deployment')
                        if task_rows[0].get('lastStatus')!='STOPPED':
                            aws('ecs','stop-task',['--cluster',arn,'--task',task_arn,'--reason','User requested development infrastructure pause'],
                                'task.{taskArn:taskArn,lastStatus:lastStatus}')
                            proof['actions'].append({'operation':'ecs.stop_task','target':task_arn})
                            auxiliary.append(('task',arn,task_arn))
                elif arn.startswith(f'arn:aws:codebuild:{REGION}:{ACCOUNT}:project/'):
                    name=arn.split(':project/',1)[1]
                    projects=aws('codebuild','batch-get-projects',['--names',name],
                        'projects[].{name:name,arn:arn,tags:tags}')
                    if len(projects)!=1 or projects[0].get('arn')!=arn or not owned(projects[0].get('tags')):
                        raise RuntimeError('CodeBuild project is not positively owned')
                    builds=aws('codebuild','list-builds-for-project',['--project-name',name,'--sort-order','DESCENDING','--max-items','100'])
                    if builds.get('NextToken') or builds.get('nextToken'):
                        raise RuntimeError('Owned build inventory exceeds bound')
                    ids=builds.get('ids',[])
                    for start in range(0,len(ids),100):
                        rows=aws('codebuild','batch-get-builds',['--ids',*ids[start:start+100]],
                            'builds[].{id:id,projectName:projectName,buildStatus:buildStatus}')
                        for build in rows:
                            if build.get('projectName')!=name:
                                raise RuntimeError('CodeBuild ownership binding changed')
                            if build.get('buildStatus')=='IN_PROGRESS':
                                aws('codebuild','stop-build',['--id',build['id']], 'build.{id:id,buildStatus:buildStatus}')
                                proof['actions'].append({'operation':'codebuild.stop_build','target':build['id']})
                                auxiliary.append(('build',None,build['id']))
            auxiliary_deadline=time.monotonic()+600
            remaining=list(auxiliary)
            while remaining and time.monotonic()<auxiliary_deadline:
                pending=[]
                for kind,cluster_arn,target in remaining:
                    if kind=='service':
                        current=aws('ecs','describe-services',['--cluster',cluster_arn,'--services',target],
                            'services[0].{serviceArn:serviceArn,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount}')
                        stopped=(current.get('serviceArn')==target and current.get('desiredCount')==0
                            and current.get('runningCount')==0 and current.get('pendingCount')==0)
                    elif kind=='task':
                        current=aws('ecs','describe-tasks',['--cluster',cluster_arn,'--tasks',target],
                            'tasks[0].{taskArn:taskArn,lastStatus:lastStatus}')
                        stopped=current.get('taskArn')==target and current.get('lastStatus')=='STOPPED'
                    else:
                        current=aws('codebuild','batch-get-builds',['--ids',target],
                            'builds[0].{id:id,buildStatus:buildStatus}')
                        stopped=current.get('id')==target and current.get('buildStatus') in {'STOPPED','SUCCEEDED','FAILED','FAULT','TIMED_OUT'}
                    if not stopped: pending.append((kind,cluster_arn,target))
                remaining=pending
                proof['auxiliary_compute_pending']=[{'kind':x[0],'target':x[2]} for x in remaining]; save()
                if remaining: time.sleep(15)
            if remaining:
                raise RuntimeError('Owned auxiliary compute stop requested but verification timed out')
            proof['status']='compute_paused_data_retained'
            print(json.dumps({'owned_resource_counts':proof['owned_resource_counts'],'owned_tagged_inventory':proof['owned_tagged_inventory']},sort_keys=True),flush=True)
            proof['finished_at']=datetime.now(timezone.utc).isoformat(); save()
        except Exception as error:
            proof['status']='pause_incomplete'; proof['failure_type']=type(error).__name__; save()
            raise SystemExit(str(error) if isinstance(error,RuntimeError) else 'Pause evidence unavailable: '+type(error).__name__)

        PYCODE
    - name: Preserve bounded credential-free pause evidence
      if: always() && steps.admission.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: development-pause-${{ github.run_id }}
        path: ${{ runner.temp }}/pause-proof/
        if-no-files-found: error
        retention-days: 7
