name: Retire exact owned Ohio development infrastructure

on:
  workflow_dispatch:
    inputs:
      reviewed_operation_commit:
        description: Exact root-reviewed operations commit; single execution only
        required: true
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: otgd-ohio-retirement-738470137867-us-east-2
  cancel-in-progress: false

jobs:
  retire:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work-aws-ohio-retire' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: R3fresh-dev/One-The-Go-Detection
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      AWS_MAX_ATTEMPTS: '1'
      AWS_PAGER: ''
      OTGD_RETIREMENT_ADMISSION_SHA256: 6d5c16e6c9e8ba9e795c42fab6dc0782908d21f57288d5ba9e279e0976960a01
      OTGD_RETIREMENT_PLAN_SHA256: 564ef704204847dbafd3190b8263bb2fe7f828716dbbbc255c74ab0a2c5eeba9
      OTGD_RETIREMENT_SQL_HOOK_SHA256: '3fc878b5d24248c69c2eae51a9bdd606635ed78e9e75d312f6cb7d0641764680'
    steps:
      - name: Bind private operation paths from the current runner
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}"
          [[ "$RUNNER_TEMP" == /* && "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]]
          printf 'OTGD_RETIREMENT_ASSETS_DIR=%s/ohio-retirement-assets\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'OTGD_RETIREMENT_EVIDENCE_DIR=%s/ohio-retirement-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0844868aa543af4ab75ac5065ad48cf807b86bb3
          persist-credentials: false

      - name: Stage only private root-reviewed operation assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'STAGEPY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          embedded = {'retire_ohio.py': {'base64': '', 'sha256': 'ecffe38c2bbd649979495fd1f6ff64432982ce39ebbe61a2cb9feeef3ae31d80'}, 'reviewed-plan.json': {'base64': '', 'sha256': '564ef704204847dbafd3190b8263bb2fe7f828716dbbbc255c74ab0a2c5eeba9'}, 'inventory.json': {'base64': '', 'sha256': 'd0cba7eb1600c0b5978af154d8461e032e85a69ed1f55355c2dee616508d18f7'}, 'ohio-table-count.py': {'base64': '', 'sha256': '3fc878b5d24248c69c2eae51a9bdd606635ed78e9e75d312f6cb7d0641764680'}, 'retirement_admission.py': {'base64': '', 'sha256': '6d5c16e6c9e8ba9e795c42fab6dc0782908d21f57288d5ba9e279e0976960a01'}}
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          assets = Path(os.environ['OTGD_RETIREMENT_ASSETS_DIR'])
          evidence = Path(os.environ['OTGD_RETIREMENT_EVIDENCE_DIR'])
          if (assets.resolve() != root / 'ohio-retirement-assets'
                  or evidence.resolve() != root / 'ohio-retirement-evidence'):
              raise SystemExit('Private operation directory differs')
          evidence.mkdir(mode=0o700, exist_ok=False)
          proof = evidence / 'asset-manifest.json'
          proof.write_text(json.dumps({'schema': 'otgd-ohio-retirement-assets/v1', 'root_review_materialized': False}) + '\n')
          proof.chmod(0o600)
          expected = {'retirement_admission.py', 'retire_ohio.py', 'reviewed-plan.json', 'inventory.json'}
          sql_hook_sha = os.environ.get('OTGD_RETIREMENT_SQL_HOOK_SHA256', '')
          if sql_hook_sha:
              if sql_hook_sha != '3fc878b5d24248c69c2eae51a9bdd606635ed78e9e75d312f6cb7d0641764680':
                  raise SystemExit('Optional SQL hook is not the exact reviewed source')
              expected.add('ohio-table-count.py')
          if set(embedded) != expected:
              raise SystemExit('Root-reviewed operation assets are not materialized')
          assets.mkdir(mode=0o700, exist_ok=False)
          manifest = []
          total = 0
          for name in sorted(expected):
              item = embedded[name]
              if set(item) != {'base64', 'sha256'}:
                  raise SystemExit('Embedded operation asset schema differs')
              raw = base64.b64decode(item['base64'], validate=True)
              total += len(raw)
              if (len(raw) > 2_097_152 or total > 2_097_152
                      or hashlib.sha256(raw).hexdigest() != item['sha256']):
                  raise SystemExit('Embedded operation asset bytes differ or exceed bound')
              descriptor = os.open(assets / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, 'wb') as stream:
                  stream.write(raw)
                  stream.flush()
                  os.fsync(stream.fileno())
              manifest.append({'name': name, 'sha256': item['sha256'], 'bytes': len(raw)})
          proof.write_text(json.dumps({'schema': 'otgd-ohio-retirement-assets/v1', 'root_review_materialized': True,
              'assets': manifest, 'total_bytes': total, 'no_user_payload_or_secret_values': True}, sort_keys=True) + '\n')
          STAGEPY

      - name: Authenticate exact reviewed source and raw mandatory gates before credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 "$OTGD_RETIREMENT_ASSETS_DIR/retirement_admission.py" > "$OTGD_RETIREMENT_EVIDENCE_DIR/admission-before-credentials.json"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: false
      - name: Install only the exact application's locked AWS client environment
        run: uv sync --project services/api --locked

      - name: Configure existing repository AWS secrets after exact admission
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-2
          allowed-account-ids: '738470137867'
          unset-current-credentials: true
          force-skip-oidc: true
          output-credentials: false
          retry-max-attempts: 1
          action-timeout-s: 90

      - name: Repeat authenticated admission immediately before execution
        shell: bash
        run: |
          set -euo pipefail
          python3 "$OTGD_RETIREMENT_ASSETS_DIR/retirement_admission.py" > "$OTGD_RETIREMENT_EVIDENCE_DIR/admission-before-execution.json"

      - name: Execute one reviewed preserving plan with admission before every mutation
        shell: bash
        run: |
          set -euo pipefail
          sql_arguments=()
          if [[ -n "$OTGD_RETIREMENT_SQL_HOOK_SHA256" ]]; then
            sql_arguments+=(--sql-evidence-script "$OTGD_RETIREMENT_ASSETS_DIR/ohio-table-count.py"
              --sql-evidence-sha256 "$OTGD_RETIREMENT_SQL_HOOK_SHA256")
          fi
          uv run --project services/api python "$OTGD_RETIREMENT_ASSETS_DIR/retire_ohio.py" \
            --plan "$OTGD_RETIREMENT_ASSETS_DIR/reviewed-plan.json" \
            --plan-sha256 "$OTGD_RETIREMENT_PLAN_SHA256" \
            --inventory "$OTGD_RETIREMENT_ASSETS_DIR/inventory.json" \
            --journal "$OTGD_RETIREMENT_EVIDENCE_DIR/journal.jsonl" \
            --admission-script "$OTGD_RETIREMENT_ASSETS_DIR/retirement_admission.py" \
            --admission-sha256 "$OTGD_RETIREMENT_ADMISSION_SHA256" \
            "${sql_arguments[@]}" \
            --mode execute > "$OTGD_RETIREMENT_EVIDENCE_DIR/operation-result.json"

      - name: Capture bounded metadata evidence even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EVIDENCEPY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          directory = Path(os.environ['OTGD_RETIREMENT_EVIDENCE_DIR'])
          destination = root / 'ohio-retirement-upload'
          destination.mkdir(mode=0o700, exist_ok=False)
          expected = ['journal.jsonl', 'operation-result.json', 'asset-manifest.json',
              'admission-before-credentials.json', 'admission-before-execution.json']
          probe_directory = root / 'ohio-retirement'
          sources = {name: directory / name for name in expected}
          if os.environ.get('OTGD_RETIREMENT_SQL_HOOK_SHA256'):
              expected.append('sql-table-count.json')
              sources['sql-table-count.json'] = probe_directory / 'sql-table-count.json'
          status = {'schema': 'otgd-ohio-retirement-metadata-capture/v1', 'files': [],
              'only_hash_bound_operation_metadata': True, 'complete_capture': True}
          total = 0
          if directory.resolve() != root / 'ohio-retirement-evidence' or directory.is_symlink():
              status.update(complete_capture=False, sanitized_error_code='PrivateEvidenceDirectoryDiffers')
          elif not directory.is_dir():
              status.update(complete_capture=False, sanitized_error_code='PrivateEvidenceUnavailable')
          else:
              for name in expected:
                  path = sources[name]
                  if name == 'sql-table-count.json' and (probe_directory.is_symlink()
                          or probe_directory.resolve() != root / 'ohio-retirement'):
                      status['complete_capture'] = False
                      status['files'].append({'name': name, 'sanitized_error_code': 'ProbeEvidenceDirectoryDiffers'})
                      continue
                  if not path.exists():
                      status['files'].append({'name': name, 'presence': 'absent'})
                      continue
                  if path.is_symlink() or not path.is_file():
                      status['complete_capture'] = False
                      status['files'].append({'name': name, 'sanitized_error_code': 'NonRegularEvidenceRejected'})
                      continue
                  if name == 'sql-table-count.json':
                      if path.stat().st_size > 65536:
                          status['complete_capture'] = False
                          status['files'].append({'name': name, 'sanitized_error_code': 'ProbeEvidenceBoundExceeded'})
                          continue
                      try:
                          probe = json.loads(path.read_bytes())
                      except (ValueError, UnicodeError):
                          probe = {}
                      if (not isinstance(probe, dict) or probe.get('schema') != 'otgd-ohio-fixed-table-count/v1'
                              or probe.get('script_sha256') != os.environ['OTGD_RETIREMENT_SQL_HOOK_SHA256']
                              or probe.get('account') != '738470137867' or probe.get('region') != 'us-east-2'
                              or str(probe.get('run_id')) != os.environ.get('GITHUB_RUN_ID')
                              or str(probe.get('run_attempt')) != os.environ.get('GITHUB_RUN_ATTEMPT')):
                          status['complete_capture'] = False
                          status['files'].append({'name': name, 'sanitized_error_code': 'ProbeEvidenceBindingDiffers'})
                          continue
                  limit = min(1_048_576, max(0, 2_000_000 - total))
                  with path.open('rb') as stream:
                      raw = stream.read(limit)
                      tail = stream.read(1)
                  total += len(raw)
                  # Preserve partial JSONL after interruption; do not turn it into a successful receipt.
                  target = destination / name
                  descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(descriptor, 'wb') as stream:
                      stream.write(raw)
                      stream.flush()
                      os.fsync(stream.fileno())
                  status['files'].append({'name': name, 'source_bytes': path.stat().st_size,
                      'captured_bytes': len(raw), 'captured_sha256': hashlib.sha256(raw).hexdigest(),
                      'complete_file': not tail})
                  if tail:
                      status['complete_capture'] = False
          status['captured_bytes'] = total
          result = destination / 'capture-status.json'
          result.write_text(json.dumps(status, sort_keys=True) + '\n')
          result.chmod(0o600)
          EVIDENCEPY

      - name: Preserve private intent and receipt metadata
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d
        with:
          name: ohio-retirement-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ohio-retirement-upload/capture-status.json
            ${{ runner.temp }}/ohio-retirement-upload/asset-manifest.json
            ${{ runner.temp }}/ohio-retirement-upload/admission-before-credentials.json
            ${{ runner.temp }}/ohio-retirement-upload/admission-before-execution.json
            ${{ runner.temp }}/ohio-retirement-upload/journal.jsonl
            ${{ runner.temp }}/ohio-retirement-upload/operation-result.json
            ${{ runner.temp }}/ohio-retirement-upload/sql-table-count.json
          retention-days: 90
          if-no-files-found: error
