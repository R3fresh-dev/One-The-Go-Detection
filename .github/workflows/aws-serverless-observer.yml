name: Read exact post-retirement Ohio authority and fresh East1 Paid state only
'on':
  workflow_dispatch:
    inputs:
      reviewed_operation_commit:
        description: Exact root-reviewed read-only operation commit; dispatch only after independently verified
          core outcome
        required: true
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: otgd-ohio-progress-read-738470137867-us-east-2
  cancel-in-progress: false
jobs:
  postcore_read:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work-aws-regional-diagnostic' && github.event.repository.default_branch
      == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: R3fresh-dev/One-The-Go-Detection
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      AWS_MAX_ATTEMPTS: '1'
      AWS_PAGER: ''
      OHIO_POSTCORE_SCRIPT_SHA256: 82d6603cdf084fe886a5b3d51ed179840a90179f717489dc2a9efaddca338a85
    steps:
    - name: Bind private read-only paths and exact manual commit
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'PATHPY'\nimport json,os,re\nfrom pathlib import Path\nassert\
        \ os.environ['GITHUB_REPOSITORY']=='R3fresh-dev/One-The-Go-Detection'\nassert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'\
        \ and os.environ['GITHUB_RUN_ATTEMPT']=='1'\nassert os.environ['GITHUB_REF']=='refs/heads/work-aws-regional-diagnostic'\n\
        assert re.fullmatch(r'[0-9a-f]{40}',os.environ['GITHUB_SHA'])\nevent=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())\n\
        assert event.get('inputs',{}).get('reviewed_operation_commit')==os.environ['GITHUB_SHA']\ndirectory=Path(os.environ['RUNNER_TEMP']).resolve()/'ohio-postcore-read'\n\
        assert not directory.is_symlink()\ndirectory.mkdir(mode=0o700,exist_ok=False)\nwith open(os.environ['GITHUB_ENV'],'a')\
        \ as stream:\n stream.write('OHIO_POSTCORE_DIR='+str(directory)+'\\n')\nPATHPY\n"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 0844868aa543af4ab75ac5065ad48cf807b86bb3
        persist-credentials: false
    - name: Stage exact reviewed postcore_read.py
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'ASSETPY'\nimport base64,hashlib,os,zlib\nfrom pathlib import\
        \ Path\np=Path(os.environ['OHIO_POSTCORE_DIR'])/'postcore_read.py'\nb=zlib.decompress(base64.b64decode('',validate=True))\n\
        assert len(b)==20683 and hashlib.sha256(b).hexdigest()=='82d6603cdf084fe886a5b3d51ed179840a90179f717489dc2a9efaddca338a85'\n\
        fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\nwith os.fdopen(fd,'wb') as stream:\n\
        \ stream.write(b);stream.flush();os.fsync(stream.fileno())\nASSETPY\n"
    - name: Stage exact reviewed stabilization_admission.py
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'ASSETPY'\nimport base64,hashlib,os,zlib\nfrom pathlib import\
        \ Path\np=Path(os.environ['OHIO_POSTCORE_DIR'])/'stabilization_admission.py'\nb=zlib.decompress(base64.b64decode('',validate=True))\n\
        assert len(b)==6308 and hashlib.sha256(b).hexdigest()=='4fd6338af3972342e682ce9fb77439b33f7c6087b857d04aecd6f48efe75074c'\n\
        fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\nwith os.fdopen(fd,'wb') as stream:\n\
        \ stream.write(b);stream.flush();os.fsync(stream.fileno())\nASSETPY\n"
    - name: Stage exact reviewed sdk-install.py
      shell: bash
      run: "set -euo pipefail\numask 077\npython3 - <<'ASSETPY'\nimport base64,hashlib,os,zlib\nfrom pathlib import\
        \ Path\np=Path(os.environ['OHIO_POSTCORE_DIR'])/'sdk-install.py'\nb=zlib.decompress(base64.b64decode('',validate=True))\n\
        assert len(b)==1194 and hashlib.sha256(b).hexdigest()=='d4801e296b0b6d083018369538e7b99159c9b3e9552471a24268d128170afb3a'\n\
        fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\nwith os.fdopen(fd,'wb') as stream:\n\
        \ stream.write(b);stream.flush();os.fsync(stream.fileno())\nASSETPY\n"
    - name: Verify exact private reviewed asset inventory
      shell: bash
      run: "set -euo pipefail\npython3 - <<'MANIFESTPY'\nimport hashlib,json,os,stat\nfrom pathlib import Path\n\
        p=Path(os.environ[\"OHIO_POSTCORE_DIR\"])\nexpected={'postcore_read.py': '82d6603cdf084fe886a5b3d51ed179840a90179f717489dc2a9efaddca338a85',\
        \ 'stabilization_admission.py': '4fd6338af3972342e682ce9fb77439b33f7c6087b857d04aecd6f48efe75074c', 'sdk-install.py':\
        \ 'd4801e296b0b6d083018369538e7b99159c9b3e9552471a24268d128170afb3a'}\nrows=[]\nfor name,digest in expected.items():\n\
        \ q=p/name\n assert q.is_file() and not q.is_symlink() and stat.S_IMODE(q.stat().st_mode)==0o600\n assert\
        \ hashlib.sha256(q.read_bytes()).hexdigest()==digest\n rows.append({\"name\":name,\"bytes\":q.stat().st_size,\"\
        sha256\":digest})\nassert stat.S_IMODE(p.stat().st_mode)==0o700\nfd=os.open(p/\"asset-manifest.json\",os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)\n\
        with os.fdopen(fd,\"w\") as stream:\n json.dump({\"schema\":\"otgd-postcore-read-assets/v1\",\"files\":rows},stream,sort_keys=True);stream.write(\"\
        \\n\");stream.flush();os.fsync(stream.fileno())\nMANIFESTPY\n"
    - name: Admit exact current qualified main before credentials
      shell: bash
      run: 'set -euo pipefail

        python3 "$OHIO_POSTCORE_DIR/stabilization_admission.py" > "$OHIO_POSTCORE_DIR/admission-before-credentials.json"

        '
    - name: Install only existing seven hash-locked SDK wheels
      shell: bash
      run: 'set -euo pipefail

        python3 "$OHIO_POSTCORE_DIR/sdk-install.py"

        '
    - name: Configure exact account after source admission
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
      with:
        aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-2
        allowed-account-ids: '738470137867'
        unset-current-credentials: true
        force-skip-oidc: true
        output-credentials: false
        retry-max-attempts: 1
        action-timeout-s: 90
    - name: Read exact owned authority, archive and fresh Paid metadata only
      shell: bash
      run: 'set -euo pipefail

        python3 "$OHIO_POSTCORE_DIR/postcore_read.py"

        '
    - name: Preserve bounded read-only selected metadata
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: ohio-postcore-read-metadata-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/ohio-postcore-read/postcore-read.json

          ${{ runner.temp }}/ohio-postcore-read/journal.jsonl

          ${{ runner.temp }}/ohio-postcore-read/admission-before-credentials.json

          ${{ runner.temp }}/ohio-postcore-read/asset-manifest.json'
        retention-days: 90
        if-no-files-found: error
