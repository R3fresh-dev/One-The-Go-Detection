name: Native desired PAID account repair
on:
  workflow_dispatch:
    inputs:
      reviewed_operations_commit:
        description: Exact root-reviewed operational commit; one dispatch only
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: otgd-account-738470137867-plan-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work-aws-regional-diagnostic' && github.event.repository.default_branch == 'main' && github.sha == inputs.reviewed_operations_commit && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: R3fresh-dev/One-The-Go-Detection
      REVIEWED_OPERATIONAL_COMMIT: ${{ inputs.reviewed_operations_commit }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      AWS_MAX_ATTEMPTS: '1'
      AWS_PAGER: ''
      PYTHONPATH: ${{ runner.temp }}/regional-diagnostic-sdk
      INTENT_DIRECTORY: ${{ runner.temp }}/paid-plan-account-738470137867-${{ github.run_id }}-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.reviewed_operations_commit }}
          path: reviewed-operations
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0844868aa543af4ab75ac5065ad48cf807b86bb3
          path: qualified-source
          persist-credentials: false
      - name: Verify reviewed operation bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          expected = {
              'native_paid_plan_repair.py': 'aea8a623545b35f2d7c948038221ab9757f027a61f081981774f17cbbc70fd0f',
              'paid_plan_source_admission.py': '4fd6338af3972342e682ce9fb77439b33f7c6087b857d04aecd6f48efe75074c',
              'locked_diagnostic_sdk_installer.py': 'd4801e296b0b6d083018369538e7b99159c9b3e9552471a24268d128170afb3a',
          }
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['REVIEWED_OPERATIONAL_COMMIT']):
              raise SystemExit('Reviewed operation commit is invalid')
          for name, digest in expected.items():
              raw = (Path('reviewed-operations/.github/scripts') / name).read_bytes()
              if hashlib.sha256(raw).hexdigest() != digest:
                  raise SystemExit('Reviewed operational bytes differ')
          PY
      - name: Admit exact current qualified main before AWS credentials
        working-directory: qualified-source
        shell: bash
        run: python3 ../reviewed-operations/.github/scripts/paid_plan_source_admission.py
      - name: Reject any prior repair run or account intent before credentials
        working-directory: qualified-source
        shell: bash
        run: python3 ../reviewed-operations/.github/scripts/native_paid_plan_repair.py admit-operation
      - name: Install only hash-locked SDK wheels before AWS credentials
        working-directory: qualified-source
        shell: bash
        run: python3 ../reviewed-operations/.github/scripts/locked_diagnostic_sdk_installer.py
      - name: Configure reviewed account only after complete source admission
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          allowed-account-ids: '738470137867'
          unset-current-credentials: true
          force-skip-oidc: true
          output-credentials: false
          retry-max-attempts: 1
          action-timeout-s: 90
      - name: Prepare exact account intent
        id: prepare
        working-directory: qualified-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "${INTENT_DIRECTORY}"
          python3 ../reviewed-operations/.github/scripts/native_paid_plan_repair.py prepare \
            --directory "${INTENT_DIRECTORY}" \
            --source-admission ../reviewed-operations/.github/scripts/paid_plan_source_admission.py
      - name: Publish protected request intent before any native Upgrade
        if: steps.prepare.outputs.upgrade_needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paid-plan-request-intent-738470137867-${{ github.run_id }}-1
          path: ${{ env.INTENT_DIRECTORY }}/intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute one guarded native desired PAID request and fresh reads
        if: success() && steps.prepare.outputs.upgrade_needed == 'true'
        working-directory: qualified-source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../reviewed-operations/.github/scripts/native_paid_plan_repair.py execute \
            --directory "${INTENT_DIRECTORY}" \
            --source-admission ../reviewed-operations/.github/scripts/paid_plan_source_admission.py
      - name: Preserve credential-free intent and native verification outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paid-plan-verification-738470137867-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.INTENT_DIRECTORY }}/
          if-no-files-found: warn
          retention-days: 90
