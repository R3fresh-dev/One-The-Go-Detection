      - name: Stage reviewed compressed chunk 5 of 6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CHUNKPY'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          directory = root / 'ohio-retirement-compressed'
          if directory.is_symlink() or not directory.is_dir() or directory.resolve() != root / 'ohio-retirement-compressed':
              raise SystemExit('Private compressed staging directory differs')
          name = 'retirement_admission.py.zlib.b64.part-00'
          chunk = b''
          expected_sha256 = 'c1af941132179f93bb6a43b8d498414fe2040774bc77219c3057701ef8218d3d'
          if len(chunk) > 15000 or hashlib.sha256(chunk).hexdigest() != expected_sha256:
              raise SystemExit('Compressed asset chunk differs')
          fd = os.open(directory / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'wb') as stream:
