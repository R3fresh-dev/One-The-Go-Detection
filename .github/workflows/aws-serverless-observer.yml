name: Retire exact owned Ohio development infrastructure

on:
  workflow_dispatch:
    inputs:
      reviewed_operation_commit:
        description: Exact root-reviewed operations commit; single execution only
        required: true
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: otgd-ohio-retirement-738470137867-us-east-2
  cancel-in-progress: false

jobs:
  retire:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work-aws-ohio-retire' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: R3fresh-dev/One-The-Go-Detection
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      AWS_MAX_ATTEMPTS: '1'
      AWS_PAGER: ''
      OTGD_RETIREMENT_ADMISSION_SHA256: 6d5c16e6c9e8ba9e795c42fab6dc0782908d21f57288d5ba9e279e0976960a01
      OTGD_RETIREMENT_PLAN_SHA256: 564ef704204847dbafd3190b8263bb2fe7f828716dbbbc255c74ab0a2c5eeba9
      OTGD_RETIREMENT_SQL_HOOK_SHA256: '3fc878b5d24248c69c2eae51a9bdd606635ed78e9e75d312f6cb7d0641764680'
      OTGD_RESUME_WRAPPER_SHA256: '3e419a537dd4980e8db0b2d25390bb4d43312aabebf81e59c61c3caf1312db00'
    steps:
      - name: Bind private operation paths from the current runner
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}"
          [[ "$RUNNER_TEMP" == /* && "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]]
          printf 'OTGD_RETIREMENT_ASSETS_DIR=%s/ohio-retirement-assets\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'OTGD_RETIREMENT_EVIDENCE_DIR=%s/ohio-retirement-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0844868aa543af4ab75ac5065ad48cf807b86bb3
          persist-credentials: false

      - name: Prepare private compressed operation staging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PREPAREPY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          assets = Path(os.environ['OTGD_RETIREMENT_ASSETS_DIR'])
          evidence = Path(os.environ['OTGD_RETIREMENT_EVIDENCE_DIR'])
          chunks = root / 'ohio-retirement-compressed'
          if (assets.resolve() != root / 'ohio-retirement-assets' or assets.is_symlink()
                  or evidence.resolve() != root / 'ohio-retirement-evidence' or evidence.is_symlink()
                  or chunks.is_symlink() or chunks.resolve() != root / 'ohio-retirement-compressed'):
              raise SystemExit('Private operation directory differs')
          evidence.mkdir(mode=0o700, exist_ok=False)
          chunks.mkdir(mode=0o700, exist_ok=False)
          proof = evidence / 'asset-manifest.json'
          fd = os.open(proof, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'w') as stream:
              stream.write(json.dumps({'schema': 'otgd-ohio-retirement-assets/v1', 'root_review_materialized': False}) + '\n')
              stream.flush()
              os.fsync(stream.fileno())
          PREPAREPY

      - name: Stage reviewed compressed chunk 1 of 6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CHUNKPY'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          directory = root / 'ohio-retirement-compressed'
          if directory.is_symlink() or not directory.is_dir() or directory.resolve() != root / 'ohio-retirement-compressed':
              raise SystemExit('Private compressed staging directory differs')
          name = 'inventory.json.zlib.b64.part-00'
          chunk = b''
          expected_sha256 = 'adcf88b1ee8568db9e9fad04de0a3c87d771adedd4831b6709ec122819392766'
          if len(chunk) > 15000 or hashlib.sha256(chunk).hexdigest() != expected_sha256:
              raise SystemExit('Compressed asset chunk differs')
          fd = os.open(directory / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'wb') as stream:
              stream.write(chunk)
              stream.flush()
              os.fsync(stream.fileno())
          CHUNKPY

