      - name: Stage reviewed compressed chunk 6 of 6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CHUNKPY'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          directory = root / 'ohio-retirement-compressed'
          if directory.is_symlink() or not directory.is_dir() or directory.resolve() != root / 'ohio-retirement-compressed':
              raise SystemExit('Private compressed staging directory differs')
          name = 'reviewed-plan.json.zlib.b64.part-00'
          chunk = b''
          expected_sha256 = 'b4d630aa993abbce84664933c5acd051f18d365f5f5d4a9d05f80f5defe49125'
          if len(chunk) > 15000 or hashlib.sha256(chunk).hexdigest() != expected_sha256:
              raise SystemExit('Compressed asset chunk differs')
          fd = os.open(directory / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'wb') as stream:
              stream.write(chunk)
              stream.flush()
              os.fsync(stream.fileno())
          CHUNKPY

      - name: Stage only private root-reviewed operation assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'STAGEPY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import zlib
          embedded = {'inventory.json': {'bytes': 80692, 'sha256': 'd0cba7eb1600c0b5978af154d8461e032e85a69ed1f55355c2dee616508d18f7', 'compressed_bytes': 7936, 'compressed_sha256': '14184d345a6bc02d53fb774db1993dc8635bb93598cb47c55644ab48c00d894b', 'parts': [{'name': 'inventory.json.zlib.b64.part-00', 'bytes': 10584, 'sha256': 'adcf88b1ee8568db9e9fad04de0a3c87d771adedd4831b6709ec122819392766'}]}, 'ohio-table-count.py': {'bytes': 18376, 'sha256': '3fc878b5d24248c69c2eae51a9bdd606635ed78e9e75d312f6cb7d0641764680', 'compressed_bytes': 5379, 'compressed_sha256': '2ff9548eb341fe3b2429de80bdf089fda26d7306757240a378721ba0675e5d64', 'parts': [{'name': 'ohio-table-count.py.zlib.b64.part-00', 'bytes': 7172, 'sha256': '0d4b869c2e39123cf5bbc555f336ba68ae3ef32ce5e12e64e8deff4125123acc'}]}, 'retire_ohio.py': {'bytes': 80092, 'sha256': 'ecffe38c2bbd649979495fd1f6ff64432982ce39ebbe61a2cb9feeef3ae31d80', 'compressed_bytes': 19295, 'compressed_sha256': '742b5f94ebc2cdf617c9677abd2c17c2063177095cd5a8f28dfee436ddc70208', 'parts': [{'name': 'retire_ohio.py.zlib.b64.part-00', 'bytes': 15000, 'sha256': 'ba6e30d7dce82b2dbd93b6d3f51c8214458114bdb061701ccf36097c2bd8640c'}, {'name': 'retire_ohio.py.zlib.b64.part-01', 'bytes': 10728, 'sha256': '50633f335a6461e8e0a3ed8bcd2056d8ee78dc07f3d0d110c9e25f838e8cb15c'}]}, 'retirement_admission.py': {'bytes': 20460, 'sha256': '6d5c16e6c9e8ba9e795c42fab6dc0782908d21f57288d5ba9e279e0976960a01', 'compressed_bytes': 6223, 'compressed_sha256': '2765a21442ecc107c0b185419cf9fdbf4082d474774990189d803407d39e693e', 'parts': [{'name': 'retirement_admission.py.zlib.b64.part-00', 'bytes': 8300, 'sha256': 'c1af941132179f93bb6a43b8d498414fe2040774bc77219c3057701ef8218d3d'}]}, 'reviewed-plan.json': {'bytes': 1684, 'sha256': '564ef704204847dbafd3190b8263bb2fe7f828716dbbbc255c74ab0a2c5eeba9', 'compressed_bytes': 699, 'compressed_sha256': '15840608efc1add31c0ab479969827f753507c41b4de58825dca1fc64610b931', 'parts': [{'name': 'reviewed-plan.json.zlib.b64.part-00', 'bytes': 932, 'sha256': 'b4d630aa993abbce84664933c5acd051f18d365f5f5d4a9d05f80f5defe49125'}]}}
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          assets = Path(os.environ['OTGD_RETIREMENT_ASSETS_DIR'])
          evidence = Path(os.environ['OTGD_RETIREMENT_EVIDENCE_DIR'])
          chunks = root / 'ohio-retirement-compressed'
          if (assets.resolve() != root / 'ohio-retirement-assets' or assets.is_symlink()
                  or evidence.resolve() != root / 'ohio-retirement-evidence' or evidence.is_symlink()
                  or chunks.resolve() != root / 'ohio-retirement-compressed' or chunks.is_symlink()):
              raise SystemExit('Private operation directory differs')
          expected = {'retirement_admission.py', 'retire_ohio.py', 'reviewed-plan.json', 'inventory.json', 'ohio-table-count.py'}
          if (set(embedded) != expected or os.environ.get('OTGD_RETIREMENT_SQL_HOOK_SHA256')
                  != '3fc878b5d24248c69c2eae51a9bdd606635ed78e9e75d312f6cb7d0641764680'
                  or embedded['ohio-table-count.py']['sha256'] != os.environ['OTGD_RETIREMENT_SQL_HOOK_SHA256']):
              raise SystemExit('Root-reviewed operation assets differ')
          assets.mkdir(mode=0o700, exist_ok=False)
          manifest = []
          total = 0
          for name in sorted(expected):
              item = embedded[name]
              if not 0 < item['bytes'] <= 2_097_152 or not item['parts'] or len(item['parts']) > 2:
                  raise SystemExit('Asset decompression bound differs')
              encoded = bytearray()
              for part in item['parts']:
                  fd = os.open(chunks / part['name'], os.O_RDONLY | os.O_NOFOLLOW)
                  with os.fdopen(fd, 'rb') as stream:
                      metadata = os.fstat(stream.fileno())
                      if not stat.S_ISREG(metadata.st_mode) or metadata.st_size != part['bytes'] or not 0 < part['bytes'] <= 15000:
                          raise SystemExit('Compressed chunk size/type differs')
                      data = stream.read(15001)
                  if len(data) != part['bytes'] or hashlib.sha256(data).hexdigest() != part['sha256']:
                      raise SystemExit('Compressed chunk hash differs')
                  encoded.extend(data)
              compressed = base64.b64decode(encoded, validate=True)
              if len(compressed) != item['compressed_bytes'] or hashlib.sha256(compressed).hexdigest() != item['compressed_sha256']:
                  raise SystemExit('Compressed asset bytes differ')
              decoder = zlib.decompressobj()
              raw = decoder.decompress(compressed, item['bytes'] + 1)
              if (len(raw) != item['bytes'] or not decoder.eof or decoder.unused_data or decoder.unconsumed_tail
                      or hashlib.sha256(raw).hexdigest() != item['sha256']):
                  raise SystemExit('Exact reviewed asset decompression/hash differs')
              total += len(raw)
              if total > 2_097_152:
                  raise SystemExit('Total asset bound exceeded')
              fd = os.open(assets / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(raw)
                  stream.flush()
                  os.fsync(stream.fileno())
              manifest.append({'name': name, 'sha256': item['sha256'], 'bytes': len(raw)})
          proof = evidence / 'asset-manifest.json'
          if proof.is_symlink() or not proof.is_file():
              raise SystemExit('Staging proof is unavailable')
          fd = os.open(proof, os.O_WRONLY | os.O_TRUNC | os.O_NOFOLLOW)
          with os.fdopen(fd, 'w') as stream:
              stream.write(json.dumps({'schema': 'otgd-ohio-retirement-assets/v1', 'root_review_materialized': True,
                  'assets': manifest, 'total_bytes': total, 'all_exact_raw_asset_hashes_verified': True,
                  'no_user_payload_or_secret_values': True}, sort_keys=True) + '\n')
              stream.flush()
              os.fsync(stream.fileno())
          STAGEPY

      - name: Stage separately hash-bound exact post-delete resume wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RESUMESTAGEPY'
          import base64,hashlib,json,os,zlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']).resolve()
          assets=Path(os.environ['OTGD_RETIREMENT_ASSETS_DIR'])
          evidence=Path(os.environ['OTGD_RETIREMENT_EVIDENCE_DIR'])
          if (assets.resolve()!=root/'ohio-retirement-assets' or assets.is_symlink() or not assets.is_dir()
                  or evidence.resolve()!=root/'ohio-retirement-evidence' or evidence.is_symlink() or not evidence.is_dir()):
              raise SystemExit('Exact private resume asset directory differs')
          encoded=''
          expected='3e419a537dd4980e8db0b2d25390bb4d43312aabebf81e59c61c3caf1312db00'
          if os.environ.get('OTGD_RESUME_WRAPPER_SHA256')!=expected:
              raise SystemExit('Root-reviewed resume wrapper digest differs')
          compressed=base64.b64decode(encoded,validate=True)
          decoder=zlib.decompressobj()
          raw=decoder.decompress(compressed,18816+1)
          if len(raw)!=18816 or not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or hashlib.sha256(raw).hexdigest()!=expected:
              raise SystemExit('Exact bounded resume wrapper bytes differ')
          for name,sha in {'retire_ohio.py':'ecffe38c2bbd649979495fd1f6ff64432982ce39ebbe61a2cb9feeef3ae31d80',
                  'retirement_admission.py':'6d5c16e6c9e8ba9e795c42fab6dc0782908d21f57288d5ba9e279e0976960a01'}.items():
              path=assets/name
              if path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest()!=sha:
                  raise SystemExit('Frozen resume dependency differs')
          fd=os.open(assets/'resume_ohio.py',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'wb') as f:
              f.write(raw);f.flush();os.fsync(f.fileno())
          receipt={'schema':'otgd-ohio-post-delete-wrapper-staging/v1','wrapper_sha256':expected,'bytes':len(raw),
              'frozen_core_sha256':'ecffe38c2bbd649979495fd1f6ff64432982ce39ebbe61a2cb9feeef3ae31d80',
              'frozen_admission_sha256':'6d5c16e6c9e8ba9e795c42fab6dc0782908d21f57288d5ba9e279e0976960a01',
              'original_asset_manifest_unchanged':True,'native_requests':0}
          fd=os.open(evidence/'resume-wrapper-staging.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'w') as f:
              f.write(json.dumps(receipt,sort_keys=True)+chr(10));f.flush();os.fsync(f.fileno())
          RESUMESTAGEPY

      - name: Authenticate exact reviewed source and raw mandatory gates before credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 "$OTGD_RETIREMENT_ASSETS_DIR/retirement_admission.py" > "$OTGD_RETIREMENT_EVIDENCE_DIR/admission-before-credentials.json"

      - name: Bind protected original native deletion and archive receipts before credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 "$OTGD_RETIREMENT_ASSETS_DIR/resume_ohio.py" --mode verify-prior

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: false
      - name: Install only the exact application's locked AWS client environment
        run: uv sync --project services/api --locked

      - name: Configure existing repository AWS secrets after exact admission
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-2
          allowed-account-ids: '738470137867'
          unset-current-credentials: true
          force-skip-oidc: true
          output-credentials: false
          retry-max-attempts: 1
          action-timeout-s: 90

      - name: Repeat authenticated admission immediately before execution
        shell: bash
        run: |
          set -euo pipefail
          python3 "$OTGD_RETIREMENT_ASSETS_DIR/retirement_admission.py" > "$OTGD_RETIREMENT_EVIDENCE_DIR/admission-before-execution.json"

      - name: Resume only original post-delete preservation with admission before every mutation
        shell: bash
        run: |
          set -euo pipefail
          uv run --project services/api python "$OTGD_RETIREMENT_ASSETS_DIR/resume_ohio.py" \
            --mode execute > "$OTGD_RETIREMENT_EVIDENCE_DIR/operation-result.json"

      - name: Capture bounded metadata evidence even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EVIDENCEPY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          directory = Path(os.environ['OTGD_RETIREMENT_EVIDENCE_DIR'])
          destination = root / 'ohio-retirement-upload'
          destination.mkdir(mode=0o700, exist_ok=False)
          expected = ['journal.jsonl', 'operation-result.json', 'asset-manifest.json',
              'admission-before-credentials.json', 'admission-before-execution.json',
              'resume-wrapper-staging.json', 'resume-prior-admission.json']
          probe_directory = root / 'ohio-retirement'
          sources = {name: directory / name for name in expected}
          if os.environ.get('OTGD_RETIREMENT_SQL_HOOK_SHA256'):
              expected.append('sql-table-count.json')
              sources['sql-table-count.json'] = probe_directory / 'sql-table-count.json'
          status = {'schema': 'otgd-ohio-retirement-metadata-capture/v1', 'files': [],
              'only_hash_bound_operation_metadata': True, 'complete_capture': True}
          total = 0
          if directory.resolve() != root / 'ohio-retirement-evidence' or directory.is_symlink():
              status.update(complete_capture=False, sanitized_error_code='PrivateEvidenceDirectoryDiffers')
          elif not directory.is_dir():
              status.update(complete_capture=False, sanitized_error_code='PrivateEvidenceUnavailable')
          else:
              for name in expected:
                  path = sources[name]
                  if name == 'sql-table-count.json' and (probe_directory.is_symlink()
                          or probe_directory.resolve() != root / 'ohio-retirement'):
                      status['complete_capture'] = False
                      status['files'].append({'name': name, 'sanitized_error_code': 'ProbeEvidenceDirectoryDiffers'})
                      continue
                  if not path.exists():
                      status['files'].append({'name': name, 'presence': 'absent'})
                      continue
                  if path.is_symlink() or not path.is_file():
                      status['complete_capture'] = False
                      status['files'].append({'name': name, 'sanitized_error_code': 'NonRegularEvidenceRejected'})
                      continue
                  if name == 'sql-table-count.json':
                      if path.stat().st_size > 65536:
                          status['complete_capture'] = False
                          status['files'].append({'name': name, 'sanitized_error_code': 'ProbeEvidenceBoundExceeded'})
                          continue
                      try:
                          probe = json.loads(path.read_bytes())
                      except (ValueError, UnicodeError):
                          probe = {}
                      if (not isinstance(probe, dict) or probe.get('schema') != 'otgd-ohio-fixed-table-count/v1'
                              or probe.get('script_sha256') != os.environ['OTGD_RETIREMENT_SQL_HOOK_SHA256']
                              or probe.get('account') != '738470137867' or probe.get('region') != 'us-east-2'
                              or str(probe.get('run_id')) != os.environ.get('GITHUB_RUN_ID')
                              or str(probe.get('run_attempt')) != os.environ.get('GITHUB_RUN_ATTEMPT')):
                          status['complete_capture'] = False
                          status['files'].append({'name': name, 'sanitized_error_code': 'ProbeEvidenceBindingDiffers'})
                          continue
                  limit = min(1_048_576, max(0, 2_000_000 - total))
                  with path.open('rb') as stream:
                      raw = stream.read(limit)
                      tail = stream.read(1)
                  total += len(raw)
                  # Preserve partial JSONL after interruption; do not turn it into a successful receipt.
                  target = destination / name
                  descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(descriptor, 'wb') as stream:
                      stream.write(raw)
                      stream.flush()
                      os.fsync(stream.fileno())
                  status['files'].append({'name': name, 'source_bytes': path.stat().st_size,
                      'captured_bytes': len(raw), 'captured_sha256': hashlib.sha256(raw).hexdigest(),
                      'complete_file': not tail})
                  if tail:
                      status['complete_capture'] = False
          status['captured_bytes'] = total
          result = destination / 'capture-status.json'
          result.write_text(json.dumps(status, sort_keys=True) + '\n')
          result.chmod(0o600)
          EVIDENCEPY

      - name: Preserve private intent and receipt metadata
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ohio-retirement-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ohio-retirement-upload/capture-status.json
            ${{ runner.temp }}/ohio-retirement-upload/asset-manifest.json
            ${{ runner.temp }}/ohio-retirement-upload/admission-before-credentials.json
            ${{ runner.temp }}/ohio-retirement-upload/admission-before-execution.json
            ${{ runner.temp }}/ohio-retirement-upload/journal.jsonl
            ${{ runner.temp }}/ohio-retirement-upload/operation-result.json
            ${{ runner.temp }}/ohio-retirement-upload/sql-table-count.json
            ${{ runner.temp }}/ohio-retirement-upload/resume-wrapper-staging.json
            ${{ runner.temp }}/ohio-retirement-upload/resume-prior-admission.json
          retention-days: 90
          if-no-files-found: error
