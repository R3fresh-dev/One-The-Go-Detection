name: Materialize retained West recovery storage only
on:
  workflow_dispatch:
    inputs:
      confirm_storage_only:
        description: Create or verify only the reviewed cold West storage; never deploy or activate the application
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: otgd-fargate-development-738470137867
  cancel-in-progress: false
jobs:
  storage:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work-aws-cold-storage-only' && github.event.repository.default_branch == 'main' && inputs.confirm_storage_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      AWS_MAX_ATTEMPTS: '1'
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0844868aa543af4ab75ac5065ad48cf807b86bb3
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.0'
          python-version: '3.12'
      - run: uv sync --project services/api --locked
      - name: Admit exact current qualified main before AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'COLD_STORAGE_DIR=%s/cold-storage-only\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/cold-storage-admission.py" <<'PYADMIT'
          import hashlib, io, json, os, re, subprocess, zipfile
          SOURCE = '0844868aa543af4ab75ac5065ad48cf807b86bb3'
          TREE = '1afe65b4d2a6ba3a4c541c9ecf7bc61f287ee908'
          RUN = 38350430258
          ARTIFACT = 11790454913
          RAW_SHA256 = '9338903893d1bb1d82097cca4ea7a59cd81579d1f85cb853310c981592a2d165'
          REPOSITORY = 'R3fresh-dev/One-The-Go-Detection'
          WORKFLOW = '.github/workflows/merge-gate.yml'
          JOBS = {'unit-coverage', 'components', 'atdd', 'preview / ios', 'platform / postgres-integration',
              'native / android', 'native / protected-reader', 'native / ios', 'platform / localstack-integration',
              'native / shared-and-firmware', 'platform / contracts-and-synthesis', 'platform / fargate-container-runtime',
              'preview / android', 'merge-gate'}
          LABELS = {'unit-coverage', 'atdd', 'components', 'performance', 'live-dependencies', 'docker-health',
              'localstack-api', 'specifications', 'native-android', 'native-ios', 'firmware', 'hosted-android', 'hosted-ios'}
          
          def require(condition, reason):
              if not condition:
                  raise SystemExit('Regional read-only admission blocked: ' + reason)
          
          def command(args, binary=False):
              result = subprocess.run(args, capture_output=True, text=not binary, timeout=30)
              require(result.returncode == 0 and len(result.stdout if binary else result.stdout.encode()) <= 1048576,
                  'bounded authenticated command unavailable')
              return result.stdout
          
          def api(path):
              return json.loads(command(['gh', 'api', (f'repos/{REPOSITORY}/' + path).rstrip('/')]))
          
          def latest():
              response = api('actions/workflows/merge-gate.yml/runs?head_sha=' + SOURCE + '&per_page=100')
              require(response.get('total_count', 101) <= 100, 'gate inventory exceeds bound')
              candidates = [r for r in response['workflow_runs'] if r.get('head_sha') == SOURCE
                  and r.get('path') == WORKFLOW and r.get('head_branch') == 'main' and r.get('event') == 'push']
              require(candidates and max(r['id'] for r in candidates) == RUN, 'latest trusted main gate differs')
          
          require(ARTIFACT > 0 and re.fullmatch(r'[0-9a-f]{64}', RAW_SHA256), 'root gate/artifact bindings pending')
          require(os.environ['GITHUB_REPOSITORY'] == REPOSITORY and os.environ['GH_REPO'] == REPOSITORY and os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
              and os.environ['GITHUB_REF'] == 'refs/heads/work-aws-cold-storage-only', 'repository/trigger differs')
          require(command(['git', 'rev-parse', 'HEAD']).strip() == SOURCE
              and command(['git', 'rev-parse', 'HEAD^{tree}']).strip() == TREE
              and not command(['git', 'status', '--porcelain']).strip(), 'immutable source/tree differs')
          require(api('')['default_branch'] == 'main' and api('git/ref/heads/main')['object']['sha'] == SOURCE,
              'current default main differs')
          run = api(f'actions/runs/{RUN}')
          require(run.get('id') == RUN and run.get('head_sha') == SOURCE and run.get('path') == WORKFLOW
              and run.get('head_branch') == 'main' and run.get('event') == 'push'
              and run.get('status') == 'completed' and run.get('conclusion') == 'success'
              and run.get('run_attempt') == 1
              and run.get('repository', {}).get('full_name') == REPOSITORY
              and run.get('head_repository', {}).get('full_name') == REPOSITORY, 'trusted main gate differs')
          workflow = api(f"actions/workflows/{run['workflow_id']}")
          require(workflow.get('path') == WORKFLOW and workflow.get('state') == 'active', 'gate workflow differs')
          latest()
          response = api(f"actions/runs/{RUN}/attempts/{run['run_attempt']}/jobs?per_page=100")
          jobs = response.get('jobs', [])
          require(response.get('total_count') == 14 and len(jobs) == 14 and {j['name'] for j in jobs} == JOBS
              and len({j['id'] for j in jobs}) == 14
              and all(j.get('head_sha') == SOURCE and j.get('run_id') == RUN and j.get('run_attempt') == run['run_attempt']
                  and j.get('status') == 'completed' and j.get('conclusion') == 'success' for j in jobs), 'all14 jobs differ')
          response = api(f'actions/runs/{RUN}/artifacts?per_page=100')
          rows = [a for a in response.get('artifacts', []) if a.get('name') == 'exact-revision-merge-evidence']
          require(response.get('total_count', 101) <= 100 and len(rows) == 1, 'aggregate artifact is ambiguous')
          artifact = rows[0]
          job = next(j for j in jobs if j['name'] == 'merge-gate')
          require(artifact.get('id') == ARTIFACT and artifact.get('expired') is False
              and artifact.get('digest') == 'sha256:' + RAW_SHA256 and artifact.get('size_in_bytes') == 393
              and artifact.get('workflow_run', {}).get('id') == RUN and artifact.get('workflow_run', {}).get('head_sha') == SOURCE
              and job['started_at'] <= artifact.get('created_at', '') <= job['completed_at'], 'raw artifact binding differs')
          raw = command(['gh', 'api', f'repos/{REPOSITORY}/actions/artifacts/{ARTIFACT}/zip'], binary=True)
          require(len(raw) == artifact['size_in_bytes'] and hashlib.sha256(raw).hexdigest() == RAW_SHA256,
              'raw aggregate ZIP digest differs')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              members = [m for m in archive.infolist() if not m.is_dir()]
              require(len(members) == 1 and members[0].filename == 'gates.json' and members[0].file_size <= 262144
                  and (members[0].external_attr >> 16) & 0o170000 != 0o120000, 'aggregate member differs')
              evidence = json.loads(archive.read(members[0]))
          require(evidence.get('revision') == SOURCE and evidence.get('run_url') == f'https://github.com/{REPOSITORY}/actions/runs/{RUN}'
              and isinstance(evidence.get('passed'), list) and len(evidence['passed']) == 13 and set(evidence['passed']) == LABELS,
              'aggregate exact revision/jobs differ')
          after = api(f'actions/artifacts/{ARTIFACT}')
          require(all(after.get(k) == artifact.get(k) for k in ['id','name','expired','digest','size_in_bytes','created_at','workflow_run']),
              'aggregate changed after download')
          current = api(f'actions/runs/{RUN}')
          require(all(current.get(k) == run.get(k) for k in ['id','head_sha','run_attempt','status','conclusion','workflow_id']),
              'gate changed after download')
          latest()
          require(api('git/ref/heads/main')['object']['sha'] == SOURCE and not command(['git','status','--porcelain']).strip(),
              'current main/source changed')
          print(json.dumps({'admitted_revision': SOURCE, 'admitted_tree': TREE, 'gate_run_id': RUN,
              'gate_attempt': run['run_attempt'], 'successful_jobs': 14, 'raw_aggregate_sha256': RAW_SHA256,
              'admission_scope': 'QUALIFIED_WEST_STORAGE_ONLY_NO_APPLICATION_ACTIVATION'}))
          PYADMIT
          chmod 600 "$RUNNER_TEMP/cold-storage-admission.py"
          python3 "$RUNNER_TEMP/cold-storage-admission.py"
      - name: Admit unchanged regional scope and current reviewed 100 dollar budget
        shell: bash
        run: |
          set -euo pipefail
          uv run --project services/api --no-sync python - <<'PYBUDGET'
          from pathlib import Path
          from deploy.fargate import read_config, budget
          c = read_config(Path('infra/config/fargate.example.json'))
          assert c['environment'] == 'fargate-development' and c['account'] == '738470137867'
          assert c['region'] == 'us-east-1' and c['backupRegion'] == 'us-west-2'
          assert c['monthlyBudgetUsd'] == 100 and c['plannedMonthlyUsers'] == 10
          c['releaseId'] = '0844868aa543af4ab75ac5065ad48cf807b86bb3'
          budget(c)
          PYBUDGET
      - name: Configure only reviewed West account after source and budget admission
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-west-2
          allowed-account-ids: '738470137867'
          unset-current-credentials: true
          force-skip-oidc: true
          output-credentials: false
          retry-max-attempts: 1
          action-timeout-s: 90
      - name: Execute only the exact retained cold storage graph
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cold-storage-runner.py" <<'PYRUNNER'
          """Held operations wrapper: exact qualified West storage only; no application deployment."""
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time
          
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT))
          SOURCE = '0844868aa543af4ab75ac5065ad48cf807b86bb3'
          TREE = '1afe65b4d2a6ba3a4c541c9ecf7bc61f287ee908'
          ACCOUNT = '738470137867'
          WEST = 'us-west-2'
          STACK = 'otgd-fargate-development-us-west-2-recovery'
          TEMPLATE_SHA256 = '3a91906c2ddbb5ee602263275097a73fb644f4ef4a939b640a5a3b26f4fd7d81'
          STACK_TAGS = [{'Key': 'deployment', 'Value': 'otgd-serverless-development'},
                        {'Key': 'purpose', 'Value': 'serverless-development'}]
          READS = {'sts': {'get_caller_identity'}, 'cloudformation': {'describe_stacks', 'get_template',
              'list_stack_resources', 'describe_change_set'}, 'kms': {'describe_key'},
              'backup': {'describe_backup_vault'}, 's3': {'get_bucket_location', 'get_bucket_versioning',
              'get_public_access_block', 'get_bucket_encryption', 'get_object_lock_configuration'}}
          WRITES = {'create_change_set', 'update_termination_protection', 'execute_change_set'}
          
          
          def require(value, reason):
              if not value:
                  raise RuntimeError(reason)
          
          
          def digest(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          
          
          class Journal:
              def __init__(self, path):
                  self.fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, 'O_NOFOLLOW', 0), 0o600)
                  directory = os.open(Path(path).parent, os.O_RDONLY | getattr(os, 'O_DIRECTORY', 0))
                  try:
                      os.fsync(directory)
                  finally:
                      os.close(directory)
                  self.previous, self.sequence = '0' * 64, 0
          
              def append(self, event, **fields):
                  row = {'event': event, 'sequence': self.sequence, 'previous_sha256': self.previous,
                         'source_revision': SOURCE, 'template_sha256': TEMPLATE_SHA256,
                         'at': datetime.now(timezone.utc).isoformat(), **fields}
                  raw = (json.dumps(row, sort_keys=True, separators=(',', ':')) + '\n').encode()
                  require(len(raw) <= 1048576, 'Operation journal record exceeds bound')
                  offset = 0
                  while offset < len(raw):
                      count = os.write(self.fd, raw[offset:])
                      require(count > 0, 'Operation journal write incomplete')
                      offset += count
                  os.fsync(self.fd)
                  self.previous, self.sequence = hashlib.sha256(raw).hexdigest(), self.sequence + 1
          
          
          class StorageSession:
              """Close the callable library boundary to metadata and one CREATE storage graph."""
              def __init__(self, aws, c, template, journal, admission):
                  require(digest(template) == TEMPLATE_SHA256, 'Qualified storage template differs')
                  self.aws, self.c, self.template, self.journal, self.admission = aws, c, template, journal, admission
                  self.change_id = self.stack_id = None
                  self.started = time.monotonic()
                  self.write_count = 0
          
              def client(self, service, **options):
                  require(service in READS and options.pop('region_name', WEST) == WEST,
                          'Storage operation is limited to reviewed West metadata services')
                  require(not options, 'Unreviewed client option')
                  from botocore.config import Config
                  actual = self.aws.client(service, region_name=WEST, config=Config(
                      ignore_configured_endpoint_urls=True, connect_timeout=5, read_timeout=15,
                      retries={'total_max_attempts': 1, 'mode': 'standard'}))
                  return StorageClient(self, service, actual)
          
              def prewrite(self):
                  require(time.monotonic() - self.started < 900 and self.write_count < 3,
                          'Storage mutation deadline/count exceeded')
                  proof, price = self.admission()
                  account = self.client('sts').get_caller_identity()
                  require(account.get('Account') == ACCOUNT, 'Storage caller account differs')
                  self.journal.append('fresh-source-gate-budget-account-admission', gate_proof_sha256=digest(proof),
                                      budget_sha256=digest(price), account=ACCOUNT)
          
              def admit_change_set(self):
                  cf = self.client('cloudformation')
                  result = cf.describe_change_set(StackName=STACK, ChangeSetName=self.change_id)
                  require(result.get('ChangeSetId') == self.change_id and result.get('StackName') == STACK
                          and self.change_id is not None and result.get('Status') == 'CREATE_COMPLETE'
                          and result.get('ExecutionStatus') == 'AVAILABLE' and not result.get('NextToken'),
                          'Storage change set is not one complete owned CREATE')
                  stack_id = result.get('StackId', '')
                  require(re.fullmatch(r'arn:aws:cloudformation:us-west-2:' + ACCOUNT + ':stack/' + STACK + r'/[0-9a-f-]{36}', stack_id),
                          'Storage change set stack UUID differs')
                  require(self.stack_id in (None, stack_id), 'Storage stack UUID changed')
                  changes = result.get('Changes', [])
                  expected = {name: row['Type'] for name, row in self.template['Resources'].items()}
                  rows = [entry.get('ResourceChange', {}) for entry in changes]
                  require(len(rows) == len(expected) and {row.get('LogicalResourceId'): row.get('ResourceType') for row in rows} == expected
                          and all(row.get('Action') == 'Add' and row.get('Replacement') in (None, 'False') for row in rows),
                          'Storage change set must contain only exact thirteen Add actions')
                  self.stack_id = stack_id
                  stacks = cf.describe_stacks(StackName=STACK).get('Stacks', [])
                  require(len(stacks) == 1 and stacks[0].get('StackId') == stack_id
                          and stacks[0].get('StackStatus') == 'REVIEW_IN_PROGRESS',
                          'Recorded CREATE must bind the exact new review stack')
                  self.journal.append('verified-exact-storage-change-set', stack_id=stack_id, change_set_id=self.change_id,
                                      changes_sha256=digest(changes))
                  return result
          
          
          class StorageClient:
              def __init__(self, owner, service, client):
                  self.owner, self.service, self.actual = owner, service, client
          
              def get_waiter(self, name):
                  require(self.service == 'cloudformation' and name in {'change_set_create_complete', 'stack_create_complete'},
                          'Unreviewed storage waiter')
                  actual = self.actual.get_waiter(name)
                  class BoundedWaiter:
                      def wait(inner, **options):
                          require(options.get('StackName') == STACK, 'Foreign storage waiter target')
                          if name == 'change_set_create_complete':
                              require(options.get('ChangeSetName') == self.owner.change_id, 'Foreign storage change-set waiter')
                          cfg = options.get('WaiterConfig', {})
                          options['WaiterConfig'] = {'Delay': cfg.get('Delay', 15),
                              'MaxAttempts': min(cfg.get('MaxAttempts', 60), 60)}
                          return actual.wait(**options)
                  return BoundedWaiter()
          
              def get_paginator(self, name):
                  require(self.service == 'cloudformation' and name == 'describe_change_set', 'Unreviewed storage pagination')
                  return self.actual.get_paginator(name)
          
              def __getattr__(self, method):
                  require(method in READS[self.service] or self.service == 'cloudformation' and method in WRITES,
                          'Operation outside storage-only allowlist')
                  def call(**kwargs):
                      if method in READS[self.service]:
                          if self.service == 'cloudformation':
                              target = kwargs.get('StackName')
                              require(target == STACK or self.owner.stack_id is not None and target == self.owner.stack_id, 'Foreign CloudFormation metadata target')
                          if self.service == 's3':
                              require(kwargs.get('ExpectedBucketOwner') == ACCOUNT and kwargs.get('Bucket') in {
                                  f'otgd-fargate-recovery-{ACCOUNT}-{WEST}-{suffix}'
                                  for suffix in ('artifacts', 'exports', 'journal', 'web', 'deployments')}, 'Foreign bucket metadata target')
                          try:
                              result = getattr(self.actual, method)(**kwargs)
                          except Exception as error:
                              if self.service == 'cloudformation' and method == 'describe_stacks':
                                  details = getattr(error, 'response', {}).get('Error', {})
                                  require(details.get('Code') == 'ValidationError' and details.get('Message') ==
                                          f'Stack with id {target} does not exist', 'Stack absence is unverified')
                              raise
                          if self.service == 'cloudformation' and method == 'describe_stacks':
                              rows = result.get('Stacks', [])
                              require(len(rows) == 1 and re.fullmatch(r'arn:aws:cloudformation:us-west-2:' + ACCOUNT +
                                      ':stack/' + STACK + r'/[0-9a-f-]{36}', rows[0].get('StackId', '')),
                                      'Storage stack metadata identity differs')
                              require(self.owner.stack_id in (None, rows[0]['StackId']), 'Storage stack UUID changed')
                              self.owner.stack_id = rows[0]['StackId']
                          return result
                      self.owner.prewrite()
                      require(kwargs.get('StackName') == STACK, 'Foreign storage mutation target')
                      if method == 'create_change_set':
                          require(self.owner.change_id is None and set(kwargs) == {'StackName', 'ChangeSetName', 'ChangeSetType',
                              'Capabilities', 'Tags', 'TemplateBody'} and kwargs.get('ChangeSetType') == 'CREATE'
                              and re.fullmatch(r'serverless-[0-9a-f]{32}', kwargs.get('ChangeSetName', ''))
                              and kwargs.get('Capabilities') == ['CAPABILITY_NAMED_IAM'] and kwargs.get('Tags') == STACK_TAGS
                              and digest(json.loads(kwargs['TemplateBody'])) == TEMPLATE_SHA256,
                              'Only exact new retained storage template creation is admitted')
                          try:
                              self.actual.describe_stacks(StackName=STACK)
                          except Exception as error:
                              details = getattr(error, 'response', {}).get('Error', {})
                              require(details.get('Code') == 'ValidationError' and details.get('Message') ==
                                      f'Stack with id {STACK} does not exist', 'Exact new-stack absence is unverified')
                          else:
                              raise RuntimeError('Existing storage stack cannot be changed')
                      elif method == 'update_termination_protection':
                          require(set(kwargs) == {'StackName', 'EnableTerminationProtection'} and kwargs['EnableTerminationProtection'] is True,
                                  'Only enabling storage termination protection is admitted')
                          self.owner.admit_change_set()
                      else:
                          require(set(kwargs) == {'StackName', 'ChangeSetName'} and kwargs['ChangeSetName'] == self.owner.change_id,
                                  'Only the recorded storage change set can execute')
                          self.owner.admit_change_set()
                          rows = self.actual.describe_stacks(StackName=STACK).get('Stacks', [])
                          require(len(rows) == 1 and rows[0].get('StackId') == self.owner.stack_id
                                  and rows[0].get('StackStatus') == 'REVIEW_IN_PROGRESS'
                                  and rows[0].get('EnableTerminationProtection') is True,
                                  'New protected storage review stack differs before execution')
                      self.owner.journal.append('mutation-intent', service=self.service, operation=method,
                                                arguments_sha256=digest(kwargs), change_set_id=self.owner.change_id)
                      self.owner.write_count += 1
                      try:
                          result = getattr(self.actual, method)(**kwargs)
                      except Exception as error:
                          code = getattr(error, 'response', {}).get('Error', {}).get('Code', type(error).__name__)
                          self.owner.journal.append('unresolved-mutation', operation=method, sanitized_error_code=str(code))
                          raise RuntimeError('Storage mutation unresolved; fresh review required') from None
                      request = result.get('ResponseMetadata', {}).get('RequestId')
                      require(isinstance(request, str) and request, 'Storage mutation response lacks request ID')
                      if method == 'create_change_set':
                          identifier = result.get('Id', '')
                          require(re.fullmatch(r'arn:aws:cloudformation:us-west-2:' + ACCOUNT + r':changeSet/serverless-[0-9a-f]{32}/[0-9a-f-]{36}', identifier),
                                  'Storage change set response identity differs')
                          stack_id = result.get('StackId', '')
                          require(re.fullmatch(r'arn:aws:cloudformation:us-west-2:' + ACCOUNT + ':stack/' + STACK +
                                  r'/[0-9a-f-]{36}', stack_id) and self.owner.stack_id in (None, stack_id),
                                  'Created storage stack UUID differs')
                          self.owner.change_id, self.owner.stack_id = identifier, stack_id
                      self.owner.journal.append('mutation-receipt', operation=method, request_id=request, change_set_id=self.owner.change_id)
                      return result
                  return call
          
          
          def main():
              from deploy.fargate import read_config, budget, deploy_recovery_storage
              from deploy.fargate_backup import build_destination_template, verify_destination
              from deploy import platform
              root = Path(os.environ['RUNNER_TEMP'])
              directory = root / 'cold-storage-only'
              directory.mkdir(mode=0o700, exist_ok=False)
              journal = Journal(directory / 'operations.jsonl')
              config = read_config(ROOT / 'infra/config/fargate.example.json')
              require(config['account'] == ACCOUNT and config['region'] == 'us-east-1' and config.get('backupRegion') == WEST
                      and config['monthlyBudgetUsd'] == 100 and config['plannedMonthlyUsers'] == 10, 'Reviewed storage scope/budget differs')
              config['releaseId'] = SOURCE
              def admission():
                  platform.require_clean_source(SOURCE)
                  require(subprocess.run(['git', 'rev-parse', 'HEAD^{tree}'], capture_output=True, text=True, check=True).stdout.strip() == TREE,
                          'Qualified storage source tree differs')
                  result = subprocess.run([sys.executable, str(root / 'cold-storage-admission.py')],
                                          capture_output=True, text=True, timeout=120, check=True)
                  require(len(result.stdout.encode()) < 16384, 'Storage gate admission response exceeds bound')
                  return json.loads(result.stdout), budget(config)
              template = build_destination_template(config)
              require(digest(template) == TEMPLATE_SHA256, 'Reviewed storage template differs')
              session = StorageSession(platform.CloudSession('us-east-1', None), config, template, journal, admission)
              # This preflight is only source/budget/caller admission for storage. It never
              # substitutes for fargate.preflight or authorizes app/SQL/replication writes.
              session.prewrite()
              journal.append('qualified-storage-operation-started', account=ACCOUNT, region=WEST,
                             runner_sha256=hashlib.sha256(Path(__file__).read_bytes()).hexdigest(), paid_plan_inferred=False)
              try:
                  outputs = deploy_recovery_storage(session, config)
                  verified = verify_destination(session, config, outputs)
                  cf = session.client('cloudformation')
                  stacks = cf.describe_stacks(StackName=STACK)['Stacks']
                  stack_id = stacks[0]['StackId']
                  inventory = cf.list_stack_resources(StackName=stack_id)['StackResourceSummaries']
                  receipt = {'schema_version': '1.0.0', 'operation': 'qualified-cold-storage-only',
                      'status': 'cold_storage_configuration_verified', 'source_revision': SOURCE, 'source_tree': TREE,
                      'account': ACCOUNT, 'region': WEST, 'stack_id': stack_id, 'template_sha256': TEMPLATE_SHA256,
                      'physical_resources': {row['LogicalResourceId']: row['PhysicalResourceId'] for row in inventory},
                      'outputs': outputs, 'verification': verified, 'aws_mutation_count': session.write_count,
                      'approved_planning_budget_usd': 100, 'account_plan_admission': 'not_performed_for_storage_only',
                      'paid_plan_inferred': False, 'app_activation_authorized': False, 'app_deployment_executed': False,
                      'source_replication_established': False, 'backup_copy_verified': False, 'restore_executed': False,
                      'finished_at': datetime.now(timezone.utc).isoformat()}
                  platform.write_receipt(directory / 'storage.json', receipt)
                  journal.append('verified-storage-only-complete', receipt_sha256=digest(receipt), stack_id=stack_id)
                  print(json.dumps({'status': receipt['status'], 'app_deployment_executed': False}))
              except Exception as error:
                  journal.append('blocked-preserve-evidence', sanitized_error_type=type(error).__name__)
                  raise
          
          
          if __name__ == '__main__':
              main()
          PYRUNNER
          chmod 600 "$RUNNER_TEMP/cold-storage-runner.py"
          uv run --project services/api --no-sync python "$RUNNER_TEMP/cold-storage-runner.py"
      - name: Preserve private credential-free storage operation proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-cold-storage-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.COLD_STORAGE_DIR }}/operations.jsonl
            ${{ env.COLD_STORAGE_DIR }}/storage.json
          if-no-files-found: warn
          retention-days: 7
