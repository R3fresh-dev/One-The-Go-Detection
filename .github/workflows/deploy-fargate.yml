name: Deploy OnGo containers to AWS

on:
  workflow_dispatch:
    inputs:
      establish_new:
        description: Establish the first empty OnGo development journal; never enable for an existing journal
        required: true
        type: boolean
        default: false
      recovery_run_id:
        description: Failed legacy deployment run containing the protected initial recovery journal; leave empty after adoption
        required: false
        type: string
        default: ''
      continue_uninitialized_run_id:
        description: Failed stopped legacy run proving no first initialization; requires establish_new and an empty recovery_run_id
        required: false
        type: string
        default: ''
      previous_continuation_run_id:
        description: Failed Fargate continuation proving a prior import or subnet repair; requires the same legacy continuation source
        required: false
        type: string
        default: ''

# AWS access uses the two existing repository secrets. No OIDC token is issued.
permissions:
  contents: read
  actions: read

# Serialize all attempts for this actual account/region, including manual retries.
concurrency:
  group: otgd-fargate-development-738470137867-us-east-2
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --project services/api --locked

      - name: Admit only reviewed main sources with current successful mandatory gates
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          uv run --project services/api python - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from deploy import platform
          from deploy.provenance import Gate, REPOSITORY, WORKFLOW_PATH, FARGATE_REQUIRED_JOBS, trusted_branch

          def github_json(path):
              result = subprocess.run(['gh', 'api', path], capture_output=True, text=True, timeout=30)
              if result.returncode != 0 or len(result.stdout.encode()) > 2_097_152:
                  raise Gate('Authorized GitHub gate metadata is unavailable')
              try:
                  value = json.loads(result.stdout)
              except (TypeError, ValueError):
                  raise Gate('GitHub gate metadata is malformed') from None
              if not isinstance(value, dict):
                  raise Gate('GitHub gate metadata is malformed')
              return value

          def select_latest_gate(revision):
              runs = []
              for page in range(1, 11):
                  response = github_json(
                      f'repos/{REPOSITORY}/actions/workflows/merge-gate.yml/runs'
                      f'?head_sha={revision}&per_page=100&page={page}')
                  batch = response.get('workflow_runs')
                  if not isinstance(batch, list) or len(batch) > 100:
                      raise Gate('GitHub workflow inventory is malformed')
                  for run in batch:
                      if not isinstance(run, dict):
                          raise Gate('GitHub workflow inventory is malformed')
                      if (run.get('head_sha') == revision and run.get('path') == WORKFLOW_PATH
                              and trusted_branch(run.get('event'), run.get('head_branch'))):
                          if type(run.get('id')) is not int or run['id'] <= 0:
                              raise Gate('GitHub workflow identity is malformed')
                          runs.append(run)
                  if len(batch) < 100:
                      break
              else:
                  raise Gate('GitHub workflow inventory exceeds its supported bounds')
              if not runs:
                  raise Gate('No trusted exact-source Required application gates run exists')
              latest = max(runs, key=lambda run: run['id'])
              if latest.get('status') != 'completed' or latest.get('conclusion') != 'success':
                  raise Gate('The latest trusted exact-source gate run must finish successfully')
              return latest['id']

          def admit():
              revision = os.environ['GITHUB_SHA']
              if (os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch'
                      or os.environ.get('GITHUB_REF') != 'refs/heads/main'
                      or os.environ.get('GH_REPO') != REPOSITORY
                      or not re.fullmatch(r'[0-9a-f]{40}', revision)):
                  raise Gate('Fargate deployment requires reviewed main sources')
              repository = github_json(f'repos/{REPOSITORY}')
              current_main = github_json(f'repos/{REPOSITORY}/git/ref/heads/main')
              if (repository.get('default_branch') != 'main'
                      or current_main.get('object', {}).get('sha') != revision):
                  raise Gate('Dispatch again from the current default main revision')
              platform.require_clean_source(revision)
              run_id = select_latest_gate(revision)
              directory = Path('.local/fargateconfig')
              evidence_directory = directory / 'gates'
              evidence_directory.mkdir(parents=True, exist_ok=True)
              downloaded = subprocess.run(
                  ['gh', 'run', 'download', str(run_id), '--repo', REPOSITORY,
                   '--name', 'exact-revision-merge-evidence', '--dir', str(evidence_directory)],
                  capture_output=True, text=True, timeout=60)
              if downloaded.returncode != 0:
                  raise Gate('Exact-source aggregate gate artifact is unavailable')
              evidence = evidence_directory / 'gates.json'
              proof = platform.verify_gate_file(evidence, revision, required_jobs=FARGATE_REQUIRED_JOBS)
              if proof['run_id'] != run_id:
                  raise Gate('Downloaded gate evidence belongs to a different workflow run')
              (directory / 'gate-admission.json').write_text(json.dumps(proof, indent=2) + '\n')

          if __name__ == '__main__':
              try:
                  admit()
              except Exception as error:
                  message = str(error) if isinstance(error, Gate) else type(error).__name__
                  raise SystemExit('Deployment admission blocked: ' + message)
          PYCODE

      - name: Bind reviewed configuration to this exact source and verify the budget
        id: configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          config = json.loads(Path('infra/config/fargate.example.json').read_text())
          if (config['environment'] != 'fargate-development' or config['account'] != '738470137867'
                  or config['region'] != 'us-east-2' or config['monthlyBudgetUsd'] != 100):
              raise SystemExit('Fargate target differs from the reviewed account, region or budget')
          config['releaseId'] = os.environ['GITHUB_SHA']
          Path('.local/fargateconfig/fargate.json').write_text(json.dumps(config, indent=2) + '\n')
          PYCODE
          uv run --project services/api python deploy/fargate.py plan \
            --config .local/fargateconfig/fargate.json > reports/fargate-plan.json

      - name: Validate and download the protected legacy recovery artifact
        id: recovery
        shell: bash
        env:
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          CONTINUE_UNINITIALIZED_RUN_ID: ${{ inputs.continue_uninitialized_run_id }}
          ESTABLISH_NEW: ${{ inputs.establish_new }}
        run: |
          set -euo pipefail
          uv run --project services/api python - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import zipfile
          from deploy.provenance import Gate, REPOSITORY, bounded_json, positive_int

          LEGACY_WORKFLOW = '.github/workflows/deploy-serverless.yml'
          MAX_ARCHIVE = 16 * 1024 * 1024
          MAX_MANIFEST = 262_144

          def github_json(path):
              result = subprocess.run(['gh', 'api', path], capture_output=True, text=True, timeout=30)
              if result.returncode != 0 or len(result.stdout.encode()) > 2_097_152:
                  raise Gate('Authorized legacy recovery metadata is unavailable')
              try:
                  value = json.loads(result.stdout)
              except (TypeError, ValueError):
                  raise Gate('Legacy recovery metadata is malformed') from None
              if not isinstance(value, dict):
                  raise Gate('Legacy recovery metadata is malformed')
              return value

          def validate_run(run, run_id):
              if (run.get('id') != run_id or run.get('path') != LEGACY_WORKFLOW
                      or run.get('event') != 'workflow_dispatch' or run.get('head_branch') != 'main'
                      or run.get('status') != 'completed' or run.get('conclusion') != 'failure'
                      or run.get('repository', {}).get('full_name') != REPOSITORY
                      or run.get('head_repository', {}).get('full_name') != REPOSITORY
                      or not isinstance(run.get('head_sha'), str)
                      or not re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
                      or not positive_int(run.get('workflow_id'))):
                  raise Gate('Recovery requires the failed trusted legacy main deployment')
              workflow = github_json(f"repos/{REPOSITORY}/actions/workflows/{run['workflow_id']}")
              if workflow.get('id') != run['workflow_id'] or workflow.get('path') != LEGACY_WORKFLOW:
                  raise Gate('Recovery run workflow differs from the trusted legacy deployment')

          def select_artifact(run, run_id):
              expected = f"serverless-deployment-{run['head_sha']}-{run_id}"
              matches = []
              for page in range(1, 11):
                  response = github_json(f'repos/{REPOSITORY}/actions/runs/{run_id}/artifacts?per_page=100&page={page}')
                  batch = response.get('artifacts')
                  if not isinstance(batch, list) or len(batch) > 100:
                      raise Gate('Legacy recovery artifact inventory is malformed')
                  for artifact in batch:
                      if not isinstance(artifact, dict):
                          raise Gate('Legacy recovery artifact inventory is malformed')
                      if artifact.get('name') == expected:
                          matches.append(artifact)
                  if len(batch) < 100:
                      break
              else:
                  raise Gate('Legacy recovery artifact inventory exceeds its bound')
              if len(matches) != 1:
                  raise Gate('One exact-source legacy recovery artifact is required')
              artifact = matches[0]
              provenance = artifact.get('workflow_run', {})
              if (not positive_int(artifact.get('id')) or artifact.get('expired') is not False
                      or type(artifact.get('size_in_bytes')) is not int
                      or not 0 < artifact['size_in_bytes'] <= MAX_ARCHIVE
                      or not isinstance(artifact.get('digest'), str)
                      or not re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
                      or not isinstance(provenance, dict)
                      or provenance.get('id') != run_id or provenance.get('head_sha') != run['head_sha']
                      or provenance.get('head_branch') != 'main'):
                  raise Gate('Legacy recovery artifact digest, source or availability differs')
              return artifact

          def extract_manifest(archive_path, manifest_path):
              with zipfile.ZipFile(archive_path) as archive:
                  entries = archive.infolist()
                  if len(entries) > 1000:
                      raise Gate('Legacy recovery archive contains too many entries')
                  candidates = [entry for entry in entries
                      if PurePosixPath(entry.filename).name == 'initial-recovery.json' and not entry.is_dir()]
                  if len(candidates) != 1:
                      raise Gate('Legacy recovery archive must contain one initial recovery journal')
                  entry = candidates[0]
                  path = PurePosixPath(entry.filename)
                  if (path.is_absolute() or '..' in path.parts or '\\' in entry.filename
                          or entry.flag_bits & 1 or stat.S_ISLNK(entry.external_attr >> 16)
                          or not 0 < entry.file_size <= MAX_MANIFEST):
                      raise Gate('Legacy recovery journal path or size is unsupported')
                  with archive.open(entry) as stream:
                      raw = stream.read(MAX_MANIFEST + 1)
                  if len(raw) > MAX_MANIFEST:
                      raise Gate('Legacy recovery journal exceeds its supported size')
              descriptor = os.open(manifest_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, 'wb') as destination:
                  destination.write(raw)
              bounded_json(manifest_path, MAX_MANIFEST)

          def prepare_recovery():
              value = os.environ.get('RECOVERY_RUN_ID', '').strip()
              if os.environ.get('CONTINUE_UNINITIALIZED_RUN_ID', '') and value:
                  raise Gate('Choose one protected recovery route before artifact download')
              if not value:
                  return
              if not re.fullmatch(r'[1-9][0-9]{0,15}', value) or not positive_int(int(value)):
                  raise Gate('Recovery run ID must be a positive GitHub run identifier')
              if os.environ.get('ESTABLISH_NEW') != 'true':
                  raise Gate('Legacy initial recovery requires explicit first-empty-journal initialization')
              if os.environ.get('GH_REPO') != REPOSITORY:
                  raise Gate('Recovery requires the trusted OnGo repository')
              run_id = int(value)
              run = github_json(f'repos/{REPOSITORY}/actions/runs/{run_id}')
              validate_run(run, run_id)
              artifact = select_artifact(run, run_id)
              directory = Path('.local/fargateconfig/recovery')
              directory.mkdir(parents=True, exist_ok=True, mode=0o700)
              archive_path = directory / 'recovery-artifact.zip'
              descriptor = os.open(archive_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, 'wb') as destination:
                  download = subprocess.run(['gh', 'api',
                      f"repos/{REPOSITORY}/actions/artifacts/{artifact['id']}/zip"],
                      stdout=destination, stderr=subprocess.PIPE, timeout=120)
              if download.returncode != 0 or not 0 < archive_path.stat().st_size <= MAX_ARCHIVE:
                  raise Gate('Legacy recovery archive download failed or exceeded its bound')
              digest = 'sha256:' + hashlib.sha256(archive_path.read_bytes()).hexdigest()
              if digest != artifact['digest']:
                  raise Gate('Downloaded legacy recovery archive differs from its GitHub digest')
              extract_manifest(archive_path, directory / 'initial-recovery.json')
              proof = {'run_id': run_id, 'artifact_id': artifact['id'], 'head_sha': run['head_sha'],
                  'archive_sha256': digest, 'artifact_name': artifact['name'], 'workflow_path': LEGACY_WORKFLOW}
              (directory / 'artifact-proof.json').write_text(json.dumps(proof, indent=2) + '\n')

          if __name__ == '__main__':
              try:
                  prepare_recovery()
              except Exception as error:
                  message = str(error) if isinstance(error, Gate) else type(error).__name__
                  raise SystemExit('Recovery artifact admission blocked: ' + message)
          PYCODE

      - name: Admit the protected stopped-deployment continuation before credentials
        id: continuation
        shell: bash
        env:
          CONTINUE_UNINITIALIZED_RUN_ID: ${{ inputs.continue_uninitialized_run_id }}
          PREVIOUS_CONTINUATION_RUN_ID: ${{ inputs.previous_continuation_run_id }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          ESTABLISH_NEW: ${{ inputs.establish_new }}
        run: |
          set -euo pipefail
          uv run --project services/api python - <<'PYCODE'
          from datetime import datetime
          import hashlib
          import io
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import zipfile
          from deploy import platform
          from deploy.provenance import Gate, REPOSITORY, WORKFLOW_PATH, REQUIRED_JOBS, bounded_file, positive_int, trusted_branch
          from otgd.canonical import strict_loads
          DEPLOY_WORKFLOW_PATH = '.github/workflows/deploy-serverless.yml'
          DEPLOY_WORKFLOW_NAME = 'Deploy serverless development to AWS'
          MANIFEST_LIMIT = 262_144
          ARCHIVE_LIMIT = 8_388_608
          FARGATE_WORKFLOW_PATH = '.github/workflows/deploy-fargate.yml'
          FARGATE_WORKFLOW_NAME = 'Deploy OnGo containers to AWS'
          FARGATE_JOBS = REQUIRED_JOBS | {'platform / fargate-container-runtime'}
          PREVIOUS_FIELDS = {'run_id', 'run_attempt', 'release_id', 'artifact_sha256',
              'run_started_at', 'run_completed_at', 'source_bundle_raw', 'continuation_raw', 'deployment_state_raw'}

          def github_json(path):
              result = subprocess.run(['gh', 'api', path], capture_output=True, text=True, timeout=30)
              if result.returncode != 0 or len(result.stdout.encode()) > 2_097_152:
                  raise Gate('Authorized GitHub gate metadata is unavailable')
              try:
                  value = json.loads(result.stdout)
              except (TypeError, ValueError):
                  raise Gate('GitHub gate metadata is malformed') from None
              if not isinstance(value, dict):
                  raise Gate('GitHub gate metadata is malformed')
              return value

          def select_latest_gate(revision):
              runs = []
              for page in range(1, 11):
                  response = github_json(
                      f'repos/{REPOSITORY}/actions/workflows/merge-gate.yml/runs'
                      f'?head_sha={revision}&per_page=100&page={page}')
                  batch = response.get('workflow_runs')
                  if not isinstance(batch, list) or len(batch) > 100:
                      raise Gate('GitHub workflow inventory is malformed')
                  for run in batch:
                      if not isinstance(run, dict):
                          raise Gate('GitHub workflow inventory is malformed')
                      if (run.get('head_sha') == revision and run.get('path') == WORKFLOW_PATH
                              and trusted_branch(run.get('event'), run.get('head_branch'))):
                          if type(run.get('id')) is not int or run['id'] <= 0:
                              raise Gate('GitHub workflow identity is malformed')
                          runs.append(run)
                  if len(batch) < 100:
                      break
              else:
                  raise Gate('GitHub workflow inventory exceeds its supported bounds')
              if not runs:
                  raise Gate('No trusted exact-source Required application gates run exists')
              latest = max(runs, key=lambda run: run['id'])
              if latest.get('status') != 'completed' or latest.get('conclusion') != 'success':
                  raise Gate('The latest trusted exact-source gate run must finish successfully')
              return latest['id']

          def validate_resume_run(run, run_id, *, fargate=False):
              repository = run.get('repository')
              head_repository = run.get('head_repository')
              if (run.get('id') != run_id or not positive_int(run.get('id'))
                      or not positive_int(run.get('workflow_id')) or not positive_int(run.get('run_attempt'))
                      or run.get('path') != (FARGATE_WORKFLOW_PATH if fargate else DEPLOY_WORKFLOW_PATH)
                      or run.get('name') != (FARGATE_WORKFLOW_NAME if fargate else DEPLOY_WORKFLOW_NAME)
                      or run.get('event') != 'workflow_dispatch' or run.get('head_branch') != 'main'
                      or run.get('status') != 'completed' or run.get('conclusion') != 'failure'
                      or not isinstance(run.get('head_sha'), str)
                      or not re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
                      or not isinstance(repository, dict) or not isinstance(head_repository, dict)
                      or repository.get('full_name') != REPOSITORY or head_repository.get('full_name') != REPOSITORY
                      or not positive_int(repository.get('id')) or head_repository.get('id') != repository['id']):
                  raise Gate('Resume source must be a completed failed main dispatch of the trusted deployment workflow')

          def select_resume_artifact(run, *, fargate=False):
              route = 'fargate' if fargate else 'serverless'
              name = f"{route}-deployment-{run['head_sha']}-{run['id']}"
              inventory = github_json(
                  f"repos/{REPOSITORY}/actions/runs/{run['id']}/artifacts?name={name}&per_page=100")
              artifacts = inventory.get('artifacts')
              total = inventory.get('total_count')
              if (type(total) is not int or not 0 <= total <= 100 or not isinstance(artifacts, list)
                      or len(artifacts) != total or any(not isinstance(item, dict) for item in artifacts)):
                  raise Gate('Recovery artifact inventory is malformed or exceeds its bounds')
              candidates = [item for item in artifacts if item.get('name') == name]
              if len(candidates) != 1:
                  raise Gate('Exactly one unambiguous original recovery artifact is required')
              artifact = candidates[0]
              binding = artifact.get('workflow_run')
              if (not positive_int(artifact.get('id')) or artifact.get('expired') is not False
                      or type(artifact.get('size_in_bytes')) is not int
                      or not 0 < artifact['size_in_bytes'] <= ARCHIVE_LIMIT
                      or not isinstance(binding, dict) or binding.get('id') != run['id']
                      or binding.get('head_sha') != run['head_sha'] or binding.get('head_branch') != 'main'
                      or binding.get('repository_id') != run['repository']['id']
                      or binding.get('head_repository_id') != run['repository']['id']):
                  raise Gate('Recovery artifact does not bind the selected trusted deployment run')
              try:
                  started = datetime.fromisoformat(run['run_started_at'].replace('Z', '+00:00'))
                  created = datetime.fromisoformat(artifact['created_at'].replace('Z', '+00:00'))
                  completed = datetime.fromisoformat(run['updated_at'].replace('Z', '+00:00'))
                  if not all(value.utcoffset() is not None for value in (started, created, completed)):
                      raise ValueError
                  if not started <= created <= completed:
                      raise ValueError
              except (KeyError, AttributeError, TypeError, ValueError):
                  raise Gate('Recovery artifact must belong to the selected completed run attempt') from None
              return artifact

          def continuation_run_id():
              value = os.environ.get('CONTINUE_UNINITIALIZED_RUN_ID', '')
              if value == '':
                  return None
              if not re.fullmatch(r'[1-9][0-9]{0,15}', value) or not positive_int(int(value)):
                  raise Gate('Uninitialized continuation source must be a positive numeric workflow run ID')
              if (os.environ.get('ESTABLISH_NEW') != 'true'
                      or os.environ.get('RECOVERY_RUN_ID', '') != ''):
                  raise Gate('Uninitialized continuation requires establish_new and excludes initial recovery flags')
              return int(value)

          def previous_continuation_run_id(legacy_run_id):
              value = os.environ.get('PREVIOUS_CONTINUATION_RUN_ID', '')
              if value == '':
                  return None
              if not re.fullmatch(r'[1-9][0-9]{0,15}', value) or not positive_int(int(value)):
                  raise Gate('Previous continuation source must be a positive numeric workflow run ID')
              if legacy_run_id is None:
                  raise Gate('Previous Fargate recovery requires the protected legacy continuation source')
              return int(value)

          def require_latest_previous_run(run_id):
              current = os.environ.get('GITHUB_RUN_ID', '')
              if (not re.fullmatch(r'[1-9][0-9]{0,15}', current) or not positive_int(int(current))
                      or run_id >= int(current)):
                  raise Gate('Previous continuation requires this authenticated dispatch identity')
              candidates = []
              for page in range(1, 11):
                  inventory = github_json(f'repos/{REPOSITORY}/actions/workflows/deploy-fargate.yml/runs'
                      f'?branch=main&event=workflow_dispatch&per_page=100&page={page}')
                  batch = inventory.get('workflow_runs')
                  if not isinstance(batch, list) or len(batch) > 100 or any(not isinstance(run, dict) for run in batch):
                      raise Gate('Previous Fargate deployment inventory is malformed')
                  for run in batch:
                      if (run.get('path') == FARGATE_WORKFLOW_PATH and run.get('event') == 'workflow_dispatch'
                              and run.get('head_branch') == 'main'):
                          if not positive_int(run.get('id')):
                              raise Gate('Previous Fargate deployment identity is malformed')
                          if run['id'] != int(current):
                              candidates.append(run['id'])
                  if len(batch) < 100:
                      break
              else:
                  raise Gate('Previous Fargate deployment inventory exceeds its supported bounds')
              if not candidates or max(candidates) != run_id:
                  raise Gate('Previous recovery must select the latest prior main Fargate dispatch')

          def strict_record(raw, limit):
              try:
                  if not isinstance(raw, str) or not 0 < len(raw.encode('utf-8')) <= limit:
                      raise ValueError
                  record = strict_loads(raw)
                  if not isinstance(record, dict):
                      raise ValueError
                  return record
              except (TypeError, ValueError, RecursionError):
                  raise Gate('Previous continuation requires bounded strict JSON records') from None

          def previous_files_from_archive(path, revision):
              raw = bounded_file(path, ARCHIVE_LIMIT, private=True)
              source = '.local/fargateconfig/continuation-source/uninitialized-continuation.json'
              prefix = f'.local/deploy/fargate-development/{revision}/'
              optional = {'.local/fargateconfig/gate-admission.json',
                  '.local/fargateconfig/continuation-admission.json', 'reports/fargate-plan.json',
                  'reports/fargate-deploy.json'}
              try:
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      entries = archive.infolist()
                      if len(entries) > 100 or sum(item.file_size for item in entries) > ARCHIVE_LIMIT:
                          raise Gate('Previous continuation archive exceeds its supported bounds')
                      selected, paths = {}, set()
                      attempt_directories = set()
                      for item in entries:
                          name = PurePosixPath(item.filename)
                          mode = item.external_attr >> 16
                          if (name.is_absolute() or '..' in name.parts or '\\' in item.filename
                                  or str(name) != item.filename.rstrip('/') or item.filename in paths
                                  or item.flag_bits & 1 or stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR)
                                  or (item.is_dir() and stat.S_IFMT(mode) == stat.S_IFREG)
                                  or (not item.is_dir() and stat.S_IFMT(mode) == stat.S_IFDIR)):
                              raise Gate('Previous continuation archive requires unique safe regular paths')
                          paths.add(item.filename)
                          if item.is_dir():
                              continue
                          field, limit = None, MANIFEST_LIMIT
                          if item.filename == source:
                              field, limit = 'source_bundle_raw', ARCHIVE_LIMIT
                          elif item.filename.startswith(prefix):
                              remainder = item.filename[len(prefix):]
                              match = re.fullmatch(r'([0-9a-f]{32})/(uninitialized-continuation|deployment-state)\.json', remainder)
                              if not match:
                                  raise Gate('Previous continuation contains an initialization or deployment receipt')
                              attempt_directories.add(match[1])
                              field = 'continuation_raw' if match[2] == 'uninitialized-continuation' else 'deployment_state_raw'
                              limit = MANIFEST_LIMIT if field == 'continuation_raw' else 65_536
                          elif item.filename not in optional:
                              raise Gate('Previous continuation contains an unsupported evidence path')
                          if item.filename == 'reports/fargate-deploy.json' and item.file_size != 0:
                              raise Gate('Previous continuation already contains a deployment receipt')
                          if not 0 <= item.file_size <= limit:
                              raise Gate('Previous continuation evidence exceeds its supported bound')
                          if field:
                              if field in selected or item.file_size == 0:
                                  raise Gate('Previous continuation records must be unique and nonempty')
                              data = archive.read(item)
                              if len(data) != item.file_size:
                                  raise Gate('Previous continuation evidence size changed')
                              selected[field] = data.decode('utf-8')
                      if set(selected) != {'source_bundle_raw', 'continuation_raw', 'deployment_state_raw'} or len(attempt_directories) != 1:
                          raise Gate('Previous continuation lacks its protected source and entered-stage journals')
                      return selected
              except Gate:
                  raise
              except (zipfile.BadZipFile, RuntimeError, OSError, ValueError):
                  raise Gate('Previous continuation archive is unavailable or malformed') from None

          def previous_chain(packet, original_bundle):
              chain, seen = [], set()
              while packet is not None:
                  if not isinstance(packet, dict) or set(packet) != PREVIOUS_FIELDS or len(chain) >= 8:
                      raise Gate('Previous continuation chain requires at most eight exact recovery packets')
                  if (not positive_int(packet['run_id']) or not positive_int(packet['run_attempt'])
                          or packet['run_id'] in seen or not re.fullmatch(r'[0-9a-f]{40}', str(packet['release_id']))
                          or not re.fullmatch(r'[0-9a-f]{64}', str(packet['artifact_sha256']))):
                      raise Gate('Previous continuation run identity is malformed or repeated')
                  seen.add(packet['run_id'])
                  try:
                      times = [datetime.fromisoformat(packet[k].replace('Z', '+00:00'))
                          for k in ('run_started_at', 'run_completed_at')]
                      if any(t.utcoffset() is None or t.utcoffset().total_seconds() != 0 for t in times) or times[0] > times[1]:
                          raise ValueError
                  except (TypeError, ValueError, AttributeError):
                      raise Gate('Previous continuation run window must use ordered UTC times') from None
                  source = strict_record(packet['source_bundle_raw'], ARCHIVE_LIMIT)
                  journal = strict_record(packet['continuation_raw'], MANIFEST_LIMIT)
                  state = strict_record(packet['deployment_state_raw'], 65_536)
                  base = {key: value for key, value in source.items() if key != 'previous_recovery'}
                  if base != original_bundle:
                      raise Gate('Previous continuation does not preserve the authenticated original source')
                  if (state.get('schema_version') != '1.0.0' or state.get('environment') != 'fargate-development'
                          or state.get('account') != '738470137867' or state.get('region') != 'us-east-2'
                          or state.get('release_id') != packet['release_id'] or state.get('status') != 'failed'
                          or state.get('current_stage') != 'continue-uninitialized-retained-resources'
                          or state.get('failed_stage') != 'continue-uninitialized-retained-resources'
                          or state.get('completed_stages') != [] or state.get('completed_receipts') != {}
                          or state.get('rollback_executed') is not False
                          or journal.get('schema_version') != '1.0.0'
                          or journal.get('operation') != 'serverless-uninitialized-continuation'
                          or journal.get('account') != '738470137867' or journal.get('region') != 'us-east-2'
                          or journal.get('stack_name') != 'otgd-serverless-development'
                          or journal.get('release_id') != packet['release_id']
                          or journal.get('source_bundle_sha256') != hashlib.sha256(packet['source_bundle_raw'].encode()).hexdigest()
                          or journal.get('journal_established') is not False
                          or journal.get('actual_resources_deleted') is not False
                          or journal.get('application_deployment_completed') is not False
                          or journal.get('status') != 'blocked-recovery-inspect-protected-journal-before-retry'
                          or any(journal.get(key) != original_bundle.get(key) for key in
                              ('failed_run_id', 'failed_run_attempt', 'failed_release_id', 'artifact_sha256'))):
                      raise Gate('Previous continuation must prove an entered failure before first initialization')
                  chain.append(packet)
                  packet = source.get('previous_recovery')
                  if 'previous_recovery' in source and packet is None:
                      raise Gate('Previous continuation recovery packet cannot be null')
              return chain

          def load_previous_packet(run_id, directory):
              run = github_json(f'repos/{REPOSITORY}/actions/runs/{run_id}')
              validate_resume_run(run, run_id, fargate=True)
              workflow = github_json(f"repos/{REPOSITORY}/actions/workflows/{run['workflow_id']}")
              if (workflow.get('id') != run['workflow_id'] or workflow.get('path') != FARGATE_WORKFLOW_PATH
                      or workflow.get('name') != FARGATE_WORKFLOW_NAME or workflow.get('state') != 'active'):
                  raise Gate('Previous continuation workflow differs from the active reviewed Fargate workflow')
              artifact = select_resume_artifact(run, fargate=True)
              digest = artifact.get('digest')
              if not isinstance(digest, str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise Gate('Previous continuation archive requires its authenticated SHA-256')
              directory.mkdir(parents=True, exist_ok=False)
              path = directory / 'download.zip'
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, 'wb') as stream:
                  downloaded = subprocess.run(['gh', 'api', f"repos/{REPOSITORY}/actions/artifacts/{artifact['id']}/zip"],
                      stdout=stream, stderr=subprocess.PIPE, timeout=60)
              archive_hash = hashlib.sha256(bounded_file(path, ARCHIVE_LIMIT, private=True)).hexdigest()
              if downloaded.returncode != 0 or digest != 'sha256:' + archive_hash:
                  raise Gate('Previous continuation archive bytes differ from authenticated GitHub evidence')
              files = previous_files_from_archive(path, run['head_sha'])
              packet = {'run_id': run_id, 'run_attempt': run['run_attempt'], 'release_id': run['head_sha'],
                  'artifact_sha256': archive_hash, 'run_started_at': run['run_started_at'],
                  'run_completed_at': run['updated_at'], **files}
              return packet, run

          def verify_previous_gate(revision, directory):
              gate_id = select_latest_gate(revision)
              run = github_json(f'repos/{REPOSITORY}/actions/runs/{gate_id}')
              if (run.get('head_sha') != revision or run.get('path') != WORKFLOW_PATH
                      or run.get('status') != 'completed' or run.get('conclusion') != 'success'
                      or not trusted_branch(run.get('event'), run.get('head_branch'))
                      or not positive_int(run.get('run_attempt'))):
                  raise Gate('Previous Fargate source lacks its latest successful exact-source gate')
              inventory = github_json(f"repos/{REPOSITORY}/actions/runs/{gate_id}/attempts/{run['run_attempt']}/jobs?per_page=100")
              jobs = inventory.get('jobs')
              if (type(inventory.get('total_count')) is not int or inventory['total_count'] != 14
                      or not isinstance(jobs, list) or len(jobs) != 14
                      or any(not isinstance(job, dict) for job in jobs)
                      or {job.get('name') for job in jobs} != FARGATE_JOBS
                      or any(not positive_int(job.get('id')) or job.get('run_id') != gate_id
                          or job.get('run_attempt') != run['run_attempt'] or job.get('head_sha') != revision
                          or job.get('status') != 'completed' or job.get('conclusion') != 'success' for job in jobs)
                      or len({job['id'] for job in jobs}) != 14):
                  raise Gate('Previous Fargate source requires every mandatory latest-attempt fourteen-job gate')
              directory.mkdir(parents=True, exist_ok=False)
              downloaded = subprocess.run(['gh', 'run', 'download', str(gate_id), '--repo', REPOSITORY,
                  '--name', 'exact-revision-merge-evidence', '--dir', str(directory)],
                  capture_output=True, text=True, timeout=60)
              if downloaded.returncode != 0:
                  raise Gate('Previous Fargate gate artifact is unavailable')
              proof = platform.verify_gate_file(directory / 'gates.json', revision)
              if proof.get('run_id') != gate_id or proof.get('head_sha') != revision:
                  raise Gate('Previous Fargate gate artifact belongs to a different source or run')
              current = github_json(f'repos/{REPOSITORY}/actions/runs/{gate_id}')
              if (select_latest_gate(revision) != gate_id or any(current.get(key) != run.get(key) for key in
                      ('id', 'head_sha', 'run_attempt', 'status', 'conclusion', 'workflow_id'))):
                  raise Gate('Previous Fargate gate changed during admission')
              return proof

          def require_unchanged_previous_gate(revision, proof):
              gate_id = proof['run_id']
              current = github_json(f'repos/{REPOSITORY}/actions/runs/{gate_id}')
              if (select_latest_gate(revision) != gate_id or current.get('head_sha') != revision
                      or current.get('status') != 'completed' or current.get('conclusion') != 'success'
                      or current.get('run_attempt') != proof.get('run_attempt')
                      or current.get('workflow_id') != proof.get('workflow_id')):
                  raise Gate('Previous Fargate gate changed while its source chain was authenticated')

          def admit_previous_recovery(run_id, bundle, directory):
              require_latest_previous_run(run_id)
              packet, run = load_previous_packet(run_id, directory / 'previous-continuation-source' / '1')
              chain = previous_chain(packet, bundle)
              runs, gates = [run], {}
              for index, member in enumerate(chain, 1):
                  if index > 1:
                      actual, prior_run = load_previous_packet(member['run_id'],
                          directory / 'previous-continuation-source' / str(index))
                      if actual != member:
                          raise Gate('Nested previous recovery differs from its authenticated latest artifact')
                      runs.append(prior_run)
                  revision = member['release_id']
                  if revision not in gates:
                      gates[revision] = verify_previous_gate(revision, directory / 'previous-continuation-gates' / revision)
              for prior_run in runs:
                  current = github_json(f"repos/{REPOSITORY}/actions/runs/{prior_run['id']}")
                  validate_resume_run(current, prior_run['id'], fargate=True)
                  if any(current.get(key) != prior_run.get(key) for key in
                      ('id', 'workflow_id', 'run_attempt', 'head_sha', 'path', 'event', 'head_branch',
                       'status', 'conclusion', 'run_started_at', 'updated_at')):
                      raise Gate('Previous Fargate run changed during chain admission')
              for revision, proof in gates.items():
                  require_unchanged_previous_gate(revision, proof)
              require_latest_previous_run(run_id)
              return packet

          def recheck_legacy_continuation(run, gate_run_id, historical_directory, proof):
              if select_latest_gate(run['head_sha']) != gate_run_id:
                  raise Gate('Legacy continuation latest source gate changed during previous recovery admission')
              final_proof = platform.verify_gate_file(historical_directory / 'gates.json', run['head_sha'])
              if final_proof != proof:
                  raise Gate('Legacy continuation source gate attempt changed during previous recovery admission')
              current = github_json(f"repos/{REPOSITORY}/actions/runs/{run['id']}")
              validate_resume_run(current, run['id'])
              if any(current.get(key) != run.get(key) for key in
                     ('id', 'workflow_id', 'run_attempt', 'head_sha', 'path', 'event', 'head_branch',
                      'status', 'conclusion', 'run_started_at', 'updated_at')):
                  raise Gate('Legacy continuation source run changed during previous recovery admission')

          def continuation_files_from_archive(path):
              raw = bounded_file(path, ARCHIVE_LIMIT, private=True)
              limits = {'original-initial-recovery.json': MANIFEST_LIMIT,
                        'initial-recovery.json': MANIFEST_LIMIT,
                        'deployment-state.json': 65_536, 'gate-admission.json': 65_536,
                        'serverless-plan.json': MANIFEST_LIMIT}
              try:
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      entries = archive.infolist()
                      if len(entries) > 100 or sum(item.file_size for item in entries) > ARCHIVE_LIMIT:
                          raise Gate('Continuation archive exceeds its supported bounds')
                      selected = {}
                      for item in entries:
                          name = PurePosixPath(item.filename)
                          mode = item.external_attr >> 16
                          if (name.is_absolute() or '..' in name.parts or '\\' in item.filename
                                  or item.flag_bits & 1 or stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR)
                                  or (item.is_dir() and stat.S_IFMT(mode) == stat.S_IFREG)
                                  or (not item.is_dir() and stat.S_IFMT(mode) == stat.S_IFDIR)):
                              raise Gate('Continuation archive requires regular files and safe directories')
                          if name.name in limits:
                              if (name.name in selected or item.is_dir()
                                      or not 0 < item.file_size <= limits[name.name]):
                                  raise Gate('Continuation evidence must be unique bounded regular files')
                              data = archive.read(item)
                              if len(data) != item.file_size:
                                  raise Gate('Continuation evidence size differs from its archive metadata')
                              selected[name.name] = data
                      if set(selected) != set(limits):
                          raise Gate('Continuation artifact lacks required protected evidence')
                      return selected
              except (zipfile.BadZipFile, RuntimeError, OSError, ValueError):
                  raise Gate('Continuation archive is unavailable or malformed') from None

          def validate_continuation_files(files, run):
              try:
                  records = {name: strict_loads(raw) for name, raw in files.items()}
              except (TypeError, ValueError):
                  raise Gate('Continuation evidence is not strict bounded JSON') from None
              if any(not isinstance(value, dict) for value in records.values()):
                  raise Gate('Continuation evidence requires JSON objects')
              original = records['original-initial-recovery.json']
              adoption = records['initial-recovery.json']
              state = records['deployment-state.json']
              gate = records['gate-admission.json']
              plan = records['serverless-plan.json']
              expected = ['resume-initial-retained-resources', 'serverless-registry',
                          'exact-source-archive', 'build-immutable-lambda-images']
              if (original.get('operation') != 'serverless-initial-recovery'
                      or original.get('failed_phase') != 'failed-stack-metadata-detached'
                      or original.get('actual_resources_deleted') is not False
                      or original.get('application_deployment_completed') is not False
                      or adoption.get('operation') != 'serverless-initial-recovery'
                      or adoption.get('release_id') != run['head_sha']
                      or adoption.get('source_manifest_sha256') != hashlib.sha256(
                          files['original-initial-recovery.json']).hexdigest()
                      or adoption.get('status') != 'uninitialized-retained-resources-imported'
                      or adoption.get('actual_resources_deleted') is not False
                      or adoption.get('application_deployment_completed') is not False
                      or state.get('schema_version') != '1.0.0'
                      or state.get('environment') != 'serverless-development'
                      or state.get('account') != '738470137867' or state.get('region') != 'us-east-2'
                      or state.get('release_id') != run['head_sha']
                      or state.get('status') != 'failed' or state.get('current_stage') != 'deploy-stopped'
                      or state.get('failed_stage') != 'deploy-stopped'
                      or state.get('completed_stages') != expected
                      or state.get('completed_receipts') != {} or state.get('rollback_executed') is not False
                      or gate.get('provider') != 'github_actions' or gate.get('repository') != REPOSITORY
                      or gate.get('workflow_path') != WORKFLOW_PATH or gate.get('head_sha') != run['head_sha']
                      or not trusted_branch(gate.get('event'), gate.get('head_branch'))
                      or plan.get('deployment_executed') is not False):
                  raise Gate('Continuation source does not prove a stopped failure before first initialization')
              for record in (original, adoption):
                  if (record.get('schema_version') != '1.0.0' or record.get('account') != '738470137867'
                          or record.get('region') != 'us-east-2' or record.get('stack_name') != 'otgd-serverless-development'):
                      raise Gate('Continuation recovery authority differs from the reviewed target')
              return records

          def admit_continuation():
              run_id = continuation_run_id()
              previous_run_id = previous_continuation_run_id(run_id)
              if run_id is None:
                  return
              run = github_json(f'repos/{REPOSITORY}/actions/runs/{run_id}')
              validate_resume_run(run, run_id)
              workflow = github_json(f"repos/{REPOSITORY}/actions/workflows/{run['workflow_id']}")
              if (workflow.get('id') != run['workflow_id'] or workflow.get('path') != DEPLOY_WORKFLOW_PATH
                      or workflow.get('name') != DEPLOY_WORKFLOW_NAME
                      or workflow.get('state') not in {'active', 'disabled_manually'}):
                  raise Gate('Continuation source does not belong to the reviewed historical deployment workflow')
              artifact = select_resume_artifact(run)
              digest = artifact.get('digest')
              if not isinstance(digest, str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise Gate('Continuation artifact requires its authenticated SHA-256 digest')
              directory = Path('.local/fargateconfig')
              source_directory = directory / 'continuation-source'
              source_directory.mkdir(parents=True, exist_ok=False)
              archive_path = source_directory / 'download.zip'
              descriptor = os.open(archive_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, 'wb') as stream:
                  os.fchmod(stream.fileno(), 0o600)
                  downloaded = subprocess.run(
                      ['gh', 'api', f"repos/{REPOSITORY}/actions/artifacts/{artifact['id']}/zip"],
                      stdout=stream, stderr=subprocess.PIPE, timeout=60)
              if downloaded.returncode != 0:
                  raise Gate('Protected continuation artifact is unavailable')
              archive_hash = hashlib.sha256(bounded_file(archive_path, ARCHIVE_LIMIT, private=True)).hexdigest()
              if digest != 'sha256:' + archive_hash:
                  raise Gate('Continuation artifact bytes differ from their authenticated digest')
              files = continuation_files_from_archive(archive_path)
              records = validate_continuation_files(files, run)
              gate_run_id = select_latest_gate(run['head_sha'])
              historical_directory = directory / 'continuation-gates'
              historical_directory.mkdir(exist_ok=False)
              downloaded = subprocess.run(
                  ['gh', 'run', 'download', str(gate_run_id), '--repo', REPOSITORY,
                   '--name', 'exact-revision-merge-evidence', '--dir', str(historical_directory)],
                  capture_output=True, text=True, timeout=60)
              if downloaded.returncode != 0:
                  raise Gate('Continuation exact-source aggregate gate artifact is unavailable')
              proof = platform.verify_gate_file(historical_directory / 'gates.json', run['head_sha'])
              if proof['run_id'] != gate_run_id:
                  raise Gate('Continuation gate evidence belongs to a different workflow run')
              current = github_json(f'repos/{REPOSITORY}/actions/runs/{run_id}')
              validate_resume_run(current, run_id)
              if any(current.get(key) != run.get(key) for key in
                     ('id', 'workflow_id', 'run_attempt', 'head_sha', 'path', 'event', 'head_branch',
                      'status', 'conclusion', 'run_started_at', 'updated_at')):
                  raise Gate('Selected continuation workflow run changed during admission')
              bundle = {'schema_version': '1.0.0', 'operation': 'serverless-uninitialized-continuation',
                        'account': '738470137867', 'region': 'us-east-2', 'stack_name': 'otgd-serverless-development',
                        'failed_run_id': run_id, 'failed_run_attempt': run['run_attempt'],
                        'failed_run_started_at': run['run_started_at'], 'failed_run_completed_at': run['updated_at'],
                        'failed_release_id': run['head_sha'], 'artifact_sha256': archive_hash,
                        'original_recovery_raw': files['original-initial-recovery.json'].decode('utf-8'),
                        'adoption_raw': files['initial-recovery.json'].decode('utf-8'),
                        'deployment_state_raw': files['deployment-state.json'].decode('utf-8'),
                        'gate_admission_raw': files['gate-admission.json'].decode('utf-8'),
                        'serverless_plan_raw': files['serverless-plan.json'].decode('utf-8')}
              if previous_run_id is not None:
                  bundle['previous_recovery'] = admit_previous_recovery(previous_run_id, bundle, directory)
                  recheck_legacy_continuation(run, gate_run_id, historical_directory, proof)
              raw = (json.dumps(bundle, indent=2) + '\n').encode()
              if len(raw) > ARCHIVE_LIMIT:
                  raise Gate('Continuation bundle exceeds its supported bound')
              source_path = source_directory / 'uninitialized-continuation.json'
              descriptor = os.open(source_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, 'wb') as stream:
                  os.fchmod(stream.fileno(), 0o600)
                  stream.write(raw)
              if bounded_file(source_path, ARCHIVE_LIMIT, private=True) != raw:
                  raise Gate('Preserved continuation bundle changed')
              source_hash = hashlib.sha256(raw).hexdigest()
              receipt = {'source_bundle_sha256': source_hash, 'source_bundle_path': str(source_path),
                         'source_run_id': run_id, 'source_run_attempt': run['run_attempt'],
                         'source_release_id': run['head_sha'], 'source_artifact_id': artifact['id'],
                         'source_artifact_sha256': archive_hash, 'historical_gate_provenance': proof}
              (directory / 'continuation-admission.json').write_text(json.dumps(receipt, indent=2) + '\n')
              with open(os.environ['GITHUB_ENV'], 'a') as environment:
                  environment.write(f'CONTINUE_UNINITIALIZED_PATH={source_path}\nCONTINUE_UNINITIALIZED_SHA256={source_hash}\n')

          if __name__ == '__main__':
              try:
                  admit_continuation()
              except Exception as error:
                  message = str(error) if isinstance(error, Gate) else type(error).__name__
                  raise SystemExit('Uninitialized continuation admission blocked: ' + message)
          PYCODE

      - name: Require the reviewed runner container build tooling
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker buildx version

      - name: Configure the existing repository AWS secrets after source admission
        id: credentials
        # Official aws-actions v5 annotated tag resolved to this reviewed commit.
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-2
          allowed-account-ids: '738470137867'
          unset-current-credentials: true
          force-skip-oidc: true
          output-credentials: false
          retry-max-attempts: 3
          action-timeout-s: 90

      - name: Verify the actual AWS target without printing credentials
        run: uv run --project services/api python deploy/check_access.py --account 738470137867 --region us-east-2

      - name: Deploy the OnGo container system and verify actual health
        id: deployment
        shell: bash
        env:
          ESTABLISH_NEW: ${{ inputs.establish_new }}
        run: |
          set -euo pipefail
          uv run --project services/api python - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          command = [sys.executable, 'deploy/fargate.py', 'deploy',
              '--config', '.local/fargateconfig/fargate.json',
              '--gate-evidence', '.local/fargateconfig/gates/gates.json']
          if os.environ.get('ESTABLISH_NEW') == 'true':
              command.append('--establish-new')
          proof_path = Path('.local/fargateconfig/recovery/artifact-proof.json')
          if proof_path.exists():
              proof = json.loads(proof_path.read_text())
              command += ['--recovery-manifest', '.local/fargateconfig/recovery/initial-recovery.json',
                  '--recovery-archive', '.local/fargateconfig/recovery/recovery-artifact.zip',
                  '--recovery-run-id', str(proof['run_id']), '--recovery-artifact-id', str(proof['artifact_id'])]
          if os.environ.get('CONTINUE_UNINITIALIZED_PATH'):
              command += ['--continue-uninitialized', os.environ['CONTINUE_UNINITIALIZED_PATH'],
                  '--continue-uninitialized-sha256', os.environ['CONTINUE_UNINITIALIZED_SHA256']]
          with open('reports/fargate-deploy.json', 'w') as output:
              subprocess.run(command, stdout=output, check=True)
          PYCODE

      - name: Publish credential-free deployment and health receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.admission.outcome == 'success'
        with:
          name: fargate-deployment-${{ github.sha }}-${{ github.run_id }}
          path: |
            .local/fargateconfig/gate-admission.json
            .local/fargateconfig/continuation-admission.json
            .local/fargateconfig/continuation-source/uninitialized-continuation.json
            .local/fargateconfig/recovery/artifact-proof.json
            reports/fargate-plan.json
            reports/fargate-deploy.json
            .local/deploy/fargate-development/**/deployment.json
            .local/deploy/fargate-development/**/deployment-state.json
            .local/deploy/fargate-development/**/initial-recovery.json
            .local/deploy/fargate-development/**/initial-resume.json
            .local/deploy/fargate-development/**/uninitialized-continuation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Record verified OnGo endpoints and remaining release checks
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          receipt = json.loads(Path('reports/fargate-deploy.json').read_text())
          if receipt.get('status') != 'fargate_transport_and_health_verified':
              raise SystemExit('No verified Fargate deployment receipt exists')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('OnGo container deployment verified for source `' + receipt['release_id'] + '`.\n\n')
              summary.write('- Web: ' + receipt['web_origin'] + '\n')
              summary.write('- API: ' + receipt['api_origin'] + '\n')
              summary.write('- CloudWatch health: ' + receipt['cloudwatch_dashboard_url'] + '\n\n')
              summary.write('Confirm the SNS email subscription and exercise alarm delivery and backup restore. The $100 budget is not a spending cap. QA acceptance, physical-device qualification and production promotion remain separate checks.\n')
          PYCODE
