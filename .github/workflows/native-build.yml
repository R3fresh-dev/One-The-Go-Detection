name: Android iOS and research reader firmware

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  APP_ENV: local
  EXPO_NO_TELEMETRY: '1'

jobs:
  shared-and-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official ref verified 2026-10-11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - run: npm run test:coverage
        working-directory: apps/mobile
      - run: node modules/scripts/verify-native-assets.mjs
        working-directory: apps/mobile
      - name: Compile and execute portable firmware protocol tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror firmware/tests/protocol_core_test.cpp -o "$RUNNER_TEMP/otgd-protocol-test"
          "$RUNNER_TEMP/otgd-protocol-test"
          g++ -std=c++17 -Wall -Wextra -Werror -pthread \
            firmware/tests/signed_reader_acquisition_test.cpp \
            -o "$RUNNER_TEMP/otgd-reader-acquisition-test"
          "$RUNNER_TEMP/otgd-reader-acquisition-test"
      - name: Install pinned Arduino CLI with release checksum
        run: |
          mkdir -p "$RUNNER_TEMP/otgd-arduino"
          curl --fail --location --retry 2 https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz -o "$RUNNER_TEMP/otgd-arduino/cli.tar.gz"
          echo "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  $RUNNER_TEMP/otgd-arduino/cli.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/otgd-arduino/cli.tar.gz" -C "$RUNNER_TEMP/otgd-arduino"
          echo "$RUNNER_TEMP/otgd-arduino" >> "$GITHUB_PATH"
      - name: Compile Nano ESP32 synthetic peripheral
        run: |
          python3 -m venv "$RUNNER_TEMP/otgd-arduino-python"
          "$RUNNER_TEMP/otgd-arduino-python/bin/pip" install pyserial==3.5
          export PATH="$RUNNER_TEMP/otgd-arduino-python/bin:$PATH"
          arduino-cli core update-index
          arduino-cli core install arduino:esp32@2.0.18-arduino.5
          arduino-cli lib install ArduinoJson@7.4.2
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/tests/sparkfun_fake \
            -I"$HOME/Arduino/libraries/ArduinoJson/src" \
            firmware/tests/sparkfun_ppg_test.cpp \
            firmware/nano_esp32_signed_reader/SparkFunBioSensor.cpp \
            firmware/nano_esp32_signed_reader/RyuDouble.cpp \
            -o "$RUNNER_TEMP/otgd-sparkfun-ppg-test"
          "$RUNNER_TEMP/otgd-sparkfun-ppg-test" "$RUNNER_TEMP/sparkfun-ppg-result-v1.json"
          cmp "$RUNNER_TEMP/sparkfun-ppg-result-v1.json" firmware/tests/fixtures/sparkfun-ppg-result-v1.json
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I"$HOME/Arduino/libraries/ArduinoJson/src" \
            firmware/tests/signed_reader_core_test.cpp \
            firmware/nano_esp32_signed_reader/RyuDouble.cpp \
            -o "$RUNNER_TEMP/otgd-signed-reader-test"
          "$RUNNER_TEMP/otgd-signed-reader-test"
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I"$HOME/Arduino/libraries/ArduinoJson/src" \
            firmware/tests/signed_reader_grant_test.cpp \
            firmware/nano_esp32_signed_reader/RyuDouble.cpp \
            -lcrypto -o "$RUNNER_TEMP/otgd-reader-grant-test"
          "$RUNNER_TEMP/otgd-reader-grant-test"
          arduino-cli compile --fqbn arduino:esp32:nano_nora --warnings all --output-dir firmware/build/nano_esp32 firmware/nano_esp32_ble_simulator
          arduino-cli compile --fqbn arduino:esp32:nano_nora --warnings all --output-dir firmware/build/signed_reader firmware/nano_esp32_signed_reader
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nano-esp32-synthetic-firmware
          path: firmware/build/nano_esp32/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nano-esp32-signed-reader-firmware
          path: firmware/build/signed_reader/
          if-no-files-found: error
          retention-days: 14
      - name: Evidence boundary
        run: echo 'Firmware compiled for the actual board package. This job does not flash a board, test radio behavior, qualify sensing hardware or establish impairment prediction.' >> "$GITHUB_STEP_SUMMARY"

  protected-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.0'
          python-version: '3.12'
      - name: Prepare and verify immutable protected SDK sources
        run: python firmware/tools/secure_reader_build.py prepare --cache "$RUNNER_TEMP/otgd-secure-sdk"
      - name: Install hash-locked build dependencies and official checked toolchain
        run: |
          set -euo pipefail
          otgd_sdk="$RUNNER_TEMP/otgd-secure-sdk"
          uv venv --python 3.12 --seed "$otgd_sdk/python"
          "$otgd_sdk/python/bin/pip" install --require-hashes -r firmware/secure_reader/requirements.lock
          export IDF_PATH="$otgd_sdk/esp-idf"
          export IDF_TOOLS_PATH="$otgd_sdk/tools"
          "$otgd_sdk/python/bin/python" "$IDF_PATH/tools/idf_tools.py" install xtensa-esp32s3-elf cmake ninja
      - name: Compile actual encrypted NVS, secure boot and authenticated BLE branch
        run: |
          set -euo pipefail
          otgd_sdk="$RUNNER_TEMP/otgd-secure-sdk"
          export IDF_PATH="$otgd_sdk/esp-idf"
          export IDF_TOOLS_PATH="$otgd_sdk/tools"
          export PATH="$otgd_sdk/python/bin:$IDF_TOOLS_PATH/tools/xtensa-esp32s3-elf/esp-2021r2-patch5-8.4.0/xtensa-esp32s3-elf/bin:$IDF_TOOLS_PATH/tools/cmake/3.23.1/bin:$IDF_TOOLS_PATH/tools/ninja/1.10.2:$PATH"
          otgd_ci_key="$RUNNER_TEMP/otgd-fictional-secure-boot.pem"
          trap 'rm -f "$otgd_ci_key"' EXIT
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$otgd_ci_key" 2>/dev/null
          "$otgd_sdk/python/bin/python" firmware/tools/secure_reader_build.py build --cache "$otgd_sdk" --output "$RUNNER_TEMP/otgd-secure-reader-build" --boot-signing-key "$otgd_ci_key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-reader-build
          path: |
            ${{ runner.temp }}/otgd-secure-reader-build/otgd_secure_reader.bin
            ${{ runner.temp }}/otgd-secure-reader-build/bootloader/bootloader.bin
            ${{ runner.temp }}/otgd-secure-reader-build/partition_table/partition-table.bin
            ${{ runner.temp }}/otgd-secure-reader-build/build-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Record unprovisioned build boundary
        run: echo 'The actual security-enabled SDK branch compiled with an ephemeral fictional boot-signing key. No device provisioning, flash operation, eFuse change, physical pairing or sensing qualification occurred.' >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
      EXPO_PUBLIC_OAUTH_ISSUER: http://10.0.2.2:8081
      EXPO_PUBLIC_OAUTH_ORIGIN: http://10.0.2.2:8081
      EXPO_PUBLIC_OAUTH_WEB_CALLBACK_URI: http://localhost:8082/
      EXPO_PUBLIC_OAUTH_CLIENT_ID: otgd-local-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
        working-directory: apps/mobile
      - run: node modules/scripts/verify-native-assets.mjs
        working-directory: apps/mobile
      - name: Generate Android project from committed configuration
        run: node node_modules/expo/bin/cli prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Require Android SDK 36
        run: |
          otgd_android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          otgd_sdkmanager="$otgd_android_sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$otgd_sdkmanager"
          "$otgd_sdkmanager" --sdk_root="$otgd_android_sdk" 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$otgd_android_sdk/platforms/android-36/android.jar"
          test -x "$otgd_android_sdk/build-tools/36.0.0/aapt2"
      # Release is an embedding/build mode here, never production signing. The
      # init script refuses nonlocal IDs, a Metro-dependent Release variant or
      # any signer other than Expo's generated public Android development key.
      - name: Compile native modules, run Kotlin golden suites, build both local APKs
        run: ./gradlew --no-daemon --max-workers=2 --init-script ../modules/scripts/local-preview.init.gradle -PreactNativeDevServerPort=8082 -PreactNativeArchitectures=arm64-v8a,x86_64 :otgd-reaction-task:testDebugUnitTest :otgd-eye-capture:testDebugUnitTest :app:assembleDebug :app:assembleRelease
        working-directory: apps/mobile/android
      - name: Require every native fixture test to execute
        run: |
          python3 scripts/ci_gate.py verify-junit apps/mobile/modules/reaction-task/android/build/test-results/testDebugUnitTest/*.xml
          python3 scripts/ci_gate.py verify-junit apps/mobile/modules/eye-capture/android/build/test-results/testDebugUnitTest/*.xml
      - name: Inspect standalone local APK bundle, application ID and development signer
        run: python3 modules/scripts/verify_android_preview.py
        working-directory: apps/mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-local-preview-apk
          path: apps/mobile/native-build/otgd-local-preview.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-native-test-reports
          path: |
            apps/mobile/modules/reaction-task/android/build/reports/tests/
            apps/mobile/modules/eye-capture/android/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
      - name: Evidence boundary
        run: echo 'Android native code and Kotlin fixture tests compiled. The standalone local preview APK embeds JavaScript and uses the generated development signing key; the separate debug APK uses Metro. No Play signing, device execution, physical latency calibration, Bluetooth bench run or human sensing is claimed.' >> "$GITHUB_STEP_SUMMARY"

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      EXPO_PUBLIC_API_URL: http://localhost:8000
      EXPO_PUBLIC_OAUTH_ISSUER: http://localhost:8081
      EXPO_PUBLIC_OAUTH_ORIGIN: http://localhost:8081
      EXPO_PUBLIC_OAUTH_WEB_CALLBACK_URI: http://localhost:8082/
      EXPO_PUBLIC_OAUTH_CLIENT_ID: otgd-local-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Require reviewed Xcode toolchain
        run: xcodebuild -version
      - run: npm ci
        working-directory: apps/mobile
      - run: node modules/scripts/verify-native-assets.mjs
        working-directory: apps/mobile
      - name: Run actual Swift core golden suites on macOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          swift test --package-path apps/mobile/modules/reaction-task \
            --parallel --num-workers 1 --verbose --disable-swift-testing \
            --xunit-output "$PWD/reports/ios-native.xml" \
            2>&1 | tee reports/ios-native.log
          python3 scripts/verify-swift-xctest.py reports/ios-native.xml reports/ios-native.log
          python3 scripts/ci_gate.py verify-junit reports/ios-native.xml
          swift test --package-path apps/mobile/modules/eye-capture \
            --parallel --num-workers 1 --verbose --disable-swift-testing \
            --xunit-output "$PWD/reports/ios-optical.xml" \
            2>&1 | tee reports/ios-optical.log
          python3 scripts/verify-swift-xctest.py reports/ios-optical.xml reports/ios-optical.log
          python3 scripts/ci_gate.py verify-junit reports/ios-optical.xml
      - name: Generate and install iOS native project dependencies
        run: |
          node node_modules/expo/bin/cli prebuild --platform ios --no-install
          pod install --project-directory=ios
        working-directory: apps/mobile
      - name: Compile the complete iOS simulator application
        run: python3 modules/scripts/build_ios.py
        working-directory: apps/mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-simulator-app
          path: apps/mobile/native-build/otgd-ios-simulator.app.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-native-test-results
          path: |
            reports/ios-native.xml
            reports/ios-native.log
            reports/ios-optical.xml
            reports/ios-optical.log
          if-no-files-found: error
          retention-days: 14
      - name: Evidence boundary
        run: echo 'Swift fixture suites and the iOS simulator application compiled using Xcode 26.4.1. This simulator artifact is unsigned, is not an iPhone/TestFlight build, and does not establish physical timing, camera, Bluetooth or sensing qualification.' >> "$GITHUB_STEP_SUMMARY"
