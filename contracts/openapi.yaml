openapi: 3.1.0
info:
  title: One The Go Detection Research API
  version: 0.1.0
  description: >-
    Proposed interface only; this repository does not implement or deploy this service.
    All operations require authenticated access and server-side study/role authorization.
    A client-created session UUID supports offline acquisition; registration validates its
    uniqueness and binds it to the authenticated context. Clients cannot authorize a
    model, modify outcome labels, assert calibration validity, or submit a probability.
    P0/P1 produce measurement-only results. Controlled research estimates additionally
    require approved enrollment, protocol, eligible inputs, and an active_research model.
    All writes require an Idempotency-Key scoped to actor, study, route, and key:
    identical retries return the original response; changed content returns 409.
servers:
  - url: https://api.example.invalid
    description: Reserved placeholder; no hosted service is represented.
security:
  - bearerAuth: []
paths:
  /v1/sessions:
    post:
      operationId: registerSession
      summary: Register a client-created session UUID
      description: Research mode and protocol are requests, never authorization grants.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RegisterSession'}}
      responses:
        '201':
          description: Session registered; ETag identifies the initial draft revision.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/SessionReceipt'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/sessions/{session_id}/snapshot:
    put:
      operationId: putSessionSnapshot
      summary: Store a draft snapshot using optimistic concurrency
      description: >-
        Snapshot identity must match the path and registered context. A finalized
        snapshot cannot be replaced. Stale If-Match or a state conflict returns 409.
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: './session.schema.json'}}
      responses:
        '200':
          description: Draft stored; new ETag and snapshot digest returned.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/SnapshotReceipt'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/sessions/{session_id}/finalize:
    post:
      operationId: finalizeSession
      summary: Freeze the matching snapshot and queue its permitted result path
      description: >-
        Digest must match the current canonical snapshot. Finalization checks immutable
        references and authorization; it does not establish measurement or clinical validity.
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/FinalizeRequest'}}
      responses:
        '202':
          description: Finalization accepted; result pending.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PendingResult'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/sessions/{session_id}/result:
    get:
      operationId: getSessionResult
      summary: Read a permitted session result or pending status
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      responses:
        '200':
          description: Result available; HTTP success does not imply a valid impairment estimate.
          content:
            application/json: {schema: {$ref: './result.schema.json'}}
        '202':
          description: Accepted result work remains pending.
          headers: {Retry-After: {$ref: '#/components/headers/RetryAfter'}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/PendingResult'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/artifact-uploads:
    post:
      operationId: requestArtifactUpload
      summary: Request a short-lived private artifact upload destination
      description: >-
        Requires an authorized research role and server-verified consent and retention
        references for this study/session. Submitted IDs do not themselves grant permission.
        The server enforces artifact type and size policy before issuing a destination.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ArtifactUploadRequest'}}
      responses:
        '201':
          description: Private upload ticket issued; object is not yet eligible for processing.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ArtifactUploadTicket'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/artifact-uploads/{artifact_id}/complete:
    post:
      operationId: completeArtifactUpload
      summary: Verify an uploaded object's digest, size, and media type
      description: Server compares the stored object with the ticket and request before acceptance.
      parameters:
        - {$ref: '#/components/parameters/ArtifactId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ArtifactCompletion'}}
      responses:
        '200':
          description: Upload verified; study/method eligibility remains independently enforced.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ArtifactReceipt'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/research/lab-imports:
    post:
      operationId: importLaboratoryMeasurements
      summary: Import normalized reference-laboratory measurements for review
      description: >-
        Research laboratory-import role required. Study/session/sample relationships and
        source_report_artifact_id are verified server-side. Measurements must have verified
        reference_lab provenance. Import cannot overwrite finalized inputs or supply outcomes.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/LabImportRequest'}}
      responses:
        '202':
          description: Import recorded for review; not yet eligible as finalized model input.
          content:
            application/json: {schema: {$ref: '#/components/schemas/LabImportReceipt'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/model-manifests/{model_id}:
    get:
      operationId: getModelManifest
      summary: Read an authorized model manifest
      description: Reading a manifest cannot activate or authorize execution of its model.
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: Permitted registry manifest.
          content:
            application/json: {schema: {$ref: './model_manifest.schema.json'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Server validates token identity, study scope, role, and current authorization.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque unique write key; identical retries retain the same key and payload.
      schema: {type: string, minLength: 1, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact current strong ETag; wildcard replacement is not permitted.
      schema: {type: string, pattern: '^"[^"\r\n]+"$'}
    SessionId:
      name: session_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    ETag:
      description: Strong opaque revision identifier for optimistic concurrency.
      schema: {type: string, pattern: '^"[^"\r\n]+"$'}
    RetryAfter:
      description: Suggested seconds before retrying; no fixed processing-time guarantee.
      schema: {type: integer, minimum: 1}
  schemas:
    Digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    RegisterSession:
      type: object
      additionalProperties: false
      required: [session_id, mode, protocol_id]
      properties:
        session_id: {type: string, format: uuid}
        mode: {type: string, enum: [synthetic, analytical, controlled_research]}
        protocol_id: {type: [string, 'null'], minLength: 1}
    SessionReceipt:
      type: object
      additionalProperties: false
      required: [session_id, state, snapshot_version]
      properties:
        session_id: {type: string, format: uuid}
        state: {type: string, const: draft}
        snapshot_version: {type: integer, minimum: 0}
    SnapshotReceipt:
      type: object
      additionalProperties: false
      required: [session_id, snapshot_version, snapshot_sha256]
      properties:
        session_id: {type: string, format: uuid}
        snapshot_version: {type: integer, minimum: 1}
        snapshot_sha256: {$ref: '#/components/schemas/Digest'}
    FinalizeRequest:
      type: object
      additionalProperties: false
      required: [snapshot_sha256]
      properties: {snapshot_sha256: {$ref: '#/components/schemas/Digest'}}
    PendingResult:
      type: object
      additionalProperties: false
      required: [session_id, state]
      properties:
        session_id: {type: string, format: uuid}
        state: {type: string, const: pending}
    ArtifactUploadRequest:
      type: object
      additionalProperties: false
      required: [study_id, session_id, consent_record_id, retention_policy_id, artifact_kind, sha256, size_bytes, media_type]
      properties:
        study_id: {type: string, minLength: 1}
        session_id: {type: string, format: uuid}
        consent_record_id: {type: string, minLength: 1}
        retention_policy_id: {type: string, minLength: 1}
        artifact_kind: {type: string, enum: [eye_video, ecg_waveform, source_lab_report]}
        sha256: {$ref: '#/components/schemas/Digest'}
        size_bytes: {type: integer, minimum: 1}
        media_type: {type: string, minLength: 3}
    ArtifactUploadTicket:
      type: object
      additionalProperties: false
      required: [artifact_id, upload_url, upload_method, expires_at, required_headers]
      properties:
        artifact_id: {type: string, format: uuid}
        upload_url: {type: string, format: uri, description: Expiring private destination generated by the future service.}
        upload_method: {type: string, const: PUT}
        expires_at: {type: string, format: date-time}
        required_headers: {type: object, additionalProperties: {type: string}}
    ArtifactCompletion:
      type: object
      additionalProperties: false
      required: [sha256, size_bytes, media_type]
      properties:
        sha256: {$ref: '#/components/schemas/Digest'}
        size_bytes: {type: integer, minimum: 1}
        media_type: {type: string, minLength: 3}
    ArtifactReceipt:
      type: object
      additionalProperties: false
      required: [artifact_id, state, sha256]
      properties:
        artifact_id: {type: string, format: uuid}
        state: {type: string, const: verified}
        sha256: {$ref: '#/components/schemas/Digest'}
    LabImportRequest:
      type: object
      additionalProperties: false
      required: [study_id, session_id, source_report_artifact_id, measurements]
      properties:
        study_id: {type: string, minLength: 1}
        session_id: {type: string, format: uuid}
        source_report_artifact_id: {type: string, format: uuid}
        measurements: {type: array, minItems: 1, items: {$ref: './measurement.schema.json'}}
    LabImportReceipt:
      type: object
      additionalProperties: false
      required: [import_id, session_id, state]
      properties:
        import_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        state: {type: string, const: pending_review}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string, description: Safe description without identifiers or raw health payloads.}
        request_id: {type: string, minLength: 1}
        retryable: {type: boolean}
  responses:
    BadRequest:
      description: Malformed request or required header missing.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthenticated:
      description: Authentication absent or invalid.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Authenticated actor lacks the required study scope, role, or current authorization.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Resource is absent or its existence is not disclosed to this actor.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: State, identity, digest, revision, or idempotency conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unprocessable:
      description: Structurally parsed request violates semantic or compatibility rules.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    RateLimited:
      description: Request rate limit exceeded.
      headers: {Retry-After: {$ref: '#/components/headers/RetryAfter'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: Temporary service unavailability; retry only according to the response policy.
      headers: {Retry-After: {$ref: '#/components/headers/RetryAfter'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
